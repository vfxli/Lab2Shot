"E-TWOSTAGETRANSFORMER-KEYGAP.other" = "关键帧 {first} 和 {second} 相隔 {seconds:.1f} 秒，「Two-stage Transformer 动作中间帧」两个关键帧最多隔 {max_seconds:.1f} 秒（30 帧/秒的 {max_frames} 帧）：在中间加关键帧，或者改用「Kimodo 动作生成」（模板「动作中间帧 · Kimodo」）"

[node."two_stage_transformer.inbetween"]
subtitle = "动作中间帧"
description = "Qin 等（SIGGRAPH Asia 2022）的两段式 Transformer：在动画师的关键帧之间补出动捕风格的自然动作，确定性（同样的关键帧永远得到同样的结果），毫秒级。每两个关键帧之间最多约 1.8 秒（30 帧/秒的 54 帧）；第一个关键帧前面的 10 帧上下文由前两个关键帧直线外推得到。"
official.note = "接进来的动画在上游是 positions + rotations 一对（同一段 515-520），补出来的是 pos_new + rot_new 一对（584）：一个「动画」口对应的就是这一对，不是两样东西。post_process 是官方的参数（517）。"
licence.note = "Two-stage Transformer 的官方模型权重用 Ubisoft LaFAN1 动捕数据（CC BY-NC-ND 4.0）训练，补出来的动作只能用于研究和评估。"
cost.whole = "毫秒级、一整段一起补，不是逐帧的活"

[node."two_stage_transformer.inbetween".param.post_process]
label = "衔接平滑"

[extension.two_stage_transformer]
summary = "两阶段动作中间帧：给上下文帧和一个目标帧，非自回归地生成长度可变的过渡；Context 出粗略，Detail 精修细节"
license.name = "MIT（代码）+ LaFAN1 CC BY-NC-ND 4.0（模型权重和数据）+ 模型权重仅限研究"
license.summary = "仅限研究。代码是 MIT，但官方预训练模型权重是用 Ubisoft 的 LaFAN1 动捕数据训练的，LaFAN1 是 CC BY-NC-ND 4.0（署名、非商用、禁止演绎），所以模型权重和补出来的动作只能用于研究和评估。安装时同时下载 LaFAN1 数据集（worker 从中读取骨骼和参考站姿）。要商用得用有授权的动捕数据重新训练"
weight.tst.note = "LaFAN1 上训练的 Context Transformer 和 Detail Transformer（非商用），214 MB"
weight.lafan1.note = "Ubisoft LaFAN1 动捕数据集（CC BY-NC-ND 4.0，研究用），144 MB：骨骼和参考站姿从这里读"

