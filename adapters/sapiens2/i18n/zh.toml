# Meta Sapiens2 extension: its words and messages in Chinese (the same keys as en.toml).

[node."sapiens2.segment"]
subtitle = "人体分割"
description = "人体专用：29 类身体部位分割（头发、脸、手臂、衣服……）、人物抠像 alpha 和解混后的前景色。整幅画面一起算。只要画面里的某个人，先用「ViTDet 人物框」→「人物框转遮罩」→「图像合成」（留下）把别处挡掉再接进来。「部位分割」接「多层 EXR 输出」写成 Cryptomatte（按官方英文部位名，如 Left_Upper_Arm），Nuke 里按部位取选区。"
official.note = "① 这个节点的口分散在官方两个演示脚本里，所以 cite 写了两条：alpha 和前景色在 vis_matting.py（一次前向出 4 个通道），「部位分割」在 vis_seg.py（`pred_labels = seg_logits.argmax(dim=1)`，`--save_pred` 存成 _seg.npy）。两个都是官方的。② 节点没有「人物框」输入：官方两个演示脚本的 argparse 只有 config / checkpoint / --input / --output / --save_pred / --device（vis_matting.py:19-29），整幅画面一起算，按框裁剪放大是我们自己加的一步，不放在解算器上。实测也说明它没带来什么：CRGNN 实拍 + VideoMatte 绿幕共 8 个人像镜头（人在画面里很大），按人裁剪和整幅一起算没区别（J&F 0.992 → 0.987，其中 2 个镜头略差）。"
licence.note = "Sapiens2 许可证可以商用，但禁止：深度伪造和冒充真人（真人换脸、假替身）、监控、生物特征识别和辨认身份、推断敏感信息、色情、军事用途；再分发要附许可证，发表时注明使用了 Sapiens。"

