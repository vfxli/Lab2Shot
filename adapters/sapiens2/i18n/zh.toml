[node."sapiens2.normal"]
subtitle = "人体法线"
description = "人体专用：人物身上每个像素的表面法线（摄影机空间），比通用模型更清楚衣褶和肌肉起伏。整幅画面一起算。只要画面里的某个人，先用「ViTDet 人物框」→「人物框转遮罩」→「图像合成」（留下）把别处挡掉再接进来。交出的是官方原值，人以外的地方也有数、只是没有意义；要只留人，接一张遮罩自己挡。"
official.note = "① 节点没有「人物框」输入：官方的 argparse 只有 config / checkpoint / --input / --output / --seg_dir / --device（vis_normal.py:19-37），整幅画面一起算，按框裁剪放大是我们自己加的一步，不放在解算器上。② 节点也没有「遮罩」输出：官方那里的 mask 是**读进来的**（--seg_dir 里已有的分割，vis_normal.py:59-89），而且只用在拼给人看的那张对比图上（:125 normal[mask == 0] = -1），**存下来的 .npy 法线是没有遮过的**（:122 np.save 在遮之前）。节点上的遮罩只能靠另外跑一次分割模型得到，属于我们自己造的输出；也不用遮罩把人以外的法线抹成 0——交出去的就是官方 np.save 的那一份，不加工（和前馈重建家族的深度贴图同一条规则）。"
licence.note = "Sapiens2 许可证可以商用，但禁止：深度伪造和冒充真人（真人换脸、假替身）、监控、生物特征识别和辨认身份、推断敏感信息、色情、军事用途；再分发要附许可证，发表时注明使用了 Sapiens。"

