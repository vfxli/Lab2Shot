[node."sapiens2.segment".port.foreground]
waits = "Turn on Fine Matte"
help = "The foreground colour with the background taken out (RGBA, premultiplied by alpha): the background and green-screen spill mixed into hair and semi-transparent edges was removed when the model unmixed them. Composite it as the foreground in Nuke and the edges no longer carry the old background's colour, which multiplying the plate by alpha cannot do. Wire it into Image Sequence Output to write an EXR"

