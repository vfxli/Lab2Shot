[node."sapiens2.normal"]
subtitle = "Body Normals"
description = "Humans only: a surface normal for every pixel on the person (camera space), showing clothing folds and muscle relief more clearly than general models. The whole image is processed at once. To keep only one person, first mask out everything else with ViTDet People Boxes → Person Boxes to Mask → Composite (Keep) and wire that in. The output is the official raw values: areas outside the person have values too, but they mean nothing; to keep only the person, mask it yourself."
official.note = "① The node has no People Boxes input: the official argparse has only config / checkpoint / --input / --output / --seg_dir / --device (vis_normal.py:19-37) and processes the whole image; cropping and enlarging per box would be a step of our own, so it is not put on the solver. ② The node has no Mask output either: the official mask is **read in** (an existing segmentation in --seg_dir, vis_normal.py:59-89) and used only for the side-by-side image made for viewing (:125 normal[mask == 0] = -1); **the saved .npy normals are unmasked** (:122 np.save comes before the masking). A mask on the node could only come from running another segmentation model, an output of our own making; nor is a mask used to zero the normals outside the person: the output is exactly what the official np.save writes, unprocessed (the same rule as the depth maps of the feed-forward reconstruction family)."
licence.note = "The Sapiens2 license allows commercial use but forbids deepfakes and impersonating real people (face swaps of real people, fake doubles), surveillance, biometric identification, inferring sensitive information, pornography and military use; redistribution must include the license, and publications must credit Sapiens."

[node."sapiens2.normal".param.model_size]
label = "Model Size"
option."1b" = "1B"
option."0.4b" = "0.4B"

[node."sapiens2.normal".stage]
write_maps = "Writing normals"

