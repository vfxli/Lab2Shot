# Meta Sapiens2 extension: its words and messages in English (the same keys as zh.toml).

[node."sapiens2.segment"]
subtitle = "Body Segmentation"
description = "Humans only: 29-class body-part segmentation (hair, face, arms, clothing…), a human alpha matte and the unmixed foreground color. The whole image is processed at once. To keep only one person, first mask out everything else with ViTDet People Boxes → Person Boxes to Mask → Composite (Keep) and wire that in. Wire Body Parts into Multi-Layer EXR Output to write a Cryptomatte (by the official English part names, such as Left_Upper_Arm) and pick parts as selections in Nuke."
official.note = "① This node's outputs come from two official demo scripts, hence two cites: alpha and the foreground color in vis_matting.py (one forward pass gives 4 channels), Body Parts in vis_seg.py (`pred_labels = seg_logits.argmax(dim=1)`, saved by `--save_pred` as _seg.npy). Both are official. ② The node has no People Boxes input: the argparse of both official demo scripts has only config / checkpoint / --input / --output / --save_pred / --device (vis_matting.py:19-29) and processes the whole image; cropping and enlarging per box would be a step of our own, so it is not put on the solver. Measurements agree that it gains nothing: on 8 portrait shots from CRGNN live action and VideoMatte green screen (people large in frame), cropping per person and processing the whole image are no different (J&F 0.992 → 0.987, 2 shots slightly worse)."
licence.note = "The Sapiens2 license allows commercial use but forbids deepfakes and impersonating real people (face swaps of real people, fake doubles), surveillance, biometric identification, inferring sensitive information, pornography and military use; redistribution must include the license, and publications must credit Sapiens."

