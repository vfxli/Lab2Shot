[node."sam_3d_body.solve"]
subtitle = "Full-Body Motion"
description = "Estimates a person's full-body motion (fingers included); the result is in camera space. With People Boxes wired (ViTDet People Boxes → Select People) only those people are solved and no detection runs; unwired, it detects everyone in the image itself (with the same detector as ViTDet People Boxes). Detection and model loading happen once; the people in a frame are solved in batches, every one of them. To keep only one person, put ViTDet People Boxes → Select People → Person Boxes to Mask → Composite before it to remove everyone else from the image. A Focal Length set on the node (or wired in) is used and makes the people's distance much more accurate. To place the result in a camera's world, follow with Camera Space. For a version 2.5–3x faster use Fast SAM 3D Body Full-Body Motion; for a world trajectory without foot skate use GVHMR Full-Body Motion. Also outputs a Camera: the pinhole camera the people are placed with, at the origin and still (focal length = Focal Length, or when empty the focal length it estimates from the image; principal point at the image center). It is not a solved camera: the 3D viewport looks through it at the image plane so the people line up with the image, and templates use it as the solver's camera."
official.ours.camera = "The pinhole camera the people are placed with: at the origin, still, focal length = the node's Focal Length (empty: the solver's own estimate / the default), principal point at the image center (families/humans.py plate_camera)"
official.note = "⓪ **People Boxes is an optional input, handed straight to the official function** (the rule: when the official function accepts boxes, the boxes go straight to it; projects whose function takes no boxes go through Person Boxes to Mask in the network). The official package's `SAM3DBodyEstimator.process_one_image(img, bboxes=None, …)` (sam_3d_body_estimator.py:64-75, **the official package's function, not ours**) takes boxes already; the official demo passes none (demo.py:88-91) only because it has no other boxes at hand, so it builds a HumanDetector of its own (:44-49). ViTDet People Boxes uses that very detector, so what comes in are still the official boxes, with only the Select People step in between (→ this input). Without boxes the worker follows the demo and detects people itself. The mask chain (Person Boxes to Mask → Composite) is for projects whose official function does **not** take boxes. ① **The official full set of MHR parameters is the Skinned Character output**: no separate type and no extra output (parametric bodies such as SMPL / SMPL-X / MANO / FLAME / MHR are skin + skin weights + skeleton animation, packed as a Skinned Character with no data type of their own, whatever their point or joint counts). Item by item (sam3dbody.py solve_person / evaluate / rig_data): `global_rot` + `body_pose_params` + `hand_pose_params` + `scale_params` + `shape_params` go back unchanged into MHR (head.mhr_forward → head.mhr) to evaluate the skeleton on every frame, which becomes the Skinned Character's per-frame joint matrices (npz joint_world); `mhr_model_params` is the intermediate set that same mhr_forward returns: the same output of the same function, not other data; `shape_params` also becomes the person's rest mesh (npz rest_vertices), with MHR's own skin weights and bind pose (npz skin_weights / skin_indices / bind_world); `pred_joint_coords` and `pred_global_rots` (= out['joint_global_rots']) are the joint positions and global rotations of the same skeleton, in the translate and rotate parts of joint_world; `pred_pose_raw` is the same pose before body_pose_params is converted to Euler, not other data. **Not one parameter is lost.** `expr_params` is **always zeroed by upstream itself** (`sam_3d_body/models/heads/mhr_head.py:316 pred_face = pred[:, count : count + self.num_face_comps] * 0`, and the same block at :306-307 zeroes the jaw too), so the Skinned Character has no expression blend shapes: not dropped by us, the official model never outputs them. `mask` exists only when the caller passes a mask in or turns on use_mask to have SAM 2 compute one (sam_3d_body_estimator.py:135-153); we do neither (worker.py node_solve passes only bboxes and cam_int), so on our path it is always None. Upstream also gives `pred_keypoints_2d` (the official 2D keypoints, already saved in the npz by the worker), which has no output yet; **it does not fit in a Skinned Character** (it is points on the image, not a skeleton). ② Upstream gives only focal_length (intrinsics) and pred_cam_t (the person's translation in the camera), never a solved camera. The Camera output is the still pinhole camera at the origin the people are placed with (its focal length is the one used), declared in ours: not solved; the 3D viewport looks through it at the image plane and templates use it as the solver's camera. For a real camera, wire one from a camera-solving node (ViPE, TRAM) or use USD Import; to place the people in that camera's world, follow with the core node Camera Space (camera_space). ③ cam_int (sam_3d_body_estimator.py:69) is intrinsics only: intrinsics (focal length, principal point) are not a camera input, only intrinsics plus extrinsics make a camera; it corresponds to the Known Focal Length and Aperture parameters, not a camera input."
cost.note = "VRAM taken from the measurement of the same model family, Fast SAM 3D Body; SAM 3D Body itself has not been measured"

