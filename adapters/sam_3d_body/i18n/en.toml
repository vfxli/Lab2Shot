# SAM 3D Body extension: its words and messages in English (the same keys as zh.toml; sam3dbody.py is shared with Fast SAM 3D Body).

# ---- people detection
"N-SAM3DBODY-NOPEOPLEFOUND" = "ViTDet People Boxes found no one in the image (Detection Threshold is {threshold:g}), so the boxes are empty: the nodes after it (Select People, Person Boxes to Mask, a solver's People Boxes input) have no boxes this time. For people far away, occluded or seen from behind, lower Detection Threshold to 0.5–0.6 and cook again"
"N-SAM3DBODY-NOPEOPLEFOUND.app" = "No person was detected in the image (Detection Threshold is {threshold:g}), so there is nobody to solve this time: when people are far away, blocked or seen from behind, lower Detection Threshold to 0.5–0.6 and cook again"

# ---- solve
"N-SAM3DBODY-NOBODYCHOSEN" = "The wired People Boxes hold no one: there is nobody to solve this time. To solve everyone in the image, set Select People to All, or leave People Boxes unwired"
"N-SAM3DBODY-UNSOLVEDFRAMES.one" = "{missing} of {frames} frames has no solve for person {person}; the person is not shown on that frame"
"N-SAM3DBODY-UNSOLVEDFRAMES.other" = "{missing} of {frames} frames have no solve for person {person}; the person is not shown on those frames"

