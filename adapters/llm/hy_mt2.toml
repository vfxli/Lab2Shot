# Hy-MT2's prompt, as its README gives it (third_party/llm/hy_mt2/README.md:76-77, "Default Translation", Chinese
# prompt): data the model reads, not words a person reads. Languages are written in full, by their Chinese names in a
# Chinese prompt (the README's rule); the node's 「target_lang」 option ids map to them here.
prompt = "将以下文本翻译为{lang}，注意只需要输出翻译后的结果，不要额外解释：\n\n{text}"

[languages]
