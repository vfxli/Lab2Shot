# The SAM 3 extension's own words and messages in Chinese (the same keys as en.toml).

"E-SAM3-WEIGHTSINCOMPLETE" = "SAM 3 模型权重不完整（{path} 缺失或不到 3 GB，多半是下载中断）：重新安装一次"
"E-SAM3-NOLICENSE" = "SAM 3 模型权重缺少 LICENSE 文件（SAM License 要求许可证跟着模型权重走）：重新安装一次"
"E-SAM3-NOPROMPT" = "「SAM 3 视频分割」不知道要分割什么：在「提示词」填英文短语（如 person），或接入人物框"
"N-SAM3-NOBOXES" = "接入的人物框里没有一个框落在这段画面（第 {first}–{last} 帧）里，「SAM 3 视频分割」这次遮罩是空的：上游没检测到人时这是正常的；否则检查人物框和画面是不是同一段镜头"
"W-SAM3-TOOMANYPEOPLE.other" = "人物框里有 {count} 个人，超过「最多物体数」{max_objects}：只分割出现帧数最多的 {people} 号；都要的话把「最多物体数」调大"
"N-SAM3-EMPTY" = "SAM 3 在整段画面里没有找到物体，遮罩是空的：换个「提示词」，或调低「检测阈值」"
"N-SAM3-PERSONEMPTY" = "人物框里的 {person} 号，SAM 3 没有分割出遮罩，已略过"
"W-SAM3-TOOMANYOBJECTS.other" = "SAM 3 找到 {count} 个物体，超过「最多物体数」，只保留出现帧数最多的 {max_objects} 个；都要的话把「最多物体数」调大"

[node."sam3.segment"]
subtitle = "视频分割"
description = "画面 → 按文字（英文，如 person、car）或接入的人物边界框找出的物体，整段镜头跟住，输出所有物体合在一起的遮罩和按物体编号区分的分割图。边缘是硬边，够做选区和引导，不是发丝级抠像；「物体分割」接「多层 EXR 输出」写成 Cryptomatte，每个物体按提示词和编号命名（如 person_01），Nuke 里按名字取。只挡真正在动的物体用「SegAnyMo 运动物体遮罩」，要发丝软边接「MatAnyone 2 精细抠像」精修。"
official.note = "文字提示（text_str）是上游预测器的提示，我们做成了节点参数「提示词」而不是输入口；人物框不是预测器的 bounding_boxes 提示，而是跟踪器的框提示（add_new_points_or_box），每人一个、按人分会话跑。"
licence.note = "SAM License：可以商用；禁止军事、武器等用途；发表时注明使用了 SAM 3；再分发要附许可证原文。"

[node."sam3.segment".port.mask]
label = "遮罩"

[node."sam3.segment".param.prompt]
label = "提示词"

[node."sam3.segment".param.max_objects]
label = "最多物体数"

[node."sam3.segment".param.threshold]
label = "检测阈值"

[stage]
segment_track = "分割跟踪"
write_masks = "写出遮罩"

[extension.sam3]
summary = "可提示分割的统一基础模型，画面和视频都管：用文字，或点、框、遮罩这类视觉提示，检出、分割并跟住物体"
license.name = "SAM License"
license.summary = "代码和模型权重同一份 SAM License：允许商用、修改和再分发（再分发须附带许可证原文）；发表论文须注明使用了 SAM 3；禁止军事、战争、核工业、间谍、武器等用途，须遵守美国等出口管制和制裁；不得逆向工程；对 Meta 提起知识产权诉讼则许可自动终止；无任何担保。模型权重在 Hugging Face 上需先申请访问"
weight.sam3.note = "SAM 3 检测+跟踪模型权重（3.4 GB，SAM License）；需先在 https://huggingface.co/facebook/sam3 申请访问"
weight.sam31.note = "SAM 3.1 检测+跟踪模型权重（3.5 GB，SAM License，提示词模式用）；需先在 https://huggingface.co/facebook/sam3.1 申请访问"
