# VGGT 扩展自己的界面字和消息（中文）。

[node."vggt.reconstruct"]
subtitle = "深度与摄影机"
description = "画面 → 每帧摄影机和深度贴图（Meta VGGT，CVPR 2025 最佳论文），一次看整段画面。尺度要手动缩放，按「尺度」参数换算成厘米；长镜头分段拼接。精度低于「Pi3 深度与摄影机」，显存占用更小，适合快速出点云做交叉检验。点云是每帧一张点图（官方原生的点图，放回这一帧自己的摄影机里），不是整段一套：官方没有合成一份场景点云的输出。"
official.note = "「点云」是官方点头出的世界点图 world_points（vggt.py:45）：worker 把它放回每一帧的摄影机空间再交出来（无损，只是换坐标系），由家族按摄影机摆回世界。没有遮罩或人物边界框输入口：上游 forward 只有 images 和 query_points 两个入参（vggt.py:29），遮罩进不了模型；想局部重建，在送进去之前把其余部分涂黑：「ViTDet 人物框」→「人物框转遮罩」→「图像合成」（留下）→ 这个节点的「RGB」口。没有的口：track / vis（vggt.py:50-51），它们要 query_points，这个节点没有那个输入"
licence.note = "代码是 VGGT License（可商用，禁止军事用途）；原版模型权重 CC-BY-NC-4.0 非商用，商用版模型权重（需申请）可以商用。"

