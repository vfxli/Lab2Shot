# The MonST3R extension's messages (adapters/monst3r) in English (the same keys as zh.toml).

# ---- loading the model (worker.py)
"E-MONST3R-RAFTWEIGHTS" = "The SEA-RAFT optical flow weights MonST3R uses do not match the network ({missing} missing, {unexpected} unexpected): the weights and the code are of different versions; an administrator should run lab2shot ext install monst3r again"
"E-MONST3R-CROCO" = "MonST3R's croco submodule is incomplete (not fully fetched at install): an administrator should run lab2shot ext install monst3r once more"

# ---- reconstruction (worker.py)
"E-MONST3R-STITCH" = "MonST3R could not stitch the segments: the overlapping frames hold too few usable static points to align the two segments. Raise Max Frames per Segment (fewer segments) and cook again"
"W-MONST3R-FLOWDROPPED" = "Frames {first}–{last} move too much (or are too blurry) to match from frame to frame: the image motion could not constrain the camera over this stretch, and the camera position may drift. Lower Step, use a stretch that moves less, or solve it once with vipe.camera_solve to compare"
"W-MONST3R-SEAM" = "MonST3R is still {residual:.1%} off (relative to depth) after stitching the segments at frames {first}–{last}: the camera may jump a frame at the seam. Raise Max Frames per Segment for fewer segments"

# ---- words

[stage]
pairs = "{count} Image Pairs"
global_optimization = "Global Optimization"
read_frames = "Read Frames"
reconstruct = "Reconstruct"
reconstruct_segment = "Reconstruct (Segment {segment}/{segments})"

[node."monst3r.reconstruct"]
subtitle = "Depth and Camera"
description = "Image → a camera per frame, depth maps and a moving-object mask, by global optimization segment by segment, designed for shots with people or cars moving in the picture. Most stable with a locked-off camera; very slow (about 3 s a frame) and heavy on GPU memory; the scale must be set by hand, converted to centimetres by Scale; when a focal length is given it is held fixed rather than optimized, and the camera is steadier. Other whole-shot solvers are colmap.camera_solve (needs parallax) and vipe.camera_solve (needs translation); this one fills the gap of a locked-off camera with moving objects. No point cloud: the official network only gives point maps between pairs of images, and the whole-shot point cloud is what its optimizer unprojects from depth; for a point cloud, follow it with depth_to_points. Long shots go segment by segment (36 frames by default): each segment is solved on its own, consecutive segments share 8 frames and are joined on them, and later segments keep the first segment's focal length. Only the current segment's frame pairs and optical flow are on the GPU (upstream running a whole shot at once keeps all of them; its README: about 23 GB for 65 frames of 16:9), so long shots fit."

