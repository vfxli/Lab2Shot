[node."monst3r.reconstruct".official]
note = "The mask path is official: upstream already accepts an external moving-object mask (demo.py:107 dynamic_mask_path). Upstream only takes the mask image form, no boxes, so the node has no bounding box input; to block out people, wire mask_from_boxes into the Moving Object Mask input, a step that stays visible on the node graph. The Moving Object Mask output is the one the official save_dynamic_masks gives (demo.py:159)"

[extension.monst3r]
summary = "Handles dynamic video: gives, essentially feed-forward, a dynamic point cloud changing over time, plus each frame's camera pose and intrinsics"

[extension.monst3r.license]
name = "CC BY-NC-SA 4.0 (code and weights); with SEA-RAFT (BSD-3-Clause) and SAM 2.1 (Apache-2.0)"
summary = "Noncommercial: the MonST3R code and weights are released under CC BY-NC-SA 4.0 (attribution, no commercial use, adaptations under the same license). It builds on Naver DUSt3R / CroCo (also CC BY-NC-SA 4.0; CroCo's pos_embed.py / blocks.py also contain CC BY-NC 4.0 parts from Meta MAE and Apache-2.0 parts from timm), and its weights are fine-tuned from the DUSt3R weights. The two other models it uses allow commercial use: the SEA-RAFT optical flow (code and weights BSD-3-Clause, Princeton) and SAM 2.1 Hiera-L (code and weights Apache-2.0, Meta; its connected-components code cc_torch is BSD-3-Clause). Taken as a whole it is treated as the strictest, CC BY-NC-SA 4.0. No other dependencies such as SMPL or nvdiffrast"

[extension.monst3r.weight.monst3r-config]
note = "MonST3R network configuration"

[extension.monst3r.weight.monst3r]
note = "MonST3R ViT-L 512 DPT weights (2.3 GB, CC BY-NC-SA 4.0, noncommercial)"

[extension.monst3r.weight.sea-raft-spring-M]
note = "SEA-RAFT optical flow Tartan-C-T-TSKH-spring540x960-M (79 MB, BSD-3-Clause)"

[extension.monst3r.weight."sam2.1-hiera-large"]
