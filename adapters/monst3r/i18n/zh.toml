# MonST3R 扩展包（adapters/monst3r）的消息。一行一条：编号 = 模板。

# ---- 加载模型（worker.py）
"E-MONST3R-RAFTWEIGHTS" = "MonST3R 用的 SEA-RAFT 光流权重和网络对不上（缺 {missing}，多 {unexpected}）：权重和代码的版本不一致，管理员重新执行 lab2shot ext install monst3r"
"E-MONST3R-CROCO" = "MonST3R 的 croco 子模块不完整（安装时没有拉全）：管理员再执行一次 lab2shot ext install monst3r"

# ---- 重建（worker.py）
"E-MONST3R-STITCH" = "MonST3R 分段拼接失败：重叠帧里可用的静止点太少，两段对不齐。把「每段最多帧数」调大（分段更少）再算"
"W-MONST3R-FLOWDROPPED" = "第 {first}–{last} 帧画面动得太厉害（或者太糊），帧与帧之间对不上：这一段没能靠画面的运动把摄影机约束住，摄影机位置可能飘。办法：把「隔帧」调小、换一段动得没这么厉害的帧，或者用「ViPE 摄影机解算」解一遍对比"
"W-MONST3R-SEAM" = "MonST3R 在第 {first}–{last} 帧处分段拼接后还差 {residual:.1%}（相对景深）：分段处摄影机可能跳一帧。把「每段最多帧数」调大，分段更少"

# ---- words (node texts from nodes.json and nodes.py, extension texts from extension.py)

[stage]
pairs = "{count} 对画面"
global_optimization = "全局优化"
read_frames = "读取画面"
reconstruct = "重建"
reconstruct_segment = "重建（第 {segment}/{segments} 段）"

[node."monst3r.reconstruct"]
subtitle = "深度与摄影机"
description = "画面 → 每帧摄影机、深度贴图和运动物体遮罩，逐段做全局优化，专为画面里有人车在动的镜头设计。固定机位最稳；很慢（约 3 秒一帧）、显存要得多；尺度要手动缩放，按「尺度」换算成厘米；给了焦距时焦距固定不再优化，摄影机更稳。同样整段解算的还有「COLMAP 摄影机解算」（要视差）和「ViPE 摄影机解算」（要位移），它补的是固定机位加运动物体这一格。不出点云：官方网络只交两两画面间的点图，整段的点云是它的优化器用深度反投影的；要点云接「深度转点云」。长镜头逐段解算（默认每段 36 帧）：每段单独优化，相邻两段共用 8 帧、按这几帧拼起来，焦距沿用第一段的。显卡上只放当前这一段的画面对和光流（官方一次跑整段要全部常驻，README：16:9 的 65 帧就要约 23 GB），长镜头也放得下。"

