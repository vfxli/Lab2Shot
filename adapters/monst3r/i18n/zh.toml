[node."monst3r.reconstruct".official]
note = "遮罩这一路是官方的：上游本来就能收外来的运动物体遮罩（demo.py:107 dynamic_mask_path）。上游只有遮罩图这一种形式，没有框，所以节点没有人物框输入口；要挡人就接「人物框转遮罩」到「运动物体遮罩」口，那一步在节点图上看得见。「运动物体遮罩」输出就是官方 save_dynamic_masks 交的那一张（demo.py:159）"

[extension.monst3r]
summary = "处理动态视频，基本以前馈的方式给出随时间变化的动态点云，以及每帧的摄影机位姿和内参"

