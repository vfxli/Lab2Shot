# TRAM 全身动作（adapters/tram/worker.py）。

# ---- 画面和人
"I-TRAM-VIMOWINDOW" = "它的 VIMO 网络一次看 {need:d} 帧"
"N-TRAM-NOPEOPLE" = "「TRAM 全身动作」自带的检测（ViTDet + SAM + DEVA）在画面里没有找到持续出现的人，这次输出是空的：确认画面里有完整的人，人太小或一直被挡住它就找不到"
"N-TRAM-NOLONGTRACK" = "「TRAM 全身动作」找到的人都没有连续出现 {frames} 帧以上（它至少要连续 {frames} 帧才能算一个人），这次输出是空的：人被挡住或走出画面会把这一段打断，换一段人出现得更久的镜头"
"N-TRAM-SHORTTRACK" = "人物 {person} 没有连续出现 {frames} 帧以上的片段，「TRAM 全身动作」算不了他，这个人跳过"

# ---- 相机
"W-TRAM-STATIC" = "「TRAM 全身动作」判断这段是固定机位（DROID-SLAM 解算时没有产生第二个关键帧），相机按不动处理：如果镜头其实在动，人在世界里的位置会跟着画面漂，检查这段素材有没有真正的位移（纯摇、长焦压缩的镜头视差很小），并在「已知 Focal Length」里填实拍 Focal Length"
