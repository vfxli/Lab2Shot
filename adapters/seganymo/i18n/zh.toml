# SegAnyMo extension: its words and messages in Chinese (the same keys as en.toml).

# ---- 输入画面
"I-SEGANYMO-WHYMOTION" = "要看画面里的物体怎么动"
"E-SEGANYMO-UNREADABLE" = "「SegAnyMo 运动物体遮罩」读不了第 {frame} 帧的画面：重新计算一次；还不行，把参数面板里这个节点的日志发给开发者"

# ---- 结果
"N-SEGANYMO-EMPTY" = "「SegAnyMo 运动物体遮罩」没有找到在动的物体，遮罩是空的：物体动得慢或只动了一小段时，调大「分析帧数」、调小「查询间隔」再试"
"I-SEGANYMO-FOUND.other" = "SegAnyMo 找到 {count:d} 个在动的物体（分析了 {frames:d} 帧）"

[node."seganymo.motion_segment"]
subtitle = "运动物体遮罩"
description = "画面 → 真正在动的物体的遮罩和按物体编号的分割图（走动的人、开动的车、动物、被搬动的物体），整段镜头都有。判断的是动没动，不是它属于哪一类：停着的车、站着不动的人不算；边来自 SAM 2，够挡解算，不是精细抠像。接到摄影机解算（COLMAP、ViPE、VGGT……）的「运动物体遮罩」上，让解算只看不动的背景；要连不动的同类一起挡，用「SAM 3 视频分割」按提示词挑。"
official.note = "上游整条链（深度、轨迹、DINO 特征、运动分割、SAM 2 分组）都从同一份画面自己算出来，除了画面不吃别的东西。"
licence.note = "代码 MIT；用到的模型 SAM 2、DINOv2、BootsTAPIR、Depth Anything V2 Small 都可以商用。训练数据含研究数据集，严格的商业交付前建议做一次法务确认。"
cost.note = "多个模型一起跑的流水线"

[node."seganymo.motion_segment".param.resolution]
label = "处理分辨率"

[node."seganymo.motion_segment".param.analysis_frames]
label = "分析帧数"

[node."seganymo.motion_segment".param.query_step]
label = "查询间隔"

[node."seganymo.motion_segment".port.mask]
label = "运动物体遮罩"

[node."seganymo.motion_segment".port.objects.class]
moving = "运动物体 {id}"

[extension.seganymo]
summary = "运动物体分割：把长距离轨迹的运动线索和 DINO 的语义特征结合起来，再用 SAM 2 把结果加密到像素级"
license.name = "MIT"
license.summary = "代码 MIT，可以商用；运动分类模型 moseg.pth 由作者随代码发布（Hugging Face 上没有另写许可证）。用到的其他模型也都可以商用：SAM 2 和 DINOv2 是 Apache-2.0，BootsTAPIR 代码 Apache-2.0、模型权重 CC-BY-4.0（署名 Google DeepMind），深度用 Depth Anything V2 Small（Apache-2.0），不用原作者的 Large（CC-BY-NC）。训练数据有 Kubric、Dynamic Replica、HOI4D、Waymo 等研究数据集，严格的商业交付前建议做一次法务确认"
weight.moseg.note = "运动分类模型 moseg（14 MB，随 MIT 代码发布）"
weight.sam2_hiera_large.note = "SAM 2 Hiera-L（0.9 GB，Apache-2.0）：把运动的点连成整块物体遮罩并整段跟踪"
weight.bootstapir.note = "BootsTAPIR 点跟踪（0.2 GB，CC-BY-4.0）"
weight.dinov2_vitb14.note = "DINOv2 ViT-B/14（0.3 GB，Apache-2.0）"
weight.dav2_small_model.note = "Depth Anything V2 Small（0.1 GB，Apache-2.0）：运动分类用的深度"

