# 这个扩展包自己的界面字和消息（中文）。

[stage]
background_matte = "背景遮罩"
background_matte_rvm = "背景遮罩（Robust Video Matting）"
solve = "解算"

# ---- words (node texts from nodes.json and nodes.py, extension texts from extension.py)

[node."faceanything.face_maps"]
subtitle = "面部通道"
description = "画面 → 逐像素的面部深度贴图、规范面部坐标、面部遮罩、摄影机和点云。适合脸占画面较大的特写，处理分辨率长边约 504 像素；深度贴图是模型自己的尺度，要手动缩放。要能驱动角色的表情曲线，用「MediaPipe 面部动作」或「SMIRK 面部动作」。"

[node."faceanything.face_maps".param.mode]
label = "方式"

[node."faceanything.face_maps".param.mode.option]
chunk = "分段"
one_by_one = "逐帧"

[node."faceanything.face_maps".param.max_frames]
label = "每段最多帧数"

[node."faceanything.face_maps".param.max_frames.option]
8 = "8"
16 = "16"
24 = "24"

[node."faceanything.face_maps".param.resolution]
label = "处理分辨率"

[node."faceanything.face_maps".param.resolution.option]
504 = "标准 504"

[node."faceanything.face_maps".port.image]
label = "RGB"

[node."faceanything.face_maps".port.canonical]
label = "规范坐标"

[node."faceanything.face_maps".port.mask]
label = "面部遮罩"

[node."faceanything.face_maps".stage]
write_maps = "写出规范坐标和面部遮罩"

[node."faceanything.face_maps".official]
note = "「面部遮罩」就是上游那张前景遮罩（predict.py:19 valid）；上游自己用 Robust Video Matting 生成它（run_inference.py:--remove-background，src/faceanything/background.py:18-61 generate_masks），我们的 worker 照着做同一步。「摄影机」只用它的 intrinsics：上游默认 monocular=True，把预测的 extrinsics 换成单位阵（predict.py:42-45）"

[extension.faceanything]
summary = "统一的前馈模型，从任意图像序列做高保真的 4D 面部重建和稠密跟踪；做法是逐像素预测规范面部坐标"

[extension.faceanything.license]
name = "CC BY-NC 4.0（非商用）"
summary = "非商用：代码和权重均为 CC BY-NC 4.0，不能用于商业制作（含商业项目的镜头）。模型主干 Depth Anything 3 Giant 同为 CC BY-NC 4.0，训练数据来自 FLAME 模型拟合（FLAME 许可证同样只允许非商业科研），商用授权需分别联系作者。背景遮罩用 Robust Video Matting（代码和权重为 GPL-3.0：可商用，但修改后分发需同样以 GPL-3.0 开源）。注意：原仓库 pyproject.toml 写着 Apache-2.0，以仓库 LICENSE 文件和 Hugging Face 权重页的 CC BY-NC 4.0 为准"

[extension.faceanything.weight.faceanything]
note = "FaceAnything 模型（Depth Anything 3 Giant 主干 + 规范坐标头，约 15 GB；CC BY-NC 4.0）"

