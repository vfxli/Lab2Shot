# AnyCalib 扩展包（adapters/anycalib）的消息。一行一条：编号 = 模板。

# ---- 节点（nodes.py）
"I-ANYCALIB-LENS" = "AnyCalib 估的镜头：{lens}"
"I-ANYCALIB-LENSFOV" = "AnyCalib 估的镜头：{lens}，水平视角 {hfov:.1f}°"

# ---- 标定（worker.py）
"E-ANYCALIB-MODEL" = "AnyCalib 不支持镜头模型 {model}：能用的有 {models}（带 :k 的写成如 radial:2）。在「拟合模型」里换一个"
"E-ANYCALIB-SIZES" = "AnyCalib 取样的画面尺寸不一致（{sizes}）：一个镜头的画面必须同样大小，检查上游是不是接了几段不同的素材"
"E-ANYCALIB-NOFIT" = "AnyCalib 在所有取样帧上都拟合失败：在「拟合模型」里换一个畸变系数少一些的模型（比如「径向 k1」或「无畸变」），或换一套网络权重再试"
"N-ANYCALIB-FAILEDFRAMES" = "AnyCalib 有 {failed}/{sampled} 个取样帧拟合失败，已跳过：镜头按其余帧的中位数算"
"N-ANYCALIB-UNCONVERGED" = "AnyCalib 有 {count} 个取样帧的精细拟合没有收敛，这些帧保留了线性拟合的结果（通常也够用）"
"W-ANYCALIB-FOCALSPREAD" = "AnyCalib 在各取样帧上估的 Focal Length 差别较大（中位绝对偏差 {spread:.1%}）：镜头可能在变焦，或画面缺少直线、结构。输出的是中位数；镜头确实在变焦的话，这个节点给不出逐帧的 Focal Length"
"W-ANYCALIB-LONGLENS" = "AnyCalib 估的是长焦画面（对角视场约 {fov:.0f}°）：长焦画面几乎看不出镜头畸变，估出的畸变系数不可靠。手机或已校正过的素材，把「拟合模型」换成「无畸变」"
"W-ANYCALIB-COVERAGE" = "按 AnyCalib 估的畸变去畸变后，画面只有 {share:.0%} 能从原画面取到（其余是黑边）：畸变很强，或者估计失败了。在视图里看一眼去畸变 ST-map；不对的话换一个「拟合模型」"
