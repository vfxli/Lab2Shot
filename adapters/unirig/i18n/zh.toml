# UniRig 扩展自己的界面字和消息（中文）。编号 = 模板，代码里只写编号和参数。
"E-UNIRIG-SKELETONFAILED" = "UniRig 的「骨架」这一步失败了（退出码 {code}）：这次计算的 worker 日志里有原因"
"E-UNIRIG-SKINFAILED" = "UniRig 的「蒙皮权重」这一步失败了（退出码 {code}）：这次计算的 worker 日志里有原因"
"E-UNIRIG-FRAME" = "对不上 UniRig 内部的归一化坐标（残差 {residual}）：适配层按「整体缩放 + 平移」解这个坐标，UniRig 的归一化和它对不上。先别用这个结果"
"E-UNIRIG-FRAMEPOINTS" = "对不上 UniRig 内部的归一化坐标：归一化前后的点对不上（前 {before} 个、后 {after} 个，或所有点重合在一处），解不出这个坐标。先别用这个结果"
"N-UNIRIG-SIMPLIFIED.other" = "网格有 {faces} 个面，按 UniRig 官方的做法先降到 {used} 个面再算骨架和蒙皮权重；蒙皮权重最后铺回原来那张网格的每一个顶点，一个面都没少"

[node."unirig.auto_rig"]
subtitle = "自动绑定"
description = "UniRig：给一块没有骨骼的网格自动生成骨架并刷好蒙皮权重，交出能动起来的蒙皮角色。人、动物、道具用同一个模型（在 Articulation-XL 2.0 上训练）；骨架由自回归 transformer 逐根骨头写出来，所以一定是一棵合法的骨骼树，换一个「随机种子」就是另一副骨架。网格、UV、分区和材质原样保留，只多出骨架和蒙皮。模型给的骨骼名是 bone_0、bone_1…（这一版公开的模型权重不带部位名）；交出时按骨架形状认出身体部位，改成 Maya HumanIK / Mixamo 的名字（Hips、LeftArm……），HumanIK 能直接认，也可选保留原始名。"
official.note = "「蒙皮角色」这一个口对应上游第二阶段写出的 predict_skin.npz（RawSkin：skin / vertices / joints，src/system/skin.py:277-278）加第一阶段的 predict_skeleton.npz（joints / parents / names，src/system/ar.py:343-345）——官方就是靠这两份 npz 合成一副能动的绑定，没有别的产物。"
cost.whole = "一块网格算一次，不按帧算：骨架和蒙皮权重两个阶段各跑一遍，约一分钟"

[node."unirig.auto_rig".param.seed]
label = "随机种子"

[node."unirig.auto_rig".param.template]
label = "骨架模板"
help = "人形角色选「人形」：骨骼按 VRoid 模板生成。「自动」由模型自己判断骨架。两种交出的骨骼名都按「骨骼命名」。动物、道具等非人形用「自动」。"
option.auto = "自动（模型自己判断）"
option.vroid = "人形（VRoid 模板）"

[extension.unirig]
summary = "自动绑定的统一框架，给三维网格生成骨架并预测蒙皮权重，两件事分成两个阶段做"
license.name = "MIT（UniRig 代码和模型权重）+ GPL-3.0（仓库里自带的 Michelangelo 形状编码器）"
license.summary = "可商用。UniRig 自己的代码和两个模型权重都是 MIT（模型权重在 Hugging Face VAST-AI/UniRig，模型卡写明 MIT），训练数据是 Articulation-XL 2.0（从 Objaverse-XL 里筛出来的带骨骼模型）。要注意：仓库里带的形状编码器 src/model/michelangelo 是 GPL-3.0（两个阶段都用它），Pointcept 点云 transformer 是 MIT。GPL-3.0 不限制拿结果去做商业镜头，限制的是再分发这份软件本身；Lab2Shot 只在本机运行、不分发它，所以交付物可以商用。其余依赖：spconv Apache-2.0、FlashAttention BSD-3-Clause、Open3D MIT、trimesh MIT"
weight.unirig.note = "UniRig 骨架网络（1.4 GB）和蒙皮权重网络（4.6 GB），都在 Articulation-XL 2.0 上训练（MIT）"
weight."opt-350m/config.json".note = "facebook/opt-350m 的网络配置（只要这一个文件，骨架网络按它建结构，模型权重来自 UniRig 自己的检查点）"

[stage]
prepare_mesh = "整理网格"
generate_skeleton = "UniRig 生成骨架"
predict_skin = "UniRig 预测蒙皮权重"
transfer_skin = "蒙皮权重放回整张网格"
