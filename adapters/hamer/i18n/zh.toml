summary = "仅限研究。HaMeR 代码 MIT；但运行必须用 MANO 手部模型（MANO_RIGHT.pkl），MANO 许可仅限非商用科研/教学/艺术项目，需要在 mano.is.tue.mpg.de 注册后自己下载，禁止再分发。HaMeR 权重作者没有单独写许可，训练数据含 FreiHAND、InterHand2.6M（CC-BY-NC）等非商用数据集，只按研究用途使用。找人用的 ViTDet-H（detectron2）代码和权重 Apache-2.0；找手用的 ViTPose+-H 全身关键点：代码 Apache-2.0，权重随仓库发布（MAE 预训练，MAE 权重为 CC-BY-NC-4.0）；依赖 mmcv 1.3.9、mmpose（ViTPose 分支）Apache-2.0，smplx 代码（MPI 非商用许可，只用来读取 MANO），chumpy MIT。不用 nvdiffrast"

