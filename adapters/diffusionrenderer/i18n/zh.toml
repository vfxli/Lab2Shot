[node."diffusionrenderer.relight"]
subtitle = "重新打光"
description = "画面 + HDRI → 在这张 HDRI 下重新打光的画面（实验功能）：先拆出材质，再用正向模型重新渲染。人物主体大致可信，背景常被画上 HDRI 的纹理，画面会有斑块和彩色噪点；约 12 秒一帧。只要材质通道、不要重新渲染时，用「DiffusionRenderer PBR 通道」。"

