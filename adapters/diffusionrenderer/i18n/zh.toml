# Cosmos DiffusionRenderer（adapters/diffusionrenderer）。一行一条：编号 = 模板。

# ---- 参数
"E-DIFFUSIONRENDERER-OVERLAP.other" = "「段间重叠」{overlap} 帧超过了每段最多帧数 {max_frames} 的一半：把「段间重叠」调到 {half} 帧或更少，或加大「每段最多帧数」"

# ---- 输入
"E-DIFFUSIONRENDERER-NOHDRI" = "重打光需要 HDRI：把环境图接到「HDRI」输入"
"E-DIFFUSIONRENDERER-HDRIMISSING" = "重打光需要 HDRI，但接入的文件 {path} 找不到：重新计算上游的环境图节点"
"E-DIFFUSIONRENDERER-HDRIREAD" = "读不了 HDRI {path}：文件坏了，或者不是 EXR / HDR 格式"

# ---- 模型
"N-DIFFUSIONRENDERER-OFFLOAD" = "处理分辨率 {width}×{height}、每段 {max_frames} 帧放不进 {budget_gb} GB 显存：编解码时 7B 网络暂存到内存（多占约 15 GB 内存，每段多几秒），结果不变。想更快更省：把「每段最多帧数」调到 41 或更少"

[stage]
inverse_render = "逆渲染（拆 G-buffer）"
inverse_window = "逆渲染 第 {window}/{windows} 段 {name}"
relight = "按 HDRI 重打光"
relight_window = "重打光 第 {window}/{windows} 段"

# ---- words (node texts from nodes.json and nodes.py, extension texts from extension.py)

[node."diffusionrenderer.inverse_render"]
subtitle = "PBR 通道"
description = "画面 → PBR 材质通道：去掉光照的基础色、法线贴图、深度贴图、粗糙度图、金属度图，前后帧稳定。每个通道单独跑一遍 7B 视频模型，约 10 秒一帧；粗糙度、金属度在看不清的大片区域（白墙）会成块，深度贴图是每段各自归一化的相对值，不是真实尺度。拿这些材质在新环境光下重新渲染，用「DiffusionRenderer 重新打光」。"

