# This extension's words and messages in English (the same keys as zh.toml).

# ---- parameters
"E-DIFFUSIONRENDERER-OVERLAP.one" = "Chunk Overlap of {overlap} frame is more than half of Max Frames per Chunk ({max_frames}): set Chunk Overlap to {half} or less, or raise Max Frames per Chunk"
"E-DIFFUSIONRENDERER-OVERLAP.other" = "Chunk Overlap of {overlap} frames is more than half of Max Frames per Chunk ({max_frames}): set Chunk Overlap to {half} or less, or raise Max Frames per Chunk"

# ---- inputs
"E-DIFFUSIONRENDERER-NOHDRI" = "Relighting needs an HDRI: wire an environment map to the HDRI input"
"E-DIFFUSIONRENDERER-HDRIMISSING" = "Relighting needs an HDRI, but the wired file {path} cannot be found: cook the upstream environment map node again"
"E-DIFFUSIONRENDERER-HDRIREAD" = "Cannot read the HDRI {path}: the file is broken, or it is not EXR / HDR"

# ---- model
"N-DIFFUSIONRENDERER-OFFLOAD" = "Resolution {width}×{height} with Max Frames per Chunk {max_frames} does not fit in {budget_gb} GB of VRAM: while encoding and decoding, the 7B network is parked in RAM (about 15 GB more RAM, a few seconds more per chunk); the result is the same. To go faster and use less: set Max Frames per Chunk to 41 or fewer"

[stage]
inverse_render = "Inverse Rendering (G-Buffer)"
inverse_window = "Inverse Rendering, Chunk {window}/{windows} {name}"
relight = "Relight with HDRI"
relight_window = "Relight, Chunk {window}/{windows}"

[node."diffusionrenderer.inverse_render"]
subtitle = "PBR Maps"
description = "Picture → PBR material maps: base color with the lighting removed, normal, depth, roughness and metallic maps, stable from frame to frame. Each map runs the 7B video model once on its own, about 10 s per frame; roughness and metallic come out blotchy over large indistinct areas (white walls), and the depth is a relative value normalized per chunk, not real scale. To render these materials again under a new environment light, use diffusionrenderer.relight."

