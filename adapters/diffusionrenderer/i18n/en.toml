[node."diffusionrenderer.relight"]
subtitle = "Relight"
description = "Picture + HDRI → the picture relit under that HDRI (experimental): the materials are taken apart first, then rendered again with the forward model. The people in front are roughly believable, while the background is often painted over with the HDRI's texture, with blotches and coloured noise; about 12 s per frame. For the material maps without rendering again, use diffusionrenderer.inverse_render."

