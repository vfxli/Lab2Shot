[node."hyworld2.reconstruct".official]
note = "HY-World 2.0 的重建部分就是 WorldMirror 2.0：输出高斯本体与同一世界的摄影机，不加载世界生成部分"

[node."hyworld2.reconstruct".cost]
note = "RTX 4090 实测：1920×1080、32 个视角，自动降到 518，整卡峰值 18.6 GB（不含空闲占用）。RTX 5090 实测：1280×720、32 个视角、分辨率 518 峰值 18.1 GB；官方 952 约要 50 GB，显卡放不下时自动降到 518 并在节点上说明"

