[node."hyworld2.reconstruct"]
subtitle = "3D 高斯"
description = "从同一静态场景的多视角画面重建 3D 高斯和同一世界里的摄影机。HY-World 2.0 的重建部分就是 WorldMirror 2.0，所以两者是同一个节点；世界生成不在这里。从整段里等距取「最多视角」张画面一起重建，优先用有视差、没有明显运动的镜头。"

[node."hyworld2.reconstruct".param.resolution]
label = "长边分辨率"

[node."hyworld2.reconstruct".param.resolution.option]
280 = "280"
518 = "518"
952 = "952"

