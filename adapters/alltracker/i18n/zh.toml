# 这个扩展包自己的界面字和消息（中文）。

# ---- words (node texts from nodes.json and nodes.py, extension texts from extension.py)

[node."alltracker.track"]
subtitle = "跟踪贴片"
description = "AllTracker：从参考帧出发，算出画面上每一个像素在整段镜头里的位置。输出每一帧回到参考帧的 ST-map（在参考帧上画一次修补、纹身、贴图，接「STMap」贴到整段镜头；Nuke 里用 STMap）和置信度，也能取样出 2D 跟踪点。比把运动向量一帧接一帧串起来不容易漂，可以商用。只要稀疏的 2D 点用「TAPNext++ 2D 跟踪点」。"

[node."alltracker.track".param.query_frame]
label = "参考帧"
placeholder = "第一帧"

[node."alltracker.track".param.grid]
label = "网格点数"

[node."alltracker.track".param.resolution]
label = "处理分辨率"

[node."alltracker.track".port.stmap]
label = "ST-map"

[node."alltracker.track".port.confidence]
help = "每个像素在这一帧里看不看得见、跟得准不准（AllTracker 的可见度 × 置信度，0–1）。当遮罩用先接「置信度转遮罩」"

[node."alltracker.track".official]
note = "上游 forward_sliding(images, iters, sw, is_training, window_len, stride)（nets/alltracker.py:363）只吃画面：没有查询点、没有遮罩。2D 点是把稠密轨迹图按 --rate 的步长抽样出来的（demo.py:148）。所以节点没有遮罩输入口：要只跟一块区域，在图上接「人物框转遮罩」→「图像合成」（留下）把画面挡住再送进「RGB」口"

[extension.alltracker]
summary = "一个点跟踪模型，比同类更快更准，同时在高分辨率上给出稠密（全像素）的结果"

[extension.alltracker.license]
name = "MIT"
summary = "代码 MIT，权重（Hugging Face aharley/alltracker，模型卡写明 MIT）同样 MIT：可以商用、修改和再分发，保留版权声明即可"

[extension.alltracker.weight.alltracker]
note = "AllTracker（MIT，66 MB；Kubric + 多个真实 / 合成数据集训练的完整模型）"

[stage]
read_frames = "读取画面"
dense_track_at = "稠密跟踪（{width}×{height}，参考帧 {frame}）"
dense_track = "稠密跟踪"
invert_stmap = "反求 ST-map"
sample_tracks = "取样 2D 跟踪点"
