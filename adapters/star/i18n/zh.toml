# STaR 扩展自己的界面字和消息（中文）。共用的重定目标消息在核心目录。

[node."star.retarget"]
subtitle = "动作重定目标"
description = "网格形状与时间连续性约束的动作重定目标。学习式重定目标的中间一段：「源」「目标」接「重定目标预处理」的两个输出（部位对应、静止姿势、哪些骨骼不送进模型都在那里定），结果接「重定目标后处理」做平移和髋高，再接线性蒙皮变形看网格。输出是模型原生的结果，写回目标自己的层级；没送进模型的骨骼保持静止姿势、跟着父骨骼走。两侧都要真实蒙皮网格；只收官方 22 个身体部位，预处理的忽略规则选「STaR（固定 22 个身体部位）」。"
official.note = "使用官方已发布模型，保留目标自己的层级。"
needs.star.label = "STaR（固定 22 个身体部位）"

