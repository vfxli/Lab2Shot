[node."alembic.import".port.fps]
label = "FPS"
help = "The Alembic's frame rate: the FPS hint the DCC wrote; without one, the rate found from the sampling interval; without either, empty. Wire it to a motion model's or an output setting's FPS to follow this file; when the file records none there is no value here and the other side uses its own"

[node."alembic.output"]
subtitle = "Alembic Output"
description = "Writes 3D data as Alembic (.abc): geometry (static, moving with a transform, or deforming per frame), cameras, point clouds and 3D curves, readable in Maya, Houdini and Blender. Scene takes several wires, or one scene list (each item is written under /shot/<item name>), packed into one scene before writing. Wire it to output to deliver it."

[node."alembic.output".cost]
whole = "Writes one file; the time depends on how much is written (about 1 second for 300 frames of meshes and cameras), not on the frame count"

[node."alembic.output".stage]
gather_scene = "Gather Scene"

[node."alembic.output".param.name]
label = "Name"

[node."alembic.output".param.unit]
label = "Unit"

[node."alembic.output".param.unit.option]
cm = "Centimeters · Maya"
m = "Meters · Houdini"

[node."alembic.output".param.fps]
label = "FPS"

[node."alembic.output".port.scene]
label = "Scene"

[extension.alembic]
summary = "An open framework for exchanging computer graphics: bakes complex animated scenes into application-independent, non-procedural geometric results"

[extension.alembic.license]
name = "BSD-3-Clause"
summary = "BSD-3: commercial use, modification and redistribution allowed (keep the copyright notice); its dependency Imath is also BSD-3 and Boost is under the Boost license, all usable commercially. It is compiled from source at install, which needs a C++ compiler on this machine (cc / cxx in the build section of config/local.toml)"

