[node."alembic.output"]
subtitle = "Alembic 输出"
description = "把三维数据写成 Alembic（.abc）：几何体（静止的、跟着变换动的、逐帧变形的）、摄影机、点云和三维曲线，Maya、Houdini、Blender 都能读。「场景」可以接多根线，也可以接一条场景列表（每条写在 /shot/<条目名> 下），写前打包成一个场景。接到「输出」上交给你。"

[node."alembic.output".cost]
whole = "写一个文件，时间看写多少东西（300 帧的网格和摄影机约 1 秒），不按帧算"

