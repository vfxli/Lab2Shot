# MoGe 的消息（adapters/moge）。

# ---- 解算
"I-MOGE-WEIGHTS" = "模型 {model} 的权重"
"N-MOGE-NONORMALS" = "MoGe 模型 {model} 没有法线输出：法线由点云相邻点的差算出，物体边缘处较粗糙"

# ---- words (node texts from nodes.json and nodes.py, extension texts from extension.py)

[node."moge.depth"]
subtitle = "深度贴图与法线"
description = "画面 → 逐帧的真实尺度深度贴图和法线贴图。给了焦距（填「已知焦距」、接「AnyCalib 镜头标定」的焦距，或接一台摄影机）就用它，不给由模型估计；每帧单独计算，用在图像序列上深度贴图会轻微闪动。要整段不闪的深度贴图用「Video Depth Anything 深度贴图」，两者接「深度对齐」就既不闪又是真实尺度。点云是每帧一片、各在这一帧自己的摄影机里（官方原生的点图），不是整段求出的一套场景点云。"

[node."moge.depth".param.model]
label = "模型"

[node."moge.depth".param.model.option]
"Ruicheng/moge-3-vitl" = "标准 ViT-L"
"Ruicheng/moge-3-vitg" = "大模型 ViT-G"

[node."moge.depth".param.resolution_level]
label = "精度等级"

[node."moge.depth".port.normal]
label = "法线贴图"

[node."moge.depth".official]
note = "「摄影机」口只有内参（intrinsics，v3.py:250 文档行），MoGe 不出外参；「点云」是模型自己的 points（v3.py:248），不是我们拿深度反投影的"

[extension.moge]
summary = "从单目开放域画面恢复三维几何，包括真实尺度的点图、深度贴图、法线贴图和摄影机视场角"

[extension.moge.license]
name = "MIT"
summary = "代码和 MoGe-3 权重（moge-3-vitl / moge-3-vitg）均为 MIT，可商用；主干网络 DINOv2 为 Apache-2.0。依赖 utils3d-moge、FlexGEMM 也是 MIT。utils3d-moge 里有可选的 nvdiffrast（NVIDIA 非商用）光栅化模块，MoGe 推理用不到，本扩展不安装它"

[extension.moge.weight.moge-3-vitl]
note = "Ruicheng/moge-3-vitl（MIT）"

[extension.moge.weight.moge-3-vitg]
note = "Ruicheng/moge-3-vitg（MIT）"
