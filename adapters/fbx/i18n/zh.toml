[node."fbx.output"]
subtitle = "FBX 输出"
description = "把三维数据写成 FBX：摄影机、静止的几何体、骨架动画、蒙皮角色（蒙皮和融合变形的权重曲线），单位厘米、Y 向上，Maya、MotionBuilder、Unreal 都能读。「场景」可以接多根线，也可以接一条场景列表（每条写在 /shot/<条目名> 下）。接到「输出」上交给你。"

