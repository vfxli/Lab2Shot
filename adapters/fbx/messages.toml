# FBX 扩展包（adapters/fbx）的消息。一行一条：编号 = 模板。

# ---- 读 .fbx（worker.py fbx.import）
"E-FBX-NOFILE" = "找不到文件 {path}：文件被移走或改名了，在「导入 FBX」里重新选一次"
"E-FBX-NOTFBX" = "读不了 {name}：不是有效的 FBX 文件，或者文件不完整（导出中断、还没拷完）。在 DCC 里重新导出一次"
"E-FBX-LEFTHANDED" = "这个 FBX 是左手坐标系（如 DirectX / Lightwave 设置导出的）：还读不了，请在导出时选右手坐标系（Maya、Max、Blender 默认都是）"
"W-FBX-SEVERALRIGS" = "网格 {path} 绑在几套骨骼上：只算在第一套上，其他骨骼带不动它"
"W-FBX-SKINTYPE" = "网格 {path} 用的是 {skin} 蒙皮：按线性蒙皮读，关节弯折处的形状会和 DCC 里不一样"
"W-FBX-BINDPOSE" = "关节 {path} 在几个网格里绑定的位置不同：用第一个网格的，其他网格绑在这个关节上的部分可能错位"
"E-FBX-NOTAKE" = "文件里没有动画段「{take}」（有 {takes}）：在「导入 FBX」的「动画段」里重新选一段"
"N-FBX-TAKES" = "这个 FBX 有几段动画（{takes}）：读的是最长的「{take}」。要别的段在「导入 FBX」的「动画段」里选"

# ---- 写 .fbx（worker.py fbx.output）
"E-FBX-SUFFIX" = "输出文件要以 .fbx 结尾：{path}。在「FBX 输出设置」的文件名里改成 .fbx"
"E-FBX-NOPOINTS" = "FBX 没有点云：点云要用「USD 输出设置」或「Alembic 输出设置」写（接到这里的场景不该有点云）"
"E-FBX-NOTCMYUP" = "写 FBX 的场景要是厘米、Y 轴向上，这个场景是每单位 {unit_cm:g} 厘米或坐标轴不同：是程序的问题，请把日志发给开发者"
"E-FBX-POINTCACHE" = "模型 {path} 每帧形状都在变（点缓存）：FBX 没有逐帧顶点缓存，用「USD 输出设置」或「Alembic 输出设置」写它"
"E-FBX-JOINTORDER" = "骨架 {path}：关节 {joint} 的父关节排在它后面，上游给的骨架数据顺序不对：是程序的问题，请把日志发给开发者"

# ---- 安装时编译（build.py）
"E-FBX-NOCOMPILER" = "找不到编译器 {name}：装上 C++ 编译器，或在 config/local.toml 的 [build] 段 cxx 里填编译器的名字，再执行 lab2shot ext install fbx"
"E-FBX-SDKINCOMPLETE" = "FBX SDK 不完整：{path} 里要有 include/fbxsdk.h 和 lib/release/libfbxsdk.a。重新安装 Autodesk FBX SDK：后台管理页的「扩展包」里的「手动下载」，或 ./setup.sh 的「安装与环境 → 安装手动下载的文件」"
"E-FBX-REBUILD" = "FBX 扩展包的代码更新了（要第 {needed} 版的 fbxio），装好的环境还是按旧代码编译的（第 {built} 版）：管理员重新安装（lab2shot ext install fbx），它会按新代码重新编译"
"E-FBX-NOPYBIND" = "没有 pybind11 的头文件：{path}/include 里找不到。重新执行 lab2shot ext install fbx（它会重新取 pybind11）"
