[node."pixel3dmm.face_solve"]
subtitle = "面部动作"
description = "Pixel3DMM：先逐帧预测法线贴图和规范面部坐标，再把 FLAME 头部模型拟合到整段镜头——先逐帧、再整段联合优化，带时序平滑，整段共用一台摄影机并解出焦距。比「SMIRK 面部动作」准、不抖，但慢十几倍；要一帧一帧都有脸，整段最多 1000 帧。"
official.note = "① **官方的整套 FLAME 参数就是「蒙皮角色」这个口**，没有另立类型、也没有另加口（SMPL / SMPL-X / MANO / FLAME / MHR 这类参数化人体就是「蒙皮 + 蒙皮权重 + 骨架动画」，装成「蒙皮角色」，不另立数据类型）。逐项对上（worker.py head_in_camera）：`shape`（300 个，整段一个）变成这张脸的静止网格和静止骨架（npz rest_vertices / rest_joints），配 FLAME 自己的蒙皮权重（npz skin_weights）；`R` 和 `t`（头每帧的旋转和平移，连同摄影机的 R_base / t_base）变成根关节每帧的旋转和平移（npz local_rotations[:, 0] 和 transl）；`neck` 变成脖子关节（local_rotations[:, 1]）、`jaw` 变成下巴关节（[:, 2]）、`eyes` 变成左右眼球两个关节（[:, 3:5]）；`exp`（100 个）和 `eyelids`（2 个）变成「蒙皮角色」上的 102 个融合变形目标（npz blendshapes / blendshape_names / blendshape_weights）。`joint_transforms` 是上游把这些关节旋转按骨架层次乘起来的结果，我们这边由同一批 local_rotations 算出来（npz joints），不是另一份数据。**一个参数都没丢。**② 「RGB」输入口是官方的：`scripts/network_inference.py:121 img` （还有 tracker.py:586 images）。③ 「法线贴图」「UV 坐标图」两个输出口同样是官方的：`scripts/network_inference.py:146-154 output['uv_map'] / output['normals']`。④ 官方的摄影机只有 fl / pp（内参）加一台基准位姿 R_base / t_base，整段共用一台。"
licence.note = "Pixel3DMM 代码和模型权重 CC BY-NC 4.0；FLAME 面部模型和 MICA 身份网络同样只限非商用科研。"

