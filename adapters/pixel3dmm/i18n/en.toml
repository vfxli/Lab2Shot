# The Pixel3DMM extension's own words and messages in English (the same keys as zh.toml).

"E-PIXEL3DMM-NOFACE" = "Pixel3DMM needs one clear face in every frame of the shot, and some frames have none ({reason}). Narrow the frame range to the part where the face stays in the image, or use footage with a larger, more frontal face."
"E-PIXEL3DMM-TOOMANYFRAMES.one" = "Pixel3DMM solves at most {most} frame at a time, and this shot has {have}. Split it into several parts and solve each (it optimizes the whole shot jointly, so each part solves its own face shape)."
"E-PIXEL3DMM-TOOMANYFRAMES.other" = "Pixel3DMM solves at most {most} frames at a time, and this shot has {have}. Split it into several parts and solve each (it optimizes the whole shot jointly, so each part solves its own face shape)."
"N-PIXEL3DMM-WHYFRAMES.one" = "Its last step optimizes the whole shot jointly, {least} frame at a time"
"N-PIXEL3DMM-WHYFRAMES.other" = "Its last step optimizes the whole shot jointly, {least} frames at a time"
"N-PIXEL3DMM-CROPPED.one" = "only {got} / {count} frame was cropped"
"N-PIXEL3DMM-CROPPED.other" = "only {got} / {count} frames were cropped"
"N-PIXEL3DMM-MICANOFACE" = "MICA found no face in the frames it sampled"
"E-PIXEL3DMM-NOSEG.one" = "Face parsing gave only {got} / {count} frame: in some frames the face is too small, too far off-center or covered, and Pixel3DMM cannot go on."
"E-PIXEL3DMM-NOSEG.other" = "Face parsing gave only {got} / {count} frames: in some frames the face is too small, too far off-center or covered, and Pixel3DMM cannot go on."
"E-PIXEL3DMM-PRIOR.one" = "{kind} was predicted for only {got} / {count} frame: not enough VRAM, or the footage has bad frames. See this step's error in the log."
"E-PIXEL3DMM-PRIOR.other" = "{kind} was predicted for only {got} / {count} frames: not enough VRAM, or the footage has bad frames. See this step's error in the log."
"E-PIXEL3DMM-NOTRACK" = "Frame {frame} has no fit: the fit stopped partway. See the last error in the log."
"E-PIXEL3DMM-STEP" = "The step \"{step}\" stopped (exit code {code}). See this step's last error in the log."
"I-PIXEL3DMM-STEPCROP" = "Find face, crop, face landmarks"
"I-PIXEL3DMM-STEPMICA" = "MICA face shape estimate"
"I-PIXEL3DMM-STEPSEGMENT" = "Face parsing"
"I-PIXEL3DMM-STEPPRIORS" = "Predict normal maps and canonical face coordinates"
"I-PIXEL3DMM-STEPTRACK" = "Fit FLAME"
"I-PIXEL3DMM-NORMALS" = "Normal map"
"I-PIXEL3DMM-UVCOORDS" = "Canonical face coordinates"

