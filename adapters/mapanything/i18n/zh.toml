[stage]
reconstruct.other = "重建（{frames} 帧）"
reconstruct_segment = "重建第 {segment}/{segments} 段（{frames} 帧）"

[node."mapanything.reconstruct"]
subtitle = "深度与摄影机"
description = "画面 → 每帧摄影机和真实尺度的深度贴图（Meta MapAnything），一次看整段画面，不用特征点匹配，固定机位也出得来。长镜头分段计算再拼接，分段之间尺度会跳；摄影机逐帧会有细小抖动，接「摄影机去抖」；知道焦距一定填上（或者接「AnyCalib 镜头标定」的焦距），长焦镜头它会把焦距估小。焦距逐帧估，变焦镜头跟得上；要最省显存用「CUT3R 深度与摄影机」。点云是每帧一张点图（官方原生的点图，放回这一帧自己的摄影机里），不是整段一套：官方没有合成一份场景点云的输出。"

[node."mapanything.reconstruct".param.model]
label = "模型"

[node."mapanything.reconstruct".param.model.option]
main = "主权重"
apache = "Apache"

[node."mapanything.reconstruct".param.max_frames]
