[node."mapanything.reconstruct".official]
note = "深度是 depth_z（model.py:2107），摄影机是 camera_poses（model.py:2110）加 intrinsics（model.py:2105）。「点云」是官方的世界点图 pts3d（model.py:2102）：worker 交出它的摄影机空间形式 pts3d_cam（model.py:2103，同一份数据换个坐标系），由家族按拼接好的摄影机摆回世界。没有遮罩或人物框输入口：官方 view 字典里可选的只有摄影机内参 / 射线 / 深度 / 位姿（model.py:2059-2064），没有任何遮罩；想局部重建，在送进去之前把其余部分涂黑：「ViTDet 人物框」→「人物框转遮罩」→「图像合成」（留下）→ 这个节点的「RGB」口"

[node."mapanything.reconstruct".licence]
note = "代码 Apache-2.0。Apache 权重可以商用；主权重（13 个数据集训练，明显更准）是 CC-BY-NC-4.0，非商用。"

[extension.mapanything]
summary = "通用真实尺度三维重建的开源研究框架；端到端训练的 Transformer 按画面、标定、位姿或深度贴图回归出场景的三维几何"

