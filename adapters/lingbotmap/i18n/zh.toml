[node."lingbotmap.reconstruct".port.confidence]
help = "每个像素这一帧的深度有多可信（LingBot-Map 的原始值 1 + exp(x)，换成 0–1）。这个解算给出的深度本身已经把深度边缘和天空排除在外（「深度贴图」的有效区就是它的可用遮罩），所以剩下的像素之间比，主要是「越远越不确定」"

[node."lingbotmap.reconstruct".official]
note = "摄影机是官方位姿编码 pose_enc（gct_base.py:310），由上游自己的 pose_encoding_to_extri_intri 换成外参加内参（gct_base.py:260）。节点没有「运动物体遮罩」「人物框」输入口：forward 里那个 mask 参数是给 ordered_video 用的（gct_base.py:293-296），不是画面遮罩，画面遮罩进不了模型，只能在算完之后把运动像素从有效位里去掉，这是我们自己加的一步，不放在解算器上。想局部重建走「ViTDet 人物框」→「人物框转遮罩」→「图像合成」（留下）→「RGB」口。世界点图 world_points 写在 forward 的文档串里（gct_base.py:312），但**放出来的权重里没有这个头**：实测 lingbot-map.pt / lingbot-map-long.pt 的键只有 aggregator (1211)、camera_head (69)、depth_head (62)，一个 point_head. 都没有，而流式模型默认也不建它（gct_stream.py:118 enable_point=False）。所以这个节点没有「点云」口——不是我们丢了官方的结果，是官方没放这部分权重"

[node."lingbotmap.reconstruct".licence]
note = "代码和权重 Apache-2.0，可以商用；其中来自 VGGT 的几个代码文件遵守 VGGT License（可商用，禁止军事等用途）。"

[extension.lingbotmap]
summary = "面向流式三维重建的前馈三维基础模型，用几何上下文 Transformer 统一坐标锚定、稠密几何线索和长程漂移校正"

[extension.lingbotmap.license]
name = "Apache-2.0（代码和权重）；部分代码文件来自 VGGT（Meta VGGT License）"
summary = "代码 Apache-2.0，可商用。权重 lingbot-map-long / lingbot-map（Hugging Face robbyant/lingbot-map）按 Apache-2.0 发布（模型卡写明 Apache-2.0，没有填 license 字段）；网络从 DINOv2-Large（Apache-2.0）初始化后自行训练，没有用 VGGT 的非商用权重。注意：仓库里 geometry / pose_enc / rotation / 预测头 / load_fn 等文件带 Meta 版权头，来自 VGGT 代码，原许可是 Meta VGGT License（允许商用，但须遵守其可接受使用政策，禁止军事、武器、关键基础设施等用途）。天空分割模型 skyseg.onnx 为 MIT。训练数据包含 ScanNet、Matterport3D、HM3D、Waymo 等研究许可数据集，权重本身按 Apache-2.0 发布"

[extension.lingbotmap.weight.lingbot-map-long]
note = "LingBot-Map long：长镜头 / 大场景更稳，默认（Apache-2.0，4.6 GB）"

[extension.lingbotmap.weight.lingbot-map]
note = "LingBot-Map 平衡版：论文和评测用的权重（Apache-2.0，4.6 GB）"

[extension.lingbotmap.weight.skyseg]
note = "天空分割 ONNX，去掉天空的点（MIT，176 MB）"

