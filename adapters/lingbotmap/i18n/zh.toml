"I-LINGBOTMAP-EXTRAKEYS.other" = "LingBot-Map 的权重里有 {count} 个模型用不到的参数（如 {keys}），没有加载"

# ---- 重建（worker.py）
"W-LINGBOTMAP-RESOLUTION.other" = "LingBot-Map 是按最长边 {native} 像素训练的，「处理分辨率」现在是 {resolution}：摄影机和深度贴图可能变差。没有别的原因就改回 {native}"
"W-LINGBOTMAP-MEMORY.other" = "LingBot-Map 每段要记住 {keyframes} 个关键帧，超过了它训练时的 {trained} 帧：后面的摄影机位置可能越来越偏。把「关键帧间隔」调大，或把「每段最多帧数」调小"
"E-LINGBOTMAP-NORMALIZATION" = "LingBot-Map 的上游打开了「预测归一化」这一步，而我们逐帧跑的那条路没有走它：算出来的结果会和官方不一样。管理员重新执行 lab2shot ext install lingbotmap 并检查上游改动"
"E-LINGBOTMAP-NOOVERLAP" = "LingBot-Map 第 {segment} 段和前面的结果没有足够的可靠公共点，拼不起来：把「每段最多帧数」调大（分段更少），或把「隔帧」调小（重叠更多）"
"W-LINGBOTMAP-FOCALXY" = "LingBot-Map 估的横向焦距 {fx:.0f} px 和纵向焦距 {fy:.0f} px 差得较多：输出的摄影机按长边方向的 {used:.0f} px 算。像素不是正方形（变形宽银幕、没还原的拉伸）的话，先把画面还原再算"

"I-LINGBOTMAP-SKYMODEL" = "天空分割模型"

# ---- words (node texts from nodes.json and nodes.py, extension texts from extension.py)

[node."lingbotmap.reconstruct"]
subtitle = "深度与摄影机"
description = "画面 → 每帧摄影机和深度贴图，一帧帧流式往前读，显存不随镜头长度增长（几千帧的长镜头也一样）。摄影机逐帧抖动比 ViPE 大，长焦镜头上焦距会估小；尺度要手动缩放，按「尺度」换算成厘米。几百到几千帧的航拍、漫游、车拍选它；短镜头要更准的摄影机用「Pi3 深度与摄影机」。不出点云：放出的权重没有点图头，官方演示也是用深度反投影的；要点云接「深度转点云」。"

