[node."lingbotmap.reconstruct".port.confidence]
help = "How reliable each pixel's depth is in this frame (LingBot-Map's raw value 1 + exp(x), mapped to 0–1). The depth this solver gives already leaves out depth edges and sky (the valid area of Depth is its usable mask), so among the remaining pixels it mostly says the farther, the less certain"

[node."lingbotmap.reconstruct".official]
note = "The camera is the official pose encoding pose_enc (gct_base.py:310), turned into extrinsics plus intrinsics by upstream's own pose_encoding_to_extri_intri (gct_base.py:260). The node has no moving-object mask or person box input: the mask argument of forward is for ordered_video (gct_base.py:293-296), not a picture mask; a picture mask cannot go into the model, moving pixels can only be taken out of the valid area after solving, a step of our own that is not put on the solver. For a local reconstruction go sam_3d_body.detect_people → mask_from_boxes → composite (keep) → the RGB input. The world point map world_points is in forward's docstring (gct_base.py:312), but **the released weights have no such head**: measured, the keys of lingbot-map.pt / lingbot-map-long.pt are only aggregator (1211), camera_head (69) and depth_head (62), not one point_head., and the streaming model does not build it by default either (gct_stream.py:118 enable_point=False). So this node has no point cloud output: not an official result we dropped, but weights upstream did not release"

[node."lingbotmap.reconstruct".licence]
note = "Code and weights Apache-2.0, commercial use allowed; a few code files from VGGT follow the VGGT License (commercial use allowed, military and similar uses forbidden)."

[extension.lingbotmap]
summary = "A feed-forward 3D foundation model for streaming 3D reconstruction: a geometric context transformer unifies coordinate anchoring, dense geometric cues and long-range drift correction"

[extension.lingbotmap.license]
name = "Apache-2.0 (code and weights); some code files from VGGT (Meta VGGT License)"
summary = "Code Apache-2.0, commercial use allowed. The weights lingbot-map-long / lingbot-map (Hugging Face robbyant/lingbot-map) are released under Apache-2.0 (the model card says Apache-2.0 without filling in the license field); the network is initialized from DINOv2-Large (Apache-2.0) and trained by the authors, without VGGT's non-commercial weights. Note: files in the repository such as geometry / pose_enc / rotation / the prediction heads / load_fn carry Meta's copyright header and come from the VGGT code, originally under the Meta VGGT License (commercial use allowed, subject to its acceptable use policy, which forbids military, weapons, critical infrastructure and similar uses). The sky segmentation model skyseg.onnx is MIT. The training data includes research-licensed datasets such as ScanNet, Matterport3D, HM3D and Waymo; the weights themselves are released under Apache-2.0"

[extension.lingbotmap.weight.lingbot-map-long]
note = "LingBot-Map long: steadier on long shots / large scenes, the default (Apache-2.0, 4.6 GB)"

[extension.lingbotmap.weight.lingbot-map]
note = "LingBot-Map balanced: the weights used for the paper and benchmarks (Apache-2.0, 4.6 GB)"

[extension.lingbotmap.weight.skyseg]
note = "Sky segmentation ONNX, removes the points of the sky (MIT, 176 MB)"

