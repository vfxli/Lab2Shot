"W-LINGBOTMAP-MEMORY.other" = "LingBot-Map has to remember {keyframes} keyframes per segment, more than the {trained} frames it was trained with: later camera positions may drift more and more. Raise Keyframe Interval, or lower Max Frames per Segment"
