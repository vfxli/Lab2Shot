"E-LINGBOTMAP-NOOVERLAP" = "LingBot-Map segment {segment} has too few reliable points in common with the results before it to be stitched: raise Max Frames per Segment (fewer segments), or lower Frame Step (more overlap)"
"W-LINGBOTMAP-FOCALXY" = "LingBot-Map's horizontal focal length {fx:.0f} px and vertical focal length {fy:.0f} px differ quite a lot: the output camera uses {used:.0f} px, along the long side. If the pixels are not square (anamorphic, a stretch not undone), restore the picture first"
"I-LINGBOTMAP-SKYMODEL" = "sky segmentation model"

# ---- words (node texts from nodes.json and nodes.py, extension texts from extension.py)

[node."lingbotmap.reconstruct"]
subtitle = "Depth and Camera"
description = "Picture → a camera and a depth map per frame, read frame by frame as a stream, so GPU memory does not grow with the shot's length (the same for long shots of thousands of frames). The camera jitters more from frame to frame than ViPE's, and focal length is underestimated on long lenses; the scale is arbitrary, converted to centimetres by Scale. Pick it for aerial, walkthrough and car shots of hundreds to thousands of frames; for a more accurate camera on a short shot use pi3.reconstruct. It gives no point cloud: the released weights have no point map head and the official demo also unprojects depth; for a point cloud, wire points_from_depth."

