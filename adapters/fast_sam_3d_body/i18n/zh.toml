[node."fast_sam_3d_body.solve"]
subtitle = "全身动作"
description = "和「SAM 3D Body 全身动作」一样的全身动作（含手指，结果在摄影机空间），用加速版推理：每帧快约 2.5–3 倍，一帧里的多个人一起算。接了「人物框」（「ViTDet 人物框」→「选人」）就只解这些人；不接就自己检（YOLO11-Pose，和它检手腕是同一趟）。检人、加载模型只做一次，一帧里的人分批解算、每个人都解；只要其中某一个人时，前面接「ViTDet 人物框」→「选人」→「人物框转遮罩」→「图像合成」，把别人从画面里去掉再送进来。身体动作和原版几乎一样，个别帧手指会有差别；最终精修的镜头用「SAM 3D Body 全身动作」。另出一台「摄影机」：放人用的那台原点、不动的针孔摄影机（焦距 = 「焦距」，留空时用它自己从画面估的焦距；主点在画面中心），不是解出来的摄影机——三维视图透过它看图像平面、人和画面对得上，模板里当「解算器的摄影机」那一路用。"

