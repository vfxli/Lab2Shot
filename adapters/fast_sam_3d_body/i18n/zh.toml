[node."fast_sam_3d_body.solve".official]
note = "⓪ **「人物框」是可选输入，直接交给官方函数**（规则：官方函数接受人物框就直接把框交给它；不接受框的项目，在节点图上走「人物框转遮罩」）：这个仓库自己的 `process_one_image(img, bboxes=None, …)`（sam_3d_body_estimator.py:194-205，**官方包的函数**）收框；官方 demo 不传框只是因为它自己建了检测器（demo.py:44-49；demo_human.py `--detector` 默认 `yolo`，三档 vitdet / yolo / yolo_pose，:623-629）。接了框就按框解；没接时 worker 用 `yolo_pose` 这一档自己检：**一趟同时给出框和手腕**（手部裁切走同一份 YOLO-Pose 手腕，run_publisher.py:305 `hand_box_source=\"yolo_pose\"`）。接了框而且开着「手部精修」时，YOLO-Pose 仍跑一遍只为拿手腕。① **官方的整套 MHR 参数就是「蒙皮角色」这个口**，和 SAM 3D Body 一模一样（两个节点共用 adapters/sam_3d_body/sam3dbody.py 的 solve_person / evaluate / rig_data，逐项怎么对上见那边的 official 注 ①；SMPL / SMPL-X / MANO / FLAME / MHR 这类参数化人体就是「蒙皮 + 权重 + 骨架动画」，装成「蒙皮角色」，不另立数据类型）：global_rot + body_pose_params + hand_pose_params + scale_params + shape_params 原样送回 MHR 算出骨架每帧的关节矩阵（npz joint_world），shape_params 还给出静止网格（npz rest_vertices）和蒙皮权重（npz skin_weights / bind_world）；pred_joint_coords / pred_global_rots / pred_pose_raw 都是同一副骨架、同一份姿势的另一种写法。**一个参数都没丢。** `expr_params` 这个扩展的上游同样自己置零（`sam_3d_body/models/heads/mhr_head.py:442、508、901 pred_face = pred[...] * 0`），所以没有表情融合变形——官方就不出。`character` 这里写的是 body_pose_params 而不是 SAM 3D Body 那边的 mhr_model_params：这个扩展的输出 dict 里没有 mhr_model_params 那一项（见上面的注释）。上游还给出 `pred_keypoints_2d`（画面上的点，不是骨架，同样**装不进蒙皮角色**），目前没有对应的输出口。② cam_int（sam_3d_body_estimator.py:199）只是内参：内参（焦距、主点）不是摄影机输入，完整的内参加外参才算摄影机。节点没有「摄影机」输出口：官方没有解出摄影机，按 focal_length + pred_cam_t 拼出来的摄影机是我们自己造的输出，我们自己造出来的输出口不留。要把人摆进某台摄影机的世界，接核心节点「摄影机空间转换」。"

