summary = "Commercial use allowed. The acceleration code is MIT; but it is built on Meta's SAM 3D Body code, and the original parts and the weights (the same ones as the SAM 3D Body extension's) remain under the SAM License (commercial use, modification and redistribution allowed, the licence must be included, papers must credit it, no military use); the backbone code is under the DINOv3 License (similar terms); the MoGe-2 focal length estimation is MIT. Ultralytics YOLO11-Pose, used to find the wrists (code and weights), is AGPL-3.0: fine for internal use; offering a modified version as a service or distributing it requires publishing it under the AGPL, and closed-source commercial use needs an Ultralytics enterprise licence"

