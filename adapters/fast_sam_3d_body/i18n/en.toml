[node."fast_sam_3d_body.solve".official]
note = "⓪ **Boxes is an optional input, handed straight to the official function** (the rule: when the official function takes person boxes, the boxes go straight to it; projects that take no boxes go through mask_from_boxes in the graph): this repository's own `process_one_image(img, bboxes=None, …)` (sam_3d_body_estimator.py:194-205, **a function of the official package**) takes boxes; the official demo passes none only because it builds its own detector (demo.py:44-49; demo_human.py `--detector` defaults to `yolo`, three choices vitdet / yolo / yolo_pose, :623-629). With boxes wired it solves by the boxes; without, the worker detects with the `yolo_pose` choice itself: **one pass gives both the boxes and the wrists** (the hand crops use the same YOLO-Pose wrists, run_publisher.py:305 `hand_box_source=\"yolo_pose\"`). With boxes wired and Hand Refinement on, YOLO-Pose still runs once, only for the wrists. ① **The official full set of MHR parameters is the skinned character port**, exactly as in SAM 3D Body (both nodes share solve_person / evaluate / rig_data of adapters/sam_3d_body/sam3dbody.py; how each item maps is in note ① of the official there; parametric bodies such as SMPL / SMPL-X / MANO / FLAME / MHR are \"skin + weights + skeleton animation\", packed as a skinned character, no data type of their own): global_rot + body_pose_params + hand_pose_params + scale_params + shape_params go back into MHR as they are to compute the skeleton's joint matrices per frame (npz joint_world); shape_params also gives the rest mesh (npz rest_vertices) and the skin weights (npz skin_weights / bind_world); pred_joint_coords / pred_global_rots / pred_pose_raw are other ways of writing the same skeleton and the same pose. **Not one parameter is lost.** `expr_params` is zeroed by this extension's upstream too (`sam_3d_body/models/heads/mhr_head.py:442、508、901 pred_face = pred[...] * 0`), so there are no expression blend shapes: upstream does not give them. `character` here names body_pose_params instead of SAM 3D Body's mhr_model_params: this extension's output dict has no mhr_model_params item (see the comment above). Upstream also gives `pred_keypoints_2d` (points on the picture, not a skeleton, which **do not fit in a skinned character** either), with no output port for now. ② cam_int (sam_3d_body_estimator.py:199) is only intrinsics: intrinsics (focal length, principal point) are not a camera input; only full intrinsics plus extrinsics make a camera. The node has no Camera output port of a solved camera: upstream solves no camera, and a camera put together from focal_length + pred_cam_t would be an output of our own making, and output ports of our own making are not kept. To place the people in some camera's world, wire the core node camera_space."

[extension.fast_sam_3d_body]
summary = "A training-free acceleration framework that reorders SAM 3D Body's inference path to reach interactive speed"

