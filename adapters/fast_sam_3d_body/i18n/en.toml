[stage]
build_engine = "Build TensorRT Engine ({part}, once per GPU model)"
detect_people = "Detect People"
estimate_pose = "Estimate Body Pose"
estimate_focal = "Estimate Focal Length"
finish_people = "Lock Body Shape · Smooth · Build Skeleton"

[node."fast_sam_3d_body.solve"]
subtitle = "Full-Body Motion"
description = "The same full-body motion as sam_3d_body.solve (fingers included, the result in camera space), with accelerated inference: about 2.5–3 times faster per frame, all people of a frame computed together. With Boxes wired (sam_3d_body.detect_people → select_people) only those people are solved; unwired, it detects them itself (YOLO11-Pose, in the same pass as its wrist detection). Detection and model loading happen once; the people of a frame are solved in batches, every one of them. To get only one of them, put sam_3d_body.detect_people → select_people → mask_from_boxes → composite in front to remove the others from the picture first. The body motion is nearly the same as the original, with occasional finger differences on some frames; for the final refinement of a shot use sam_3d_body.solve. It also gives a Camera: the pinhole camera the people are placed with, at the origin and still (focal length = Focal Length, or when left empty the focal length it estimates from the picture itself; the principal point at the picture centre). It is not a solved camera: looking through it in the 3D viewport, the image plane, the people and the picture line up; in templates it serves as the \"solver's camera\" branch."

