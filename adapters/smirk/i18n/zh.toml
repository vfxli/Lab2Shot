[node."smirk.face_solve"]
subtitle = "面部动作"
description = "SMIRK：逐帧解出 FLAME 头部模型的头部动作、下巴和 50 个表情（外加眨眼），表情夸张、嘴型准。输出带表情形变的蒙皮头、它每帧的精确网格和 52 条表情曲线，都在摄影机空间里（填「焦距」决定头离镜头多远）；另出一台「摄影机」：放头用的针孔摄影机（原点、不动，焦距就是填的焦距，不填按全画幅 50 mm 估算，主点在画面中心），三维视口透过它看图像平面、头和画面对得上。要摆进某台摄影机的世界，后面接「摄影机空间转换」。"
official.ours.camera = "放脸用的针孔摄影机：原点、不动，焦距 = 「焦距」参数（不填按全画幅 50 mm），主点在画面中心"
official.note = "① **官方的整套 FLAME 参数就是「蒙皮角色」这个口**，没有另立类型、也没有另加口（SMPL / SMPL-X / MANO / FLAME / MHR 这类参数化人体就是「蒙皮 + 蒙皮权重 + 骨架动画」，装成「蒙皮角色」，不另立数据类型）。逐项对上（worker.py face_rig）：`shape_params`（300 个，整段锁成中位数）变成这张脸的静止网格和静止骨架（npz rest_vertices / rest_joints），配 FLAME 自己的蒙皮权重（npz skin_weights）；`pose_params`（头的旋转）变成骨架根关节每帧的旋转（npz local_rotations[:, 0]，含 FLAME 空间转摄影机空间的那一次固定旋转）；`jaw_params` 变成下巴关节的旋转（local_rotations[:, 2]）；`expression_params`（50 个）和 `eyelid_params`（2 个）变成「蒙皮角色」上的 52 个融合变形目标（npz blendshapes / blendshape_names / blendshape_weights），同一份数字另外走「表情曲线」这个口。**一个参数都没丢。**② `cam` 不在 gives 里，因为它**不是**官方的摄影机：它是 224×224 裁剪上的弱透视三个数（缩放 + 平移，smirk_encoder.py:43），我们只拿它算出头离镜头多远（worker.py perspective）。「摄影机」口交出的是放脸用的那台针孔摄影机（原点、不动，焦距 = 节点的「焦距」，不填按 50 mm），登记在 ours：三维视口透过它看图像平面，头和画面对得上。头就留在摄影机空间；要摆进某台摄影机的世界，接核心节点「摄影机空间转换」（camera_space）。③ 官方的网格在另一个文件 `src/FLAME/FLAME.py:310-314` 的 flame_output['vertices']（demo.py:110 flame.forward(outputs)），是 FLAME 拿这些参数跑出来的，不是编码器直接吐的。"

[node."smirk.face_solve".param.crop]
label = "裁剪"
option.auto = "自动找脸"
option.none = "整幅画面"

[node."smirk.face_solve".port.expressions]
