[node."smirk.face_solve".port.camera]
help = "放人用的那台摄影机：原点、不动的针孔摄影机，焦距 = 节点的「焦距」（留空时用解算器自己估的或默认的），主点在画面中心。不是解出来的摄影机：人就放在它的空间里，透过它看图像平面人和画面对得上。当「解算器的摄影机」用，或接「摄影机空间转换」的目标"

[extension.smirk]
summary = "从单目画面解出三维人脸，面部几何能忠实还原极端、不对称和细微的表情"
license.name = "MIT（代码）+ FLAME 2020 非商用 + 模型权重仅限研究"
license.summary = "仅限研究。SMIRK 代码 MIT；但运行必须用 FLAME 2020 面部模型（generic_model.pkl），许可仅限非商用科研，需要在 flame.is.tue.mpg.de 注册后自己下载，禁止再分发（FLAME 2023 Open 虽是 CC-BY-4.0，但 SMIRK 按 FLAME 2020 训练，不能替换）。仓库自带的 FLAME 衍生文件（FLAME_masks、landmark_embedding、head_template.obj）同样来自 FLAME 官网。SMIRK 模型权重（SMIRK_em1.pt）作者没有单独写许可，训练数据含 LRS3、MEAD、CelebA、FFHQ（均为非商用研究数据），只按研究用途使用。裁脸用的 MediaPipe Face Landmarker 代码和模型 Apache-2.0。smplx 未使用，不用 pytorch3d / nvdiffrast（渲染部分不需要）"
weight.smirk-em1.note = "SMIRK 预训练模型（作者 Google Drive，134 MB，仅限研究）"
weight.face-landmarker.note = "MediaPipe face_landmarker.task float16 v1（裁脸用，3.6 MB，Apache-2.0）"

