# Mesh4D（adapters/mesh4d/nodes.py、worker.py）。

# ---- worker：环境和素材的前提
"E-MESH4D-NOCODEBASE" = "Mesh4D 的代码目录没有传给 worker（缺 {name}）：这个扩展还没有装好，在后台管理页的「扩展包」里重新安装一次"
"E-MESH4D-EMPTYMASK" = "第 {frame} 帧的「前景遮罩」里一个像素都没有。Mesh4D 要先把物体抠出来才算得了：它按遮罩把物体裁出来居中，全黑的一帧裁不出画面。检查这一帧遮罩是不是断了，或者把物体出画的那几帧剪掉"
"E-MESH4D-STEP" = "Mesh4D 的「{step}」这一步失败了。它最后说的是：\n{detail}"

# ---- 节点：算完了
"I-MESH4D-DONE" = "生成的网格有 {verts:,} 个点、{faces:,} 个面，整段 {frames} 帧拓扑不变（点缓存）；分成 {windows} 段算，每段 6 帧。1 个单位 = {unit:g} 厘米（「尺度」参数给的）"

# ---- 节点：这个方法本身的三件事，算完都要说
"W-MESH4D-SEAM" = "这一段 {frames} 帧，Mesh4D 一次只看 6 帧，所以分成了 {windows} 段各算各的：网格是同一个（拓扑和点数不变），但第 {seams} 帧这些接缝处，动作可能跳。要平滑就在下游做，或者把镜头切成 6 帧的倍数"
"N-MESH4D-NOSCALE" = "Mesh4D 只解形状，不解相机、也不知道物体多大：结果按「尺度」参数放成 {unit:g} 厘米高。量出真实物体的高度填进去，才和实景对得上"
"N-MESH4D-SIMPLIFIED" = "「面数」选了「{choice}」：生成的网格先减到 {faces:,} 个面，再算形变（官方脚本默认不减面）。减面只做一次，之后每帧的点都是从这一份拓扑上推出来的"

# ---- 节点：这一次的结果有多重
"W-MESH4D-BIGMESH" = "生成的网格有 {verts:,} 个点，整段 {frames} 帧的点缓存约 {mb:.0f} MB：视图里转起来会很沉，写进 Alembic / USD 也不小。嫌沉就把「面数」调低一档重算"
