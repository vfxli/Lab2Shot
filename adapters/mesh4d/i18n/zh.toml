# Mesh4D（adapters/mesh4d/nodes.py、worker.py）。

# ---- worker：环境和素材的前提
"E-MESH4D-NOCODEBASE" = "Mesh4D 的代码目录没有传给 worker（缺 {name}）：这个扩展还没有装好，在后台管理页的「扩展包」里重新安装一次"
"E-MESH4D-EMPTYMASK" = "第 {frame} 帧的「前景遮罩」里一个像素都没有。Mesh4D 要先把物体抠出来才算得了：它按遮罩把物体裁出来居中，全黑的一帧裁不出画面。检查这一帧遮罩是不是断了，或者把物体出画的那几帧剪掉"
"E-MESH4D-STEP" = "Mesh4D 的「{step}」这一步失败了。它最后说的是：\n{detail}"
"I-MESH4D-STEPLOAD" = "装载形变网络"
"I-MESH4D-STEPFRAMES" = "整理画面"
"I-MESH4D-MISSINGTENSORS.other" = "缺 {count} 个权重，第一个是 {first}"
"I-MESH4D-TOOFEWFRAMES.other" = "Mesh4D 一次要 {window} 帧，这一段只有 {have} 帧"

# ---- 节点：算完了
"I-MESH4D-DONE.other" = "生成的网格有 {verts:,} 个点、{faces:,} 个面，整段 {frames} 帧拓扑不变（几何缓存）；分成 {windows} 段算，每段 6 帧。1 个单位 = {unit:g} 厘米（「尺度」参数给的）"

# ---- 节点：这个方法本身的三件事，算完都要说
"W-MESH4D-SEAM.other" = "这一段 {frames} 帧，Mesh4D 一次只看 6 帧，所以分成了 {windows} 段各算各的：网格是同一个（拓扑和点数不变），但第 {seams} 帧这些接缝处，动作可能跳。要平滑就在下游做，或者把镜头切成 6 帧的倍数"
"N-MESH4D-NOSCALE" = "Mesh4D 只解形状，不解摄影机、也不知道物体多大：结果按「尺度」参数放成 {unit:g} 厘米高。量出真实物体的高度填进去，才和实景对得上"
"N-MESH4D-SIMPLIFIED.other" = "「面数」选了「{choice}」：形变用的网格有 {faces:,} 个面（官方流程先减到 4 万面再算形变）。网格只定一次，之后每帧的点都是从这一份拓扑上推出来的"

# ---- 节点：这一次的结果有多重
"W-MESH4D-BIGMESH.other" = "生成的网格有 {verts:,} 个点，整段 {frames} 帧的几何缓存约 {mb:.0f} MB：视图里转起来会很沉，写进 Alembic / USD 也不小。嫌沉就把「面数」调低一档重算"

# ---- words (node texts from nodes.json and nodes.py, extension texts from extension.py)

[stage]
stage_frames = "整理画面"
generate_mesh = "生成网格"
solve_deformation = "解形变"

[node."mesh4d.reconstruct"]
subtitle = "网格序列"
description = "把一个抠出来的物体解成每帧变形的网格：先由 Hunyuan3D-2.1 从第一帧生成一个网格，再由 Mesh4D 的形变网络把这一个网格的顶点推到每一帧，整段拓扑不变，就是几何缓存。一次只看 6 帧，更长的镜头分成 6 帧一段接着算，接缝处动作可能跳。不解摄影机、不知道物体多大，大小由「尺度」参数给。"

[node."mesh4d.reconstruct".param.quality]
label = "质量"

[node."mesh4d.reconstruct".param.quality.option]
fast = "快速"
standard = "标准"
fine = "精细"

[node."mesh4d.reconstruct".param.faces]
label = "面数"

[node."mesh4d.reconstruct".param.faces.option]
full = "原样"
100k = "10 万"
40k = "4 万（官方）"
20k = "2 万"

[node."mesh4d.reconstruct".param.seed]
label = "随机种子"

[node."mesh4d.reconstruct".param.unit_cm]
label = "尺度"

[node."mesh4d.reconstruct".port.image]
label = "RGB"

[node."mesh4d.reconstruct".port.mask]
label = "前景遮罩"

[node."mesh4d.reconstruct".port.mesh]
label = "网格"
help = "每帧变形的网格（几何缓存）：整段同一份拓扑、同一套 UV，每帧只换点。第一帧的包围盒在 X、Z 上居中、底面落在 Y=0，整段按这一帧摆好，不逐帧重新摆"

[node."mesh4d.reconstruct".port.rest]
label = "静止网格"
help = "Hunyuan3D-2.1 生成的那一个网格本身，没有形变：拿去重拓扑、展 UV 的话用这一份"

[node."mesh4d.reconstruct".official]
note = "遮罩是官方的输入：官方 infer.py 读的是 RGBA 抠像（infer.py:148-151，RGB 的话自己用 rembg 抠），数据集类把它拆成 batch['image'] 和 batch['mask'] 两样送进形变管线（:1030-1031）。「网格」是 deformed_verts_gen（:1144）逐帧的顶点，「静止网格」是 Hunyuan3D-2.1 生成、配准过的那一份（:953 registered_gen_mesh.obj）"

[node."mesh4d.reconstruct".cost]
note = "显存峰值出现在生成网格和解形变两个模型都在卡上的时候（两个都常驻，算完不卸）。生成网格那一步整段只做一次，约 60 秒；之后每 6 帧一段的形变约 14 秒（「标准」档 50 步、「原样」不减面）：6 帧的一段整段约 150 秒，60 帧的一段约 280 秒"

[node."mesh4d.reconstruct".stage]
write_mesh = "写出网格"

[node."mesh4d.reconstruct".licence]
note = "仅限研究：Mesh4D 仓库没有任何许可证文件；它的推理代码和生成网格的权重是腾讯 Hunyuan3D-2.1 社区许可，该许可不适用于欧盟、英国和韩国。"

[extension.mesh4d]
summary = "单目 4D 网格重建的前馈模型；给一段动态物体的单目视频，恢复它完整的三维形状和运动（表示成形变场）"

[extension.mesh4d.license]
name = "仓库没有许可证 + Tencent Hunyuan 3D 2.1 社区许可（不含欧盟、英国、韩国）"
summary = "仅限研究，标签按宁严勿松取最严的一档，三条理由叠在一起：① Mesh4D 仓库本身没有任何许可证文件，作者也没在别处声明授权条款——没有授权就等于没有给出使用许可，只能当作论文附带的研究代码；两个权重（形变 VAE、去噪网络）同样没有声明。② 它的推理代码整个是腾讯 Hunyuan3D-2.1（hy3dshape / hy3dpaint），受「Tencent Hunyuan 3D 2.1社区许可协议」约束：该协议明确不适用于欧盟、英国和韩国，并禁止在这些地区使用它的代码、权重和输出结果；生成网格用的 hunyuan3d-dit-v2-1 权重也是这一份许可。③ 环境里的 PyMeshLab 是 GPL-3.0。另：Hunyuan3D-2.1 的 NOTICE 里列出的第三方组件（Stable Diffusion 的 MIT + CreativeML Open RAIL++-M 等）各自的条款也要一并遵守。"

[extension.mesh4d.weight.deform_vae]
note = "Mesh4D 形变 VAE，3.3 GB（作者 Google Drive，无许可证声明，按仅限研究对待）"

[extension.mesh4d.weight.denoiser]
note = "Mesh4D 形变去噪网络（MoE DiT），24 GB：作者放出的是带优化器状态的训练存档（作者 Google Drive，无许可证声明，按仅限研究对待）"

[extension.mesh4d.weight.hunyuan3d-shape]
note = "Hunyuan3D-2.1 生成网格的那一半（DiT 7.4 GB + 形状 VAE 0.7 GB），腾讯 Hunyuan 3D 2.1 社区许可（不含欧盟、英国、韩国）"
notice = "Powered by Tencent Hunyuan"

[extension.mesh4d.weight.dinov2-large]
note = "DINOv2-Large 图像编码器（Meta，Apache-2.0），1.2 GB：形变网络看画面用的就是它"
