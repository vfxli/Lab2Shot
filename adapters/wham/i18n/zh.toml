license.summary = "仅限研究。WHAM 代码 MIT；但运行必须用 SMPL 人体模型（SMPL_NEUTRAL），需要在 smpl.is.tue.mpg.de 注册后自己下载，仅限非商用科研，禁止再分发；随 WHAM 下载的关节回归矩阵等辅助文件由 SMPL 派生，同样按 SMPL 许可。WHAM 模型权重作者没有单独写许可，训练数据含 AMASS、BEDLAM、3DPW 等仅限研究的数据集，只按研究用途使用。其余：DPVO 代码和模型权重 MIT，HMR2.0a（4D-Humans）MIT，ViTPose-H 和 mmcv / mmpose Apache-2.0，YOLOv8x 模型权重和 ultralytics 代码 AGPL-3.0（上游自己的人物检测），smplx 代码（MPI 非商用许可），chumpy MIT，torch-scatter MIT"
weight.wham.note = "WHAM 主网络（demo 默认的 BEDLAM+3DPW 版），503 MB"
