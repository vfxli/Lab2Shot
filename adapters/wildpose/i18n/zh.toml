[node."wildpose.reconstruct"]
subtitle = "深度与摄影机"
description = "结合 MASt3R 特征、MoGe-2 米制先验、学习运动遮罩与稠密束调整解算摄影机。需填写已知焦距，输入至少八帧；摄影机覆盖全帧，优化深度只覆盖关键帧。运动遮罩是网络内部特征，不另造外部遮罩端口。"
official.note = "官方 Dataset 提供逐帧 RGB 和已知 fx/fy/cx/cy；trajectory_filler 提供全帧摄影机，DepthVideo.save_video 仅保存关键帧优化深度。没有全帧深度预测或官方单独的置信度输出，不虚构端口。"
licence.note = "MASt3R 非商用；代码及各模型权重许可沿现有扩展机制展示。"
cost.note = "含 MASt3R 与 MoGe-2；120–200 帧实测峰值约 12 GB"

[node."wildpose.reconstruct".param.resolution]
label = "处理分辨率"

[node."wildpose.reconstruct".param.buffer]
label = "关键帧容量"

[node."wildpose.reconstruct".param.final_ba]
label = "最终束调整"

[extension.wildpose]
summary = "结合 MASt3R 特征、运动遮罩与稠密束调整，解算动态或低摄影机运动的视频"
