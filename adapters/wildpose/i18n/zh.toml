license.summary = "按项目既有机制登记：MASt3R 模型权重非商用，MoGe-2 MIT。"
weight.wildpose.note = "WildPose 推理模型权重"
weight.mast3r.note = "MASt3R 特征，非商用"
weight.moge2.note = "MoGe-2 米制深度先验，MIT"

