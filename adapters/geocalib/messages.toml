"I-GEOCALIB-TILT" = "GeoCalib 估的相机倾斜中位 {roll:.1f}°、俯仰中位 {pitch:.1f}°（{count:d} 帧，重力误差中位 {error:.1f}°）；{lens}"

# ---- worker
"E-GEOCALIB-NOGRAVITY" = "GeoCalib 没能估出重力方向（结果里有无效值 NaN）：画面里可能缺少直线、地平线或竖直的物体；换一段画面，或填上实拍「已知 Focal Length」再试"
