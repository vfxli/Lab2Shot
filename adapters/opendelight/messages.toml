# OpenDelight（adapters/opendelight）。一行一条：编号 = 模板。

# ---- 安装
"E-OPENDELIGHT-TARMISSING" = "下载的 OpenDelight 权重包 {archive} 里没有 {name}：包不完整或版本不对，删掉它重新安装"
"E-OPENDELIGHT-NOWEIGHTS" = "缺少权重 opendelight/{name}：管理员先执行 lab2shot ext install opendelight"

# ---- 计算
"N-OPENDELIGHT-CPUMATTING" = "DAViD 抠像没能用上显卡（能用的只有 {providers}），结果不变，但会很慢"
"W-OPENDELIGHT-NOFACE" = "OpenDelight 有 {count} 帧没有检测到面部（如第 {frames} 帧），这些帧输出全黑：脸太小、太侧或被挡住，交付前剪掉或补上这些帧"
"W-OPENDELIGHT-MANYFACES" = "有 {count} 帧里 OpenDelight 找到多张脸，只处理最大的（或和上一帧重叠的）那张：要处理别的脸，先把画面裁到那张脸"
