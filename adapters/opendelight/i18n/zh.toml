# The OpenDelight extension's own words and messages in Chinese (the same keys as en.toml).

"E-OPENDELIGHT-TARMISSING" = "下载的 OpenDelight 模型权重包 {archive} 里没有 {name}：包不完整或版本不对，删掉它重新安装"
"E-OPENDELIGHT-NOWEIGHTS" = "缺少模型权重 opendelight/{name}：管理员先执行 lab2shot ext install opendelight"
"N-OPENDELIGHT-CPUMATTING" = "DAViD 抠像没能用上显卡（能用的只有 {providers}），结果不变，但会很慢"
"W-OPENDELIGHT-NOFACE.other" = "OpenDelight 有 {count} 帧没有检测到面部（如第 {frames} 帧），这些帧输出全黑：脸太小、太侧或被挡住，交付前剪掉或补上这些帧"
"W-OPENDELIGHT-MANYFACES.other" = "有 {count} 帧里 OpenDelight 找到多张脸，只处理最大的（或和上一帧重叠的）那张：要处理别的脸，先把画面裁到那张脸"

[node."opendelight.delight"]
subtitle = "面部去光照"
description = "从面部照片或视频帧去掉光照，得到基础颜色（漫反射颜色，CG 流程里也叫 albedo）和脸部遮罩。逐帧处理，视频会闪。"
official.note = "上游把两样存成同一张 RGBA（save_image(torch.cat([res_torch, final_mask[:, :1]], dim=1))，第 293-300 行）；我们拆成两个口。上游自己跑抠像和人脸对齐，不吃遮罩。"

[node."opendelight.delight".port.mask]
label = "遮罩"

[node."opendelight.delight".param.enhancer]
label = "细节增强"

[node."opendelight.delight".param.resolution]
label = "处理分辨率"

[node."opendelight.delight".param.smooth_landmarks]
label = "关键点平滑"

[node."opendelight.delight".stage]
