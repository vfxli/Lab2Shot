# VidEoMT 扩展自己的界面字和消息（中文）。

# ---- 分割结果
"N-VIDEOMT-EMPTY" = "「VidEoMT 整画面分割」整段没有找到把握够的物体，分割是空的：把「检测阈值」调低再试"
"E-VIDEOMT-TOOMANY.other" = "「VidEoMT 整画面分割」留下了 {count:d} 个物体，超过分割图能编号的 254 个：把「检测阈值」调高再算"
"I-VIDEOMT-SEGMENTS.other" = "VidEoMT 分出 {count:d} 个分割：{names}"
"I-VIDEOMT-SEGMENTSMORE.other" = "VidEoMT 分出 {count:d} 个分割：{names}……"

[node."videomt.segment"]
subtitle = "整画面分割"
description = "不用提示词，整段镜头每个像素都分到一类：天空、树、建筑、道路、人、车……（VIPSeg 的 124 类）。「全景分割」里每个人、每辆车各有一个编号，整段不变；「类别分割」按类别，同类的合在一起。接「分割转遮罩」挑出要的类别或物体变成遮罩，接「多层 EXR 输出」写成 Cryptomatte。边缘按 720 左右的分辨率算，头发、树叶这类细边再接 BiRefNet / MatAnyone 精修。"
official.note = "上游只吃画面；类别表是 VIPSeg 的 124 类，写死在模型权重里。"
licence.note = "代码和模型权重是 MIT，但模型权重只在 VIPSeg 上训练，VIPSeg 只许非商业研究使用，所以按非商用对待；商用前请法务确认。"

[node."videomt.segment".param.resolution]
label = "处理分辨率"

[node."videomt.segment".param.threshold]
label = "检测阈值"

[node."videomt.segment".param.min_coverage]
label = "完整度门槛"

[node."videomt.segment".port.panoptic]
label = "全景分割"

[node."videomt.segment".port.classes]
label = "类别分割"

