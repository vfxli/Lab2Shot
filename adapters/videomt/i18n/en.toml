[extension.videomt]
summary = "An encoder-only online video segmentation model built on a plain ViT, with all spatial and temporal reasoning done inside the encoder"
license.name = "MIT (training data for non-commercial research only)"
license.summary = "The code and model weights are both MIT, but this panoptic model was trained only on the VIPSeg dataset, whose license states \"for non-commercial research only\", so it is treated as non-commercial; check with legal before commercial use. The DINOv2 backbone is Apache-2.0. A few files in the repository carry the NVIDIA Source Code License-NC (MinVIS's training and evaluation framework); Lab2Shot does not run them and uses only the MIT network code"
weight.vipseg_vit_large.note = "VidEoMT-L VIPSeg panoptic segmentation (1.3 GB, MIT; the VIPSeg training data is for non-commercial research only)"

