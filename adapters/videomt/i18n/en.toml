# The VidEoMT extension's own words and messages in English (the same keys as zh.toml).

# ---- segmentation results
"N-VIDEOMT-EMPTY" = "VidEoMT Panoptic Segmentation found no object it is confident enough about anywhere in the shot, so the segmentation is empty: lower Detection Threshold and try again"
"E-VIDEOMT-TOOMANY.one" = "VidEoMT Panoptic Segmentation kept {count:d} object, more than the 254 a segment map can number: raise Detection Threshold and cook again"
"E-VIDEOMT-TOOMANY.other" = "VidEoMT Panoptic Segmentation kept {count:d} objects, more than the 254 a segment map can number: raise Detection Threshold and cook again"
"I-VIDEOMT-SEGMENTS.one" = "VidEoMT found {count:d} segment: {names}"
"I-VIDEOMT-SEGMENTS.other" = "VidEoMT found {count:d} segments: {names}"
"I-VIDEOMT-SEGMENTSMORE.one" = "VidEoMT found {count:d} segment: {names}…"
"I-VIDEOMT-SEGMENTSMORE.other" = "VidEoMT found {count:d} segments: {names}…"

[node."videomt.segment"]
subtitle = "Panoptic Segmentation"
description = "No prompt needed: every pixel of the whole shot is assigned a class (sky, tree, building, road, person, car… the 124 classes of VIPSeg). In Panoptic Segmentation every person and every car has its own number, the same through the shot; Class Segmentation goes by class, merging everything of one class. Wire Segmentation to Mask to pick the classes or objects you want as a mask, or Multi-Layer EXR Output to write a Cryptomatte. Edges are computed at about 720 px; refine fine edges such as hair or leaves with BiRefNet / MatAnyone."
official.note = "Upstream takes only the image; the class list is VIPSeg's 124 classes, fixed in the model weights."
licence.note = "The code and model weights are MIT, but the weights were trained only on VIPSeg, which allows non-commercial research use only, so they are treated as non-commercial; check with legal before commercial use."

