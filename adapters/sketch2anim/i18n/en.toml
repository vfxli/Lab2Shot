[extension.sketch2anim]
summary = "Turns storyboard sketches into 3D animation: key poses, joint trajectories and a motion description control 3D motion generation, with 2D sketches mapped to 3D by a neural mapping"
license.name = "MIT (code) + HumanML3D / AMASS academic license (model weights)"
license.summary = "Research only. The code is MIT (author Lei Zhong 2025; the text allows commercial use, modification and redistribution), but the official pretrained model weights are trained on HumanML3D, whose motions come from AMASS, and the AMASS license allows only non-commercial academic research, so the model weights and the motions they generate may be used only for research and evaluation. The text encoder sentence-t5-large is Apache-2.0 (commercial use allowed), which does not change this. Commercial use needs retraining on licensed motion capture data"
weight.adapter.note = "Sketch2Anim official model weights adapter.ckpt (trained on HumanML3D, non-commercial), 357 MB"
weight.pretrain.note = "Sketch2Anim's officially released pretrained base pretrain_22joint_combine_adapter.ckpt (non-commercial), 303 MB; inference loads only adapter.ckpt and never reads this one"
weight.t5.note = "sentence-t5-large (Apache-2.0): encodes the English description into a condition vector, 1.3 GB"

# worker progress (worker.py)
