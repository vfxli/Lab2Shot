weight.bert-base-uncased.note = "BERT, GroundingDINO's text encoder (Apache-2.0)"
weight.sam-vit-b.note = "Segment Anything ViT-B object masks (Apache-2.0)"
weight.deaot-r50.note = "DeAOT R50 per-frame mask tracking (BSD-3-Clause)"
weight.unidepth-v2-vitl14-config.note = "UniDepth-V2 ViT-L configuration (default mode; CC-BY-NC-4.0 non-commercial)"
weight.unidepth-v2-vitl14.note = "UniDepth-V2 ViT-L keyframe / per-frame metric depth (default mode; CC-BY-NC-4.0 non-commercial)"
weight.prior-depth-anything-dav2-vitb.note = "Depth-Anything-V2-Base used by Prior-Depth-Anything (default mode; the original model is CC-BY-NC-4.0 non-commercial)"
weight.prior-depth-anything-vitb.note = "Prior-Depth-Anything ViT-B, completes depth from the SLAM points (default mode; Apache-2.0)"
