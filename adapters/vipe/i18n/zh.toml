weight.deaot-r50.note = "DeAOT R50 遮罩逐帧跟踪（BSD-3-Clause）"
weight.unidepth-v2-vitl14-config.note = "UniDepth-V2 ViT-L 配置（default 模式；CC-BY-NC-4.0 非商用）"
weight.unidepth-v2-vitl14.note = "UniDepth-V2 ViT-L 关键帧/逐帧米制深度（default 模式；CC-BY-NC-4.0 非商用）"
weight.prior-depth-anything-dav2-vitb.note = "Prior-Depth-Anything 用的 Depth-Anything-V2-Base（default 模式；原模型 CC-BY-NC-4.0 非商用）"
