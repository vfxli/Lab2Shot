weight.droid-slam.note = "DROID-SLAM 光流/BA 网络（BSD-3-Clause）"
weight.moge-2-vitl.note = "MoGe-2 ViT-L 关键帧度量深度（MIT）"
weight.geocalib-pinhole.note = "GeoCalib 初始焦距估计（Apache-2.0）"
