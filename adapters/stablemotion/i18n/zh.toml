[extension.stablemotion]
summary = "用没有配对的坏数据训练动捕清理模型：一个既能判别又能生成的扩散模型，识别并修复坏掉的帧；仅限研究"
license.name = "MIT（代码）+ AMASS 学术许可（模型权重）"
license.summary = "仅限研究。代码是 MIT，可以随便用；但发布的模型权重 StableMotion-BrokenAMASS 是在 AMASS 上训练的，AMASS 的许可只允许非商业的学术研究，所以这个节点按更严的一档标（宁严勿松）。要商用就得按官方 README 说的，拿自己的动捕数据重新训练一个模型。"

