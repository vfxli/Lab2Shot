# StableMotion 扩展自己的界面字和消息（中文）。

# ---- 骨架
"E-STABLEMOTION-NOSTATS" = "StableMotion 的归一化统计量不在：{path}。这两个文件（mean.pt / std.pt）是上游仓库自带的，扩展包可能装坏了：管理员重新执行 lab2shot ext install stablemotion"
"E-STABLEMOTION-SKELETON" = "「StableMotion 动捕清理」没法把接进来的骨架对应到 SMPL 的骨架：{reason}"
"E-STABLEMOTION-SKELETON.app" = "动作文件里的骨架对应不到 SMPL 的骨架：{reason}"

# ---- 帧
"E-STABLEMOTION-SHORT.other" = "这段动画在模型的 20 帧/秒上只有 {frames} 帧，「StableMotion 动捕清理」至少要 {least} 帧才看得出哪里坏了。接一段更长的动画，或者在「重定时」里把帧速率提上去"
"E-STABLEMOTION-SHORT.app.other" = "这段动画在模型的 20 帧/秒上只有 {frames} 帧，至少要 {least} 帧才看得出哪里坏了：换一段更长的动画"
"N-STABLEMOTION-PARTS.other" = "镜头 {seconds:.1f} 秒，超过「StableMotion 动捕清理」一次能看的 5 秒：判坏的帧落在 {parts} 处，每处各开一个 100 帧的窗口重画，只把判坏的帧写回去、好帧不动；窗口按坏帧的位置开，前后窗口可能重合也可能隔开（一般不超过 {overlap} 帧），不做交叉过渡"
"I-STABLEMOTION-FOUND" = "「StableMotion 动捕清理」判断 {bad} 帧有问题（共 {total} 帧）"
"W-STABLEMOTION-SHORTTAKE.other" = "这段动画只有 {seconds:.1f} 秒（模型自己的 {frames} 帧），不够「StableMotion 动捕清理」一次要看的 {window} 帧（5 秒）：实测不足 5 秒的镜头会被判坏很多帧（2 秒的镜头判坏 70%–100%，5 秒的只有 2%–3%）。接一整段动捕再切，比切好再清理可靠得多；「问题帧」曲线也要当心看"
"W-STABLEMOTION-SHORTTAKE.app.other" = "这段动画只有 {seconds:.1f} 秒（模型自己的 {frames} 帧），不够一次要看的 {window} 帧（5 秒）：不足 5 秒的镜头会被判坏很多帧（2 秒的判坏 70%–100%，5 秒的只有 2%–3%）。用一整段动捕清理后再切，比切好再清理可靠得多；「问题帧」曲线也要当心看"

[node."stablemotion.cleanup"]
subtitle = "动捕清理"
description = "SFU 和 EA 的 StableMotion：先逐帧判断这一帧的姿势是不是坏的（抖动、关节跳变、穿模、脚陷进地面），再只把判坏的那些帧重画一遍，判好的帧一帧不动。判断结果作为「问题帧」曲线一起交出来。训练数据是 20 帧/秒的 AMASS 动捕，手指和面部不参与。"
official.note = "「问题帧」曲线就是官方的 label：`detect_labels`（同文件 33-117）读第 233 个通道判每一帧好坏，out['label'] 再喂给 fix_motion。两遍都是官方 README 的那两条命令。"
licence.note = "仅限研究：代码是 MIT，但放出来的模型权重在 AMASS 上训练，AMASS 只许非商业的学术研究。要商用得按官方说明拿自己的动捕重训一个模型。"
cost.whole = "整段一次找问题帧，只有判坏的地方才按 5 秒一段重画"

