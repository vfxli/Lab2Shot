# Depth Anything 3 的消息（adapters/depthanything3）。

# ---- 节点和 worker
"E-DEPTHANYTHING3-NOFOCAL" = "「Depth Anything 3 深度贴图」选的模型输出真实尺度的深度贴图，它自己不估焦距：没有焦距算不出真实距离。在「已知焦距」填实拍镜头、把 AnyCalib 的焦距接到「已知焦距」上，或接一台摄影机；不知道镜头就把「模型」换成 Giant、Large 或 Base"
"E-DEPTHANYTHING3-NOFOCAL.app" = "选的模型输出真实尺度的深度贴图，它自己不估焦距：没有焦距算不出真实距离。在「已知焦距」填实拍镜头；不知道镜头就把「模型」换成 Giant、Large 或 Base"

"I-DEPTHANYTHING3-MODELWEIGHTS" = "模型 {model} 的权重"
"N-DEPTHANYTHING3-METRICSINGLEVIEW" = "Metric-Large 每帧单独看，没有跨帧注意力，多帧一起算对它不起作用；视频要前后不闪，把「模型」换成 Giant、Large 或 Base"

# ---- words (node texts from nodes.json and nodes.py, extension texts from extension.py)

[node."depthanything3.depth"]
subtitle = "深度贴图"
description = "画面 → 逐帧估计的深度贴图（字节 Depth Anything 3）。逐帧单独算，远近会跳；知道焦距（填「已知焦距」或从上游接一条线过来）用 Metric-Large 最稳。要整段前后稳定的深度贴图和摄影机，用「Depth Anything 3 深度与摄影机」。"

[node."depthanything3.depth".param.focal_mm]
label = "已知焦距"
placeholder = "自动"

[node."depthanything3.depth".param.filmback_mm]
label = "胶片背"
placeholder = "36"

[node."depthanything3.depth".param.model]
label = "模型"

[node."depthanything3.depth".param.model.option]
da3metric-large = "Depth Anything 3 Metric-Large"
da3-base = "Depth Anything 3 Base"
"da3nested-giant-large-1.1" = "Depth Anything 3 Giant"
"da3-large-1.1" = "Depth Anything 3 Large"


[node."depthanything3.depth".param.resolution]
label = "处理分辨率"

[node."depthanything3.depth".param.resolution.option]
252 = "252"
378 = "378"
504 = "504"

[node."depthanything3.depth".param.ray_pose]
label = "光线求焦距"

[node."depthanything3.depth".param.multi_view]
label = "多帧一起算"

[node."depthanything3.depth".port.sky]
label = "天空遮罩"
help = "模型自己判的天空概率（0–1，越大越像天空）。它也是深度贴图有效位的来源：天空那块没有距离可言"

[node."depthanything3.depth".official]
note = "x 就是画面（da3.py:114「x: Input images (B, N, 3, H, W)」）。逐帧模式下我们只用它的内参（intrinsics），不用它预测的外参。上游那两个可选的 extrinsics / intrinsics 输入只在**两个都给**时进网络（da3.py forward：有 extrinsics 才编摄影机 token）；逐帧没有外参，所以「已知焦距」参数（worker 收到的 fov_x_deg）**不进网络**：Giant / Large 上它顶掉预测的内参、用于随后的公制缩放和深度对齐（worker.py run_nested），Metric-Large 上它定尺度（metric = focal × output / 300）"

[node."depthanything3.depth".licence]
note = "代码 Apache-2.0；Base 和 Metric-Large 权重 Apache-2.0 可以商用，Giant 和 Large 1.1 权重 CC-BY-NC-4.0 非商用。"

[node."depthanything3.reconstruct"]
subtitle = "深度与摄影机"
description = "画面 → 每帧摄影机和深度贴图（Depth Anything 3），一次看整段画面。深度贴图前后帧稳定（静止墙面抖动 1 厘米以内），尺度接近真实；每段最多 110 帧，很长的固定机位镜头分段时会漂。只要逐帧深度贴图、不要摄影机时用「Depth Anything 3 深度贴图」。不出点云：官方只交深度和摄影机，点云是它的导出工具用深度反投影的；要点云接「深度转点云」。"

[node."depthanything3.reconstruct".param.step]
label = "隔帧"

[node."depthanything3.reconstruct".param.model]
label = "模型"

[node."depthanything3.reconstruct".param.model.option]
da3-base = "Depth Anything 3 Base"
"da3nested-giant-large-1.1" = "Depth Anything 3 Giant"
"da3-large-1.1" = "Depth Anything 3 Large"


[node."depthanything3.reconstruct".param.resolution]
label = "处理分辨率"

[node."depthanything3.reconstruct".param.resolution.option]
252 = "252"
378 = "378"
504 = "504"

[node."depthanything3.reconstruct".param.max_frames]
label = "每段最多帧数"

[node."depthanything3.reconstruct".param.max_frames.option]
32 = "32"
64 = "64"
110 = "110"

[node."depthanything3.reconstruct".param.loops]
label = "回环闭合"

[node."depthanything3.reconstruct".param.unit_cm]
label = "尺度"

[node."depthanything3.reconstruct".port.sky]
label = "天空遮罩"
help = "模型自己判的天空概率（0–1，越大越像天空）。它也是深度贴图有效位的来源：天空那块没有距离可言"

[node."depthanything3.reconstruct".official]
note = "「摄影机」是 intrinsics 加 extrinsics（da3.py:115-116 / specs.py:40-41）。没有遮罩或人物框输入口：Depth Anything 3 的 forward 只吃 x / extrinsics / intrinsics，遮罩进不了模型；想局部重建，在送进去之前把其余部分涂黑：「ViTDet 人物框」→「人物框转遮罩」→「图像合成」（留下）→ 这个节点的「RGB」口。Depth Anything 3 不出三维点图（Prediction 里只有 depth / sky / conf / extrinsics / intrinsics），所以这个节点没有「点云」口"

[node."depthanything3.reconstruct".licence]
note = "代码 Apache-2.0；Base 和 Metric-Large 权重 Apache-2.0 可以商用，Giant 和 Large 1.1 权重 CC-BY-NC-4.0 非商用。"

[extension.depthanything3]
summary = "从任意视觉输入预测空间一致的几何，摄影机位姿已知或未知都可以"

[extension.depthanything3.license]
name = "Apache-2.0（代码、Depth Anything 3 Base、Depth Anything 3 Metric-Large）+ CC-BY-NC-4.0（Depth Anything 3 Nested Giant-Large 1.1、Depth Anything 3 Large 1.1，非商用）"
summary = "代码 Apache-2.0。Depth Anything 3 Nested Giant-Large 1.1（模型卡 CC BY-NC 4.0）为非商用；Depth Anything 3 Large 1.1 在官方 README 的模型表里是 CC BY-NC 4.0，但它的 Hugging Face 模型卡写着 Apache-2.0（同系列 Depth Anything 3 Large 的模型卡 2025-11-19 已从 Apache-2.0 改成 CC BY-NC 4.0），按非商用对待；Depth Anything 3 Base 和 Depth Anything 3 Metric-Large 为 Apache-2.0，可商用（二者组合的米制结果可用于商业项目）。作者声明所有模型只用公开学术数据集训练。另外 Depth Anything 3 Small、Depth Anything 3 Mono-Large 也是 Apache-2.0，本扩展没有下载"

