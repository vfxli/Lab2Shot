"E-DA3LONG-OVERLAP" = "「重叠帧数」{overlap} 不小于「每段最多帧数」{chunk}：相邻两段没法对齐。把重叠帧数调到比每段帧数小（官方默认 120 帧一段、重叠 60）"
"E-DA3LONG-UNCOVERED" = "Depth Anything 3 Streaming 解算完有帧没有拿到摄影机：官方流式流水线的分段和输入帧数对不上，结果不能用。把这条报错报给技术人员"
"W-DA3LONG-VRAMSTEP" = "这张显卡约 {card:.0f} GB，放不下每段 {asked} 帧（约要 {need:.0f} GB）：这次按每段 {chunk} 帧、重叠 {chunk_overlap} 帧算（分段越短，段与段之间的接缝越多）。要按官方的 120 帧一段算，放到显存更大的卡上"
"W-DA3LONG-ASPECT" = "Depth Anything 3 Streaming 解出的横向焦距 {fx:.0f} px、纵向 {fy:.0f} px，差了 {diff:.0%}；真实镜头两者基本相同，画面特别宽时模型容易这样。摄影机原样交出，竖直方向的大小和位置可能被拉伸或压扁：用它之前先核对，能拿到实拍焦距时改用可以填已知焦距的节点（ViPE、WildPose）"
"W-DA3LONG-ASPECT.app" = "解出的横向焦距 {fx:.0f} px、纵向 {fy:.0f} px，差了 {diff:.0%}；真实镜头两者基本相同，画面特别宽时模型容易这样。摄影机原样交出，竖直方向的大小和位置可能被拉伸或压扁：用之前先核对，能拿到实拍焦距时改用可以填已知焦距的卡"

