name_empty = "对外名字不能空着"
widget_bad = "控件只能是 menu（下拉）或 checkbox（复选框），不是 {widget}"
options_list = "options 要是一个列表"
option_shape = "每一项要有值和显示名"
option_repeat = "和前面一项的值重复"
