params = "节点 {id} 的 params 要是一个对象"
promoted = "节点 {id} 的 promoted 要是参数名的列表"
edge = "第 {n} 根线要有 from 和 to，各是 [节点, 端口]"

# ---- 条件表达式（engine/conditions.py）的说明与网页共用 ui.conditions.*（i18n/<lang>/ui/conditions.toml）

# ---- 模板对外参数名约定（engine/conventions.py，lab2shot check 的报告）
[conventions]
# _conventions.md 固定名表的说明里标出例外卡片的词（「TRAM 例外」）
exception = "例外"
none = "（没有）"
unpaired = "_conventions.md 固定名表「{name}」这一行有 {names} 个名字、{groups} 组目标（按「/」分组）：名字与目标组要一一对应，或者每个名字各占一行"
unread = "_conventions.md 固定名表「{name}」的目标读不出：{what}（写成 `扩展.节点.参数`）"
no_type = "_conventions.md 固定名表「{name}」的目标 {type}.{param}：没有 {type} 这种节点"
no_param = "_conventions.md 固定名表「{name}」的目标 {type}.{param}：{type} 没有参数 {param}"
bound = "对外名 {name} 只指 {want}，这里指的是 {type}.{param}"
several_outputs = "卡上有 {n} 个格式输出节点（多种交付）：用 {names}，不用 file_name"
one_output = "卡上只有一种交付：它的名字叫 file_name，不叫 {names}"
last_button_staged = "最后一步的按钮 {name} 要写 \"word\": \"{word}\"（显示「{want}」：卡上有其他阶段按钮），现在显示「{label}」"
last_button_alone = "最后一步的按钮 {name} 要写 \"word\": \"{word}\"（显示「{want}」：卡上没有其他阶段按钮），现在显示「{label}」"
exr_lossless = "exr_compression 的下拉在带数据层的卡上只能列无损的 {allowed}，多了 {extra}"
focal_filmback = "公开了 focal（{target}）就要公开同一节点的 filmback（{node}.filmback_mm）"
filmback_when = "{name} 的禁用条件要含 not focal（没填焦距时置灰），现在是 {now}"
node_id = "节点 id {id} 不是看得懂的词（小写字母开头，只用小写字母、数字和 _，至少 3 个字符）：对外名从它来"
derived_taken = "节点 id {id} 的参数 {param} 推导出的对外名 {want} 是固定名表里另一件事的名字：给这个节点换一个 id（通则 2）"
derived_name = "对外名 {name}（{target}）不在固定名表里，应叫 {want}（节点 id_参数名，通则 1）"
meaning = "{name} = {value} 在固定名表里是「{meant}」，这张卡上是「{label}」（取值的含义各卡一致，通则 3）"
after_button = "参数 {params} 作用于阶段按钮 {button}（{target}），却排在它之后：挪到按钮前面"

