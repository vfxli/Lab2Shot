# 接进来的一列值，跟在说明后面
values = "：{values}"
option_shown = "{value}（{label}）"

[engine.exposed]
# 参数界面（exposed）哪里不对：E-EXPOSED-* 的 {where} / {why} / {widget}
interface = "参数界面"
nth = "第 {n} 项"
not_list = "exposed 要是一个列表"
expr_text = "要写成文字"
group_name = "组要有名字"
group_children = "组的 children 要是一个列表"
neither = "既不是组，也不是带 name 和 target（一个或一组参数）的参数"
targets_repeat = "同一个参数列了两次"
targets_unlike = "不是同一种参数（类型、取值范围、可选值、控件或单位不同），一项不能同时驱动它们"
targets_values = "现在的值不一样：参数界面只显示第一个的值，改成一样再公开成一项"
