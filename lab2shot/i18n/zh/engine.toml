[engine.exposed.widget]
menu = "下拉"
checkbox = "复选框"
either = "下拉或复选框"

[engine.routes]
# 模板每条路线都能读图、规划（lab2shot check 的报告）
defaults = "默认值"
unreadable = "{where}：节点图读不进来：{why}"
unplanned = "{where}：交付路线规划不了：{why}"
switch_way = "下拉「{menu}」选「{option}」时「{node}」走第 {way} 路，它只有 {ways} 路"
no_entry = "{where}：{target} 要使用者给（选文件或在视图里点），应用模式里却没有入口：公开它，或者在 meta.internal 里写明这张卡不需要"

[engine.interface]
# 同一种节点在各张卡上公开的参数要一致（lab2shot check 的报告）
missing = "少了 {params}"
extra = "多了 {params}"
differs = "{param} 的对外名 / 显示名 / 条件的写法不同（{here}；多数卡如「{like}」是 {there}）"
joiner = "；"
unlike.other = "{name}: {type} 公开的参数与其余 {others} 张卡不一致：{parts}（有意不同就在 meta.own_interface 里写上 {type}）"

[engine.kind]
# 端口给的是什么（Port.data）
data = "数值图"
picture = "画面"

[engine.contract]
output_port = "输出口"
empty_undeclared = "交了空包，口却没声明 may_be_empty"

[engine.shape]
# 节点图文件的结构哪里不对（E-GRAPH-SHAPE 的 {what}）
nodes = "nodes 要是一个列表"
edges = "edges 要是一个列表"
node = "第 {n} 个节点要有文字的 id 和 type"
id.other = "节点 id「{id}」要是不超过 {most} 个字符的文字，不能有 . / @ : 、空白、控制字符或看不见的格式字符"
