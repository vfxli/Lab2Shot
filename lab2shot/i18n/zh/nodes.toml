description = "把一条列表并回一份数据，什么列表都行：几个人的人物框并成一份多人的人物框，逐个算的场景并成一个场景（每条放在 /shot/<条目名> 下），跟踪点、分割图同理。和「拆成列表」相反。"

[node.motion_warp]
subtitle = "运动向量变形"
description = "和 Nuke 的 IDistort 是同一个节点（UV 用 forward / backward）：图像 + 运动向量 → 把下一帧（或上一帧）拉到这一帧上的结果，每个像素去邻帧里它移到的地方取值。检查运动向量准不准（和这一帧相减）、把邻帧的遮罩或修补推一帧、做时间上的降噪都用它；图像、遮罩、深度贴图都能变形，出来还是原来的类型。要一步跨到参考帧接「运动向量转ST 贴图」。"

[node.motion_warp.param.direction]
