[node.ensemble_depth]
subtitle = "深度集成"
description = "把几个模型的深度贴图合成一张。候选要先对齐到同一个参考（同一个摄影机空间，用 depth_align）：本节点只做合成，不做对齐，参考不同或尺度含义不同的候选会被拦下。「目标」：准确＝逐像素加权共识，整体和其余候选不一致的候选整条不用（实测留出集形状误差中位数比 MoGe 低 15%、比 UniK3D 低 8%，但有两条比 MoGe 差 8%–14%）；尺度＝在准确的基础上，参考的尺度和候选自己的真实尺度差 20% 以上时改用候选的共识尺度（实测留出集与 UniK3D 持平）；时域稳定＝整体远近取最稳且和共识一致的候选（时间锚，「用途」设为「只作时间锚」的候选也算），细节取共识（实测不如 ViPE 自己稳）。输出合成后的深度贴图、置信度、每个像素取自哪个候选、逐帧逐候选的得分曲线；结果的图层名按用了哪些模型和什么目标自动生成，许可取候选里最严格的那个。"
