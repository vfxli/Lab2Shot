help = "点云的颜色取自这张画面。不接就按远近着色：近的亮、远的暗"

[node.points_from_depth.port.mask]
label = "排除"

[node.points_from_depth.port.confidence]
help = "深度贴图节点给的置信度：低于「置信度门槛」的点不进点云（模型自己没把握的地方：物体边缘拖出的飞点、天空、反光）"

[node.points_from_tracks]
subtitle = "跟踪点转 3D"
description = "2D 跟踪点 + 深度贴图 + 摄影机 → 3D 跟踪点（带编号、可见性和速度的动画点云，厘米）：每个点在它看得见的帧上取画面下的深度贴图数值，放进摄影机的世界，被挡住的帧在前后看得见的位置之间补上。任何 2D 跟踪点（CoTracker3、TAPNext++、AllTracker、WOFTSAM 的四个角）、任何深度贴图、任何摄影机都能接，3D 跟踪点在 Houdini 里当定位器，钉 CG 道具。"

[node.points_from_tracks.port.image]
label = "颜色"

[node.position_from_depth]
subtitle = "深度转世界位置"
description = "深度贴图 + 摄影机 → 每个像素的三维坐标（位置图，厘米，三通道 EXR）。任何深度贴图节点、任何摄影机都能接，同一个解算节点出的深度贴图和摄影机一定对得上；位置图在 Nuke 里做重新打光、投射、按位置抠遮罩。要法线接「深度转法线」，要点云接「深度转点云」。"

[node.premultiply]
subtitle = "预乘"
description = "相当于 Nuke 的 Copy 接 Premult：画面 + 遮罩 → 带 alpha 的图像，遮罩当 alpha，颜色乘上它（预乘）。抠像和分割的结果（BiRefNet、MatAnyone 2、SAM 3……）接这里，就能交成带 alpha 的 EXR（预乘）或 PNG，画面原来的 alpha 换成这个遮罩；结果在渲染空间里（sRGB 编码的 Rec.709，和画面一样），接格式输出节点写 EXR 时再转到交付的颜色空间（默认 ACEScg，按先反预乘、转换、再预乘的规矩）。"

[node.premultiply.port.image.output]
label = "RGBA"

[node.rasterize_geometry]
subtitle = "场景投影成 2D"
description = "场景（人物、网格、点云）+ 摄影机 → 从摄影机看过去的遮罩（轮廓）、深度贴图（厘米）和法线贴图，原画面大小。任何解算出的人物、读进来的模型和点云都能变回 2D：给抠像节点当遮罩、给合成用的深度贴图和法线贴图，也可以和深度贴图方法的结果互相对比。"

[node.rasterize_geometry.param.width]
placeholder = "摄影机的"

[node.rasterize_geometry.param.height]
placeholder = "摄影机的"

[node.rasterize_geometry.param.space]
label = "法线坐标系"

[node.resample]
subtitle = "重采样曲线"
description = "和 Houdini 的 Resample 是同一个节点：三维曲线 → 每条曲线按等弧长重新取固定点数的三维曲线。发丝、毛发导向线动辄每条上百个点，交给 DCC 或者写文件之前降到几十个点，形状不变、文件小得多；点数比原来多就是加密。宽度、颜色、朝向这些逐点的属性跟着点一起重采样。每条曲线的点数一样，和 Houdini 里 Resample 到固定段数的结果一致。"

