description = "一段表情 → 套到另一个角色的融合变形上，交出表情动起来的蒙皮角色。「表情」接面部解算的「表情曲线」（MediaPipe 的 ARKit 52 条、SMIRK / Pixel3DMM 的 FLAME 表情），或者带表情动画的角色；「目标」接带融合变形的角色（Character Creator / AccuRIG 的 ARKit 形变、MetaHuman、FLAME 角色都行，一帧就够，带着身体动画也行，关节的动画原样留着）。两边的名字在「对应关系」里对上：和「动作重定目标」同一个编辑器，人形图换成按眉毛、眼睛、嘴分组的表情槽；ARKit 的名字不管大小写、下划线、L / R 还是 Left / Right 都自动认，认不出的手动点。权重原样搬（0..1），目标没配上的形变保持 0。FLAME 的 expression_00… 是统计分量、不是具体动作，只对得上同样带这些分量的 FLAME 角色。"

