[node.pointcloud_fuse]
subtitle = "点云融合"
description = "把一整个镜头里逐帧的点云（或逐帧深度 + 摄影机）融成一片静止的全局点云，帧与帧之间大量重复的点合在一起。接「逐帧点云」走体素拼接：所有帧的点拼起来，每个体素只留一个质心；接「深度贴图」走 TSDF 融合：逐帧把深度反投影进体素网格、累加带符号距离，最后在表面过零处插值出点，质量更高、去噪更强。两种接法都用「体素大小」控制去重力度。接深度时再接「画面」，每个点取它来源那一帧、那个像素的颜色（融合时按体素平均）；不接按远近着色。接逐帧点云时颜色随点云自带。"

[node.pointcloud_fuse.param.voxel_size]
