[node.crop]
subtitle = "Crop"
description = "和 Nuke 的 Crop 是同一个节点：把画面裁成一块，裁完的这一块就是新的画面框。从四条边各切掉多少像素，四个数都填 0 就什么都不做。有些解算器对构图有要求——面部、手部这类要主体占画面的主要部分；解摄影机与点云的更明显：同一段 4K 素材不裁着跑，COLMAP 267 帧里只解出 3 个机位，裁成以主体为中心的方图之后 267 帧全部解出。先用它裁到主体上再接解算。扩边（overscan）不跟着走：裁完的画面就是它自己那一块，没有框外的像素。"

