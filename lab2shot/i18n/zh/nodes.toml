[node."usd.output"]
subtitle = "USD 输出"
description = "把三维数据写成 USD 文件：模型、摄影机、点云、三维曲线、骨架动画、蒙皮角色都原样写出，Maya、Houdini、Blender 都能读。「场景」可以接多根线，也可以接一条场景列表（每条写在 /shot/<条目名> 下），写前打包成一个场景。接到「输出」上交给你。"

[node."usd.output".param.format.option]
usd = "二进制 .usd"
usda = "文本 .usda"

[node."usd.output".param.unit.option]
cm = "厘米 · Maya"
m = "米 · Houdini"

[node.uv_from_position]
subtitle = "规范坐标转 UV"
description = "规范坐标的位置图 → UV 坐标图：每个像素在模型上的 UV 坐标（两通道 EXR，0–1），同一个点在每一帧的 UV 相同。位置图要是模型自己的坐标系（如「FaceAnything 面部通道」的规范坐标）：世界坐标和摄影机坐标随镜头移动，投出来的 UV 不固定，会被拦下；接上遮罩只算遮罩里的像素，投射的范围也只按这些像素算。UV 坐标图在 Nuke 里用 STMap 贴图，在 Houdini 和 Maya 做纹理传递。"

[node.uv_from_position.param.way]
label = "投射方式"

[node.uv_from_position.param.way.option]
cylinder = "柱面"
sphere = "球面"
plane = "平面"

[node.uv_from_position.port.position]
help = "模型自己坐标系里的位置图（规范坐标）：投射按整段画面的包围盒做，每帧的 UV 对得上"

[node.uv_from_position.port.mask]
help = "只在遮罩里的像素上算 UV，包围盒也只按这些像素算（脸以外的背景不参与）"

[node.value_float]
subtitle = "浮点"
description = "在这里填一个小数和它的单位 → 一个浮点数值。接到任何小数参数的输入口上（焦距、胶片背、强度……），一处填写，几个节点共用。"

[node.value_float.param.unit.option]
cm = "cm"
m = "m"

[node.value_int]
subtitle = "整数"
description = "在这里填一个整数和它的单位 → 一个整数数值。接到任何整数或小数参数的输入口上（帧号、数量、分辨率……）。"

[node.value_int.param.unit.option]
cm = "cm"
m = "m"

[node.value_string]
subtitle = "文字"
description = "在这里填一段文字 → 一段文字数值。接到任何文字参数的输入口上（人物编号、类别名……）。"

[node.value_toggle]
subtitle = "布尔"
description = "在这里开或关 → 一个开关。接到任何开关参数的输入口上，一处切换，几个节点一起变。"

[node.value_vector]
subtitle = "向量"
description = "在这里填 X 轴、Y 轴、Z 轴三个小数和它们的单位 → 一个向量。接到任何向量参数的输入口上（位置、朝向……）。"

[node.value_vector.param.unit.option]
cm = "cm"
m = "m"
