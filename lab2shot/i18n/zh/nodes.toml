[node.retarget]
subtitle = "动作重定目标"
description = "一段骨架动画（或一个蒙皮角色的动作）→ 换到另一副骨架上，交出目标层级上的骨架动画。和 Maya HumanIK、Unreal IK Retargeter 是同一件事：两边的身体部位在「对应关系」里对上（在视图里先后点两边的关节就连上，没配的按名字和层级自动认），静止姿势（T 形站姿、A 形站姿都行）先对齐，再把动作换过去；脊柱、颈、手指两边节数不一样时，弯曲按骨长分摊到每一节，不会全挤在一两节上。水平位移 1 : 1 跟着动作（角色踩在画面里那个人的位置上）；髋的高度按「髋高依据」（腿长 / 身高 / 臂长 / 不缩放）× 髋高倍率抬高，「髋高跟法」选跟着脚抬高（楼梯、跳跃、坐地也对）或按比例（平地），两边脚底自动对齐，还能加「高度偏移」；骨头长度和缩放用目标自己的。两边有一边没有髋、都有手时（HaMeR 解出的手、只有手的绑定）只配手：按手腕和五根手指对齐，手腕 1 : 1 跟着动作，髋高那几项不起作用。「角色缩放」把整个角色按身高自动或按手填倍率放大，之后再算髋高。「目标」只用它的骨架，一帧的角色（「标准人」、刚绑定的角色）就够。要看蒙皮效果接「线性蒙皮变形」，交付骨架直接接「FBX / USD 输出」。"

