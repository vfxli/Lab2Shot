[node.name]
subtitle = "命名"
description = "和 Houdini 的 Name（SOP）是同一个节点：给数据起一个名字，写出和交付都用它：场景放到 /shot/<名字> 下，列表按「名字_序号」逐条改名，其他数据把名字记在数据上，「逐项结束」收集时用。两份数据重名时用它分开，不会有人替你偷偷改名。"

[node.normal_from_depth]
