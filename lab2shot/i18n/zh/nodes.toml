[node.gate]
subtitle = "阻断"
description = "一根线上的开关：「通过」勾着就原样交出接进来的数据；不勾就是阻断——它不取输入、上游整条不算，它自己和只靠它的下游显示「已跳过（被阻断）」，不报错也不出警告。下游的可选输入、多线输入里的一根、「输出」「合成场景」「合成列表」「多层 EXR 输出」里接着它的那一行，就当没接（多层 EXR 不留空层）。做模板时把「通过」公开成复选框，用的人就能一键关掉一个功能分支；几个分支要一起开关，用一个「布尔」节点接到它们各自的「通过」口，两条互斥的分支（开一条、关另一条）其中一个打开「反过来」。"

[node.gate.param.through]
label = "通过"

[node.gate.param.invert]
label = "反过来"

[node.has_data]
subtitle = "有没有"
description = "问接进来的那根线这次有没有东西，给出一个布尔：上游是空的、被「阻断」关着、或是没选文件的读取（以及只把它们转手的「切换」「阻断」）就是「否」，其余是「是」。只看在不在，不取内容，上游不会为它计算；答案在算之前就有，接到「切换」的「走哪一路」或「阻断」的「通过」上，提交前就定了走哪条路。做模板时用它实现「上传了就用，没上传就换一条路」，比如上传了参考动作就补帧、没上传就纯生成。"

