# ---- 核心节点

[node.attrib_delete]
subtitle = "删除属性"
description = "点云或三维曲线 → 去掉点上挂着的一些属性：写出属性名（空格或逗号分开，可以用 * 通配，和 Houdini 的 AttribDelete 一样）。模型算出来的置信度、法线、类别、点的编号都带在点上，交付前不想给下游的就在这里删掉，文件更小。点、坐标和颜色一个都不动，删的只是点上挂着的值。这份数据上现在有哪些属性，看节点右下角的感叹号。"

[node.attrib_delete.param.attributes]
label = "属性名"
placeholder = "先接上数据"

[node.auto_ground]
subtitle = "自动落地"
description = "场景 → 转正并落在 y = 0 上的场景（摄影机和人一起）。给了重力方向（GeoCalib 等给的每帧摄影机里朝上的方向）先绕原点转正，让 Y 轴真正朝上（解算出的世界跟着第一帧摄影机，摄影机低头或歪着地面就是斜的；只转倾斜和俯仰，朝向不变），再上下移动让地面落在 y = 0：按人脚踩的高度（骨架动画按最低的关节），或者点云里最密的一层。进来的是什么出去还是什么；要自己填数值接「变换」。"

[node.auto_ground.param.gravity]
label = "重力方向"

[node.auto_ground.param.gravity_error]
label = "重力误差"

[node.auto_ground.param.source]
label = "地面依据"

[node.auto_ground.param.source.option]
people = "人物脚底"
points = "点云"
none = "不落地"

[node.auto_ground.param.percentile]
label = "落地帧比例"

[node.bake_geometry]
subtitle = "烘焙成几何体"
description = "蒙皮角色 → 每帧变形的模型（几何缓存）：融合变形和蒙皮按 DCC 的算法算好，每帧的顶点写死，骨骼不要了。要写进没有骨骼的格式先接它；结果和原来的动作完全一样，但不能再调骨骼。只要骨骼接「提取骨架」。"

[node.blast]
subtitle = "按分区取出"
description = "模型 → 只剩一个分区的模型：网格上叫这个名字的那几个面留下，其余的面和其余的网格都不要了。分区就是 USD 的 GeomSubset（网格的一部分），Houdini 读成图元组、Maya 读成面集；面部解算给的是整颗头，头发解算要的是头皮，就用它取出「scalp」那一块。点按留下的面重新编号（没用到的点不带出来），UV、法线和逐点属性跟着切，逐帧变形的几何缓存每帧都切。"

[node.blast.param.subset]
label = "分区"
placeholder = "先接上几何体"

[node.bone_deform]
subtitle = "线性蒙皮变形"
description = "骨架动画 + 蒙皮角色 → 挂上这段动画的蒙皮角色（网格、蒙皮、融合变形原样，原来的动画换掉）。只核对、不猜：两副骨架的关节名和父子关系要逐一相同，不一样就报错并列出哪里不同；动画来自另一副骨架时先接「动作重定目标」。典型接法：「动作重定目标」的骨架动画接进来，角色接同一个「目标」（例如「标准人」的一个输出口同时连重定目标的「目标」和这里的「蒙皮角色」）。视图里直接看到蒙皮变形；要网格缓存再接「烘焙成几何体」。"

[node.bone_deform.param.skeleton_path]
label = "动画骨骼"
placeholder = "第一个"

[node.bone_deform.param.character_skeleton]
label = "角色骨骼"
placeholder = "第一个"

[node.bone_deform.port.character]
help = "挂动画的角色：网格、蒙皮、融合变形原样，原来的动画被换掉"

[node.bone_deform.port.skeleton]
help = "要挂上的动画：骨架层级要和角色的完全一样（通常是「动作重定目标」交出的）"

[node.bone_deform.port.character.output]
help = ""

[node."boxes.output"]
subtitle = "人物框输出"
description = "人物框 → JSON（每个人每帧的框，脚本和 DCC 插件读）、CSV（每行一帧一个人，Excel、Houdini 都能读），或 Nuke 的 Tracker 节点（一个人一条 track，跟的是框的中心）。写成 Nuke 节点时，节点上有「复制到 Nuke」，复制了就能粘贴进合成；它只定名字和格式，接到「输出」上才真正写出文件。"

[node."bvh.import"]
subtitle = "导入 BVH"
description = "导入动作捕捉的 BVH（.bvh，CMU、Rokoko、MotionBuilder 导出）：骨骼层级和每帧的动作是一个骨架动画，帧速率按文件里的 Frame Time，帧号从 1 开始。BVH 不记录单位，在「单位」里说；只有骨骼没有网格，要带网格的角色用别的三维格式的导入节点。"

[node."bvh.import".param.unit.option]
cm = "厘米"
m = "米"
auto = "自动（按骨长估计）"

[node."bvh.import".port.skeletons]
waits = "选一个骨架动画"

[node."bvh.import".port.fps]
help = "BVH 记的帧速率（Frame Time 的倒数）。接到动作模型或格式输出节点的「帧速率」，就跟这个文件走"

[node."bvh.import".fact.models]
kinds = "选的几何体"

[node.camera]
subtitle = "创建摄影机"
description = "和 Nuke 的 Camera3、Houdini 的 Camera 是同一个节点：在这里填焦距、胶片背、位置和朝向 → 一台不动的摄影机。焦距、胶片背、主点也可以接线（「AnyCalib 镜头标定」的同名输出口、「拆分摄影机」），接了就用接的；默认在原点朝 -Z 轴看，接上画面就有它的分辨率和帧范围，那张画面也就是它的图像平面（三维视图透过它看时垫在底下）。要摄影机的节点（SAM 3D Body、GVHMR……）接它就是固定机位加已知焦距；一个焦距都没有时它是空的，接着的节点照自己的算。"

[node.camera.param.focal_mm]
placeholder = "自动"

[node.camera.param.filmback_mm]
placeholder = "36"

[node.camera.param.translate]
label = "位置"

[node.camera_space]
subtitle = "摄影机空间转换"
description = "场景 + 来源摄影机 + 目标摄影机 → 同一份场景，搬进目标摄影机的世界里，让它在目标摄影机下和画面对上。人、网格、骨架、曲线、点云、高斯、摄影机都能搬；来源摄影机留空表示场景就在摄影机前面（SAM 3D Body、HaMeR、SMIRK…），有自己世界的结果（WHAM、GVHMR）把它的「参照摄影机」接到「来源摄影机」；搬一台解算器求的摄影机时，「场景」和「来源摄影机」都接它，选「整段平滑」，交出的摄影机就在目标摄影机的世界里（位置随比例走，朝向只转不缩，镜头不变）。只要一个项目交得出摄影机，它的空间就能转到任何别的项目的空间。只换位置，数据本身不变。"

[node.camera_space.param.fit]
label = "贴合方式"

[node.camera_space.param.fit.option]
per_frame = "逐帧贴合"
whole = "整段平滑"

[node.camera_space.port.target_camera]
label = "目标摄影机"
help = "搬到哪台摄影机的世界里：解出来的那台（ViPE、COLMAP…）或者「导入 USD」进来的真摄影机。两台摄影机的焦距、片门必须一样（模板用「拆分摄影机」把目标摄影机的喂给解算器）"

[node.camera_space.port.scene]
help = "要搬的东西：人、网格、骨架、曲线、点云、高斯、摄影机"

[node.camera_space.port.source_camera]
label = "来源摄影机"
help = "场景现在待在哪台摄影机的空间里：有自己世界的解算器（WHAM、GVHMR）把它的「参照摄影机」接过来。留空表示场景就在摄影机前面、没有世界位置（SAM 3D Body、HaMeR、SMIRK、MediaPipe 面部），每帧直接按目标摄影机摆进世界"

[node.camera_space.port.reference]
label = "参照点云"
