[node.ensemble_normal]
subtitle = "法线集成"
description = "把几个模型的法线逐像素在单位球面上合成一张。候选要在同一个空间（都是相机空间或都是世界空间）；同一个模型来的候选（例如 MoGe 自己的法线和 MoGe 深度算出的法线）只算一票。「目标」：准确＝先求球面中位数，离它超过三倍分散度（至少 5°）的候选在这个像素不用，其余按权重求平均方向；稳健＝直接取球面中位数，个别候选错得再远也拉不动。实测（12 条带真值素材，调参 7 条、留出 5 条）：两个目标都未过验收（留出集角度误差中位数只比最好的单模型 MoGe 好 1–2%，且有一条差 5% 以上），所以没有放进任何卡片。「区域」为「人体」的候选（例如 Sapiens2，只会算人）只在「人体区域」里参与。输出合成后的法线、置信度、每个像素最接近哪个候选、逐帧各候选和结果的角度差；结果的图层名按用了哪些模型和什么目标自动生成，许可取候选里最严格的那个。"
