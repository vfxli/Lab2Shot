[node.composite]
subtitle = "图像合成"
description = "相当于 Nuke 的 Merge：一张图和一张遮罩按一种运算合成一张。最常用的是相乘——「挡掉」把遮罩里的那块抹黑（解摄影机之前挡掉走动的人），「留下」只保留遮罩里的那块。遮罩自动铺到图像的每条通道上。「盖上（A over B）」和 Nuke 的 Merge over 一样：预乘 alpha 的 A 盖在「底图」上，A 透明的地方露出底图（这时用「底图」口，不用「遮罩」；「不透明度」调低时 A 半透明，A 本身不带 alpha 时也能透出底图）——比如把 AllTracker 的贴片、RoMa 对齐过来的图合到原图上看。"

