[node.pointcloud_fuse.port.image]
label = "画面"
help = "点云的颜色取自这张画面：每个点取它来源那一帧、那个像素的颜色，融合时按体素平均。不接就按远近着色：近的亮、远的暗。接「逐帧点云」时颜色随点云自带。"

[node.pointcloud_fuse.port.camera]
