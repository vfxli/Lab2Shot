[node.draw_figure]
subtitle = "手画简笔画"
description = "一帧一个关键姿势：在参数面板点「添加帧」，当前帧上放一个站好的火柴人（T 形站姿），再在 2D 视图里把关节一个个拖到位。第二帧起可以「基于前一帧」——把上一个姿势原样复制过来再改。画好接给「Sketch2Anim 动作生成」的「草图」口。接一段图像序列进来，就在这段图像序列的每一帧上画：时间线拖到哪一帧，底图显示那一帧、火柴人也是那一帧画的那个。那张图只是照着画的底图，不参与计算；不接就在空白画布上画。两个火柴人的髋关节之间就是身体走的路线（只画一个就没有路线，身体大致留在原地）；画大画小不影响结果，只有姿势和位置的变化起作用。"

[node.draw_figure.param.poses]
label = "关键姿势"
placeholder = "点「添加帧」放第一个姿势"

[node.draw_figure.port.image]
label = "图像"
help = "照着画的底图，一段图像序列：时间线拖到哪一帧就显示那一帧，你在那一帧上画。这张图不参与计算——下游 Sketch2Anim 只吃火柴人的关节坐标，一个像素都不吃"

[node.draw_mask]
subtitle = "手画遮罩"
description = "在 2D 视图里沿着要的范围拖一圈，得到一张遮罩。一张静止遮罩——画一次整段镜头都用它，没有关键帧、不跟着主体动（所以不叫 Roto：Nuke 的 Roto 是逐帧调形状的动画样条，这个不是）。用在自动挑不出你要的那一块的时候：SAM 3 要一个词说得清，BiRefNet 只找最显著的那一个，而「这个人的外套」「左边第二个人」说不清也选不了——圈一圈就定了。常见的两处：给 MatAnyone 2 这类抠像节点的「粗遮罩」起个头（它们只读第一帧），固定机位镜头的垃圾遮罩（机位一动这张就不对了，别用在手持上）。要扩边、羽化、反转，后面接「遮罩调整」。"

[node.draw_mask.param.shapes]
label = "形状"
placeholder = "在 2D 视图里拖出轮廓"

[node.draw_mask.port.image]
label = "图像"

[node."exr.output"]
subtitle = "多层 EXR 输出"
description = "相当于 Nuke 的 Shuffle / Copy 拼好图层再 Write：几样结果 → 同一个 EXR 的不同图层，每帧一个文件。「图层」表一行一个输入口，写明这根线写进哪个图层、哪几个通道，从上到下就是图层顺序。默认按数据类型起名：图像 R G B，深度 Z，法线 R G B，位置 XYZ，遮罩 A，ST 贴图 R G，分割图写成 Cryptomatte（硬边：一个像素只属于一个物体），运动向量写成 Nuke 的 motion 图层；图层名和通道名都能改。Nuke 里一个 Read 拿到全部；「读取图像序列」读回来每个图层还是原来的类型，数据图层总是无损 32 位。只有一张的图层（ST 贴图、HDRI）和逐帧图层写在一起时每一帧都带着它（Nuke 读图像序列要求每帧图层相同）；只要一份就单独接「图像序列输出」。它只定名字和格式，接到「输出」上才写出文件。"
