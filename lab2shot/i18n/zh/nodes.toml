[node.merge]
subtitle = "合成场景"
description = "和 Houdini 的 Merge（SOP）、Nuke 的 Scene 是同一个节点：模型、摄影机、点云、三维曲线、骨架动画、蒙皮角色 → 合成一个场景，一起变换、一起落地。写文件不需要它：格式输出节点自己就收多根线；也可以接一条场景列表，每条放在 /shot/<条目名> 下。帧数不同的按帧号对齐，两样数据重名（每台摄影机都叫 camera）提交前拦下，用「命名」各起一个名字。"

[node.merge_items]
