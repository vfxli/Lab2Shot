[node.ensemble_matte]
subtitle = "抠像集成"
description = "把几个抠像模型的 Alpha 合成一张。先做对象检查：画出的对象和「对象」（用户自己选的对象，例如 SAM 3 点选的首帧遮罩）多一块或少一块的候选整段不用；用同一份粗遮罩的候选（例如 VideoMaMa 用 BiRefNet 的粗遮罩）只算一票，几票对「哪个是对象」有分歧时按多数定，票数相同时按谁画得最接近「对象」定，输掉的候选这一帧不用；留下的按权重平均。「目标」：准确＝对象检查宽一些（未过验收）；稳健＝对象检查严一些（实测 117 条素材没有一条找错对象，帧间稳定性比 VideoMaMa 好 8% 且没有一条变差，边缘和 MSE 中位数好 24%，SAD 中位数差 9%）；边缘＝对象检查同「准确」，在「用途」为「参与合成（最可信）」的候选和其余候选有分歧的地方倚重它（实测以 VideoMaMa 为最可信：边缘中位数比 VideoMaMa 好 22%，留出集差 5% 以上的从 8 条降到 2 条，仍未过验收）。卡片只用「稳健」。输出合成后的 Alpha、置信度、每个像素取自哪个候选、逐帧逐候选的得分曲线；结果的图层名按用了哪些模型和什么目标自动生成，许可取候选里最严格的那个。"
