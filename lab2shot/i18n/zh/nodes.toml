description = "图像，或深度贴图、位置图、遮罩等数据图 → 图像序列，每帧一个文件，帧号不变（数据图原样写 EXR，不做颜色转换、不受这里的格式设置影响）。写 EXR 时「图层」填什么，通道就按那个图层的约定命名：填 motion 写成 Nuke 标准的 forward.u/v、backward.u/v（VectorBlur、IDistort 拿来就能用；不是 NukeX 的 SmartVector——它的文件格式没有公开，只有 NukeX 的 SmartVector 节点写得出，VectorDistort 只认它），填 depth 写成 depth.Z，留空就是我们自己的 R G B A；单条通道接 R、G、B、A 四个口：接到哪个口就写成哪条通道，没接的口就没有那条通道（抠像的 alpha 接 A，写出来的 EXR 就只有 A；「图像」和它们一起接时「图像」当底子，单独接的盖掉那一条）。它只定名字和格式，接到「输出」上才真正写出文件。几样结果写进同一个 EXR 用「多层 EXR 输出」。"

