description = "深度贴图 + 摄影机 → 每个像素的表面法线（法线贴图）。任何深度贴图节点都能接，要手动缩放的深度贴图也行（法线和尺度无关）；没有法线输出的深度贴图方法、对齐过的深度贴图，都用它补上法线。法线在摄影机空间和世界空间之间换算用「法线空间转换」。"

[node.normal_space]
subtitle = "法线空间转换"
description = "法线贴图 + 摄影机 → 换到另一个空间的法线贴图，按摄影机每一帧的朝向。任何法线贴图都能接（MoGe、Sapiens2、Cosmos DiffusionRenderer、「深度转法线」）；世界空间法线在 Nuke 里按固定的灯光方向重新打光，镜头怎么动都对。"

[node.normal_space.param.space]
label = "转到"

[node."nuke.output"]
subtitle = "Nuke 摄影机输出"
description = "摄影机 → Nuke 的 Camera3 节点（.nk 文本）：每帧的位置、朝向、焦距和胶片背写成动画曲线，单位是厘米、Y 轴向上，和 Nuke 的摄影机一致。节点上「复制到 Nuke」复制这段文字，在合成里粘贴，或在 Nuke 里 File → Import Script；Camera3 是针孔摄影机，镜头畸变留在数据里，合成时用ST 贴图加回去。要把摄影机接进别的三维软件，用三维场景的格式输出节点（「USD 输出」「FBX 输出」「Alembic 输出」）。"

[node.occlusion_from_motion]
subtitle = "遮挡遮罩"
description = "运动向量 → 两张遮罩：「遮挡」是这一帧里下一帧会被挡住或出画的像素，「新露出」是上一帧看不到、这一帧才露出来的像素。做的是前后一致性检查，任何运动向量都能接；推帧、传播贴图时这些地方没法从邻帧取，要手动补。"

[node.occlusion_from_motion.port.occluded]
label = "遮挡"

[node.occlusion_from_motion.port.revealed]
label = "新露出"

[node.orientation_field]
subtitle = "方向场"
description = "一张图 → 每个像素上纹理顺着哪个方向走，以及这个判断有多可信（两条通道：角度、可信度）。一组不同角度的 Gabor 滤波器扫过画面，哪个角度响应最强就是那个方向。头发、毛皮、布纹、刷痕这类细长纹理都适用；解算发丝的项目拿它当输入。方向不分正负（朝左上和朝右下是同一个方向），所以角度只在 0–180° 里，比较大小不能相减。每个角度用的是正交对（同一个核的偶相位和奇相位各一份，取能量），这是 Gabor 能量的标准定义。发丝解算类项目里常见的实现只用偶相位那一份核（上游的例子：HairGS 仓库 utils/vision.py；那个项目我们没有接），响应会随条纹相位周期性过零，过零处取最大值等于掷骰子。在 USC-HairSalon 真值上逐像素量过：正交对平均角误差 10.19°、中位 4.13°，只用偶核是 14.46°／6.54°，所以这里用正交对；和上游的数字对不上时，差别出在这里。"

[node.orientation_field.param.period]
label = "纹理周期"

[node.orientation_field.param.reach]
label = "取样范围"

[node.orientation_field.param.angles]
label = "角度数"

