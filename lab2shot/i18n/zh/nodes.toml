[family.lens_calibration.focal]
help = "焦距（mm）。上游给的是焦距（px）（用「一个感光点有多宽」当尺子量出来的长度），这里换成毫米交出去。换算用的是节点上的「胶片背」：焦距（mm）= 焦距（px）÷ 图像宽度 × 胶片背。"

[family.lens_calibration.filmback]
help = "节点上填的「胶片背」原样交出去：焦距是按它换算成毫米的，下游（lens_distortion、camera）接这一根就不用再填一遍，两边永远是同一个数"

[family.lens_calibration.lens]
help = "这颗镜头除了焦距、胶片背之外的全部：镜头模型的名字、它的畸变系数、主点 X / Y（毫米）和像素比，打成一份。接 lens_distortion 的「镜头内参」：那边的镜头模型和系数就跟着这里走"

[family.matte.foreground]
help = "去掉背景颜色之后的前景色（预乘 alpha 的 RGBA）：头发丝、半透明边缘上原来混进来的背景色和绿幕溢色，模型解混时已经去掉。在 Nuke 里拿它当前景合成，边上不再带着旧背景的颜色；只用原图乘 alpha 是做不到的。接 image.output 写成 EXR"

[family.humans.plate_camera]
help = "放人用的那台摄影机：原点、不动的针孔摄影机，焦距 = 节点的「焦距」（留空时用解算器自己估的或默认的），主点在图像中心。不是解出来的摄影机：人就放在它的空间里，透过它看图像平面，人和图像对得上。当「解算器的摄影机」用，或接 camera_space 的目标"

