[node.ensemble_camera]
subtitle = "摄影机集成"
description = "把几个解算器对同一段素材求出的摄影机合成一台。候选要先用「摄影机空间转换」搬进同一台基准摄影机的世界。裁判是这段素材自己的「跟踪点」（例如 CoTracker 整段撒点）：每条跟踪点用一半的帧在候选摄影机下三角化，投影到另一半的帧里量误差（像素），和任何候选都无关；整段误差超过最好候选 2 倍的候选不用。「目标」：稳健＝整段用跟踪点最贴合的那台；准确＝每 30 帧一段挑跟踪点最贴合的候选，换候选的地方前后各 5 帧交叉过渡；平滑＝每帧取所用候选的朝向中位数和位置几何中位数。没接跟踪点时没有裁判，三个目标都按各候选的中位数合成。每帧的镜头取自位姿来自的那台候选（换算到第一个候选的片门）。输出合成的摄影机、逐帧置信度、逐帧取自哪个候选、逐帧逐候选的重投影误差曲线；结果按用了哪些解算器和什么目标自动命名，许可取候选里最严格的那个。实测（ViPE、COLMAP 两家候选，11 条有真值的素材，留出 5 条）：三个目标都没过验收（稳健的留出中位数比 COLMAP 差 30%），没有卡片用它。"
