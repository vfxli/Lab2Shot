[node.stmap]
subtitle = "STMap"
description = "和 Nuke 的 STMap 是同一个节点：源图 + ST 贴图 → 按ST 贴图重新取样的结果，每个输出像素去源图里ST 贴图指的位置取值。接 AnyCalib 的去畸变ST 贴图就是去畸变，接加畸变ST 贴图就是加畸变（CG 渲染贴回实拍）；源图只有一帧（在参考帧上画的修补、贴图）而ST 贴图是逐帧的（AllTracker、「运动向量转ST 贴图」）时，把这张图贴到每一帧上。图像、深度贴图、法线贴图、遮罩、分割图都能变形，出来还是原来的类型。它不认识镜头，也不给结果贴任何标记（和 Nuke 的 STMap 一样）：要连画布和扩边一起算的去畸变、加畸变，用「LensDistortion」烘出ST 贴图再接进来。"

[node.stmap.port.image]
label = "结果"

[node.stmap_from_motion]
subtitle = "运动向量转ST 贴图"
description = "运动向量 → 每一帧回到参考帧的ST 贴图，把逐帧的矢量一帧接一帧串起来（和 Nuke 的 SmartVector 传播一个思路）。在参考帧上画一次（修补、纹身、贴图），用「STMap」贴到整段镜头；「有效区域」是一路都追得回参考帧的像素（被挡过、出过画的是 0）。串得越长误差越大：要几百帧不漂，用「AllTracker 跟踪贴片」一步给出的ST 贴图。"

[node.switch]
subtitle = "切换"
description = "和 Nuke、Houdini 的 Switch 是同一个节点：按「走哪一路」只走一路：不接线按它的值（1 = 第一路，2 = 第二路……），它的输入口接了线就按线：布尔开走第一路、关走第二路，整数按第几路。刚放下时有两路，要更多就点输入口末尾的「＋」或者把线拖到「＋」上，最多十路；每一路的名字在节点上双击可改，参数面板「各路」表里可以去掉、拖动排序（第几路按表里的顺序数）。「走哪一路」超出现有的路数，算之前就会指出来。没走的那一路整条不算，既不报错也不算跳过。各路要接同一种数据。做模板时想让用的人按名字选哪一路：把「走哪一路」公开，在参数面板「编辑界面…」里把它显示成下拉，每一项自己填值和名字（例如 1 = 用解算摄影机、2 = 用自己的摄影机）；几个切换要共用一个选择时，用一个「整数」节点接到它们各自的「走哪一路」。"
