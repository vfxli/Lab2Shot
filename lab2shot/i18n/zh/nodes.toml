[node.ensemble_segment]
subtitle = "物体分割集成"
description = "把几个模型对同一个物体的分割合成一张硬边遮罩。候选可以是遮罩（例如 SAM 3 点选的遮罩）、物体编号图（例如 VidEoMT 全景分割：取「对象」首帧盖住的那几个物体）或抠像 Alpha（按软值投票）。先做对象检查：画出的对象和「对象」多一块或少一块的候选整段不用；用同一份引导的候选（SAM 3 遮罩和用它的 MatAnyone 2；BiRefNet 和用它粗遮罩的 VideoMaMa）只算一票，几票对哪个是对象有分歧时按多数定，输掉的这一帧不用。「目标」：准确＝逐像素多数票；稳定＝多数票加滞回（上一帧是前景的像素，票数掉到 30% 以下才变背景，帧间少闪）；按可靠度＝STAPLE，按每票估出的可靠度加权（至少三票，不够时按多数票）。实测（12 条带真值素材，留出 6 条）：三个目标都未过验收（IoU 中位数约 0.988，与最好的单模型 0.990–0.992 持平），不放进卡片。输出合成后的遮罩、置信度（同意结果的候选比例）、每个像素最接近哪个候选、逐帧各候选和结果的 IoU；图层名自动生成，许可取候选里最严格的那个。"
