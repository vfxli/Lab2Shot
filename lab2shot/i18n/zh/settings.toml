[setting."register.open"]
label = "开放注册"
note = "开了，登录页上就有「注册」：来的人自己填用户名、名字、环节和密码建账号，建好直接登录，和在「用户」里建的账号一模一样、一起管。关着时只有管理员能建账号，注册的接口也不收。马上生效。"

[setting."register.invite"]
label = "邀请码验证"
note = "开着时注册要填一个能用的邀请码（在这一页下面的邀请码列表里建，可以限次数、限到期、随时停用）；关了谁都能直接注册，只受下面的注册上限和按 IP 的限制。马上生效。"

[setting."register.days"]
label = "注册账号有效期"
note = "自己注册的账号从注册起能用多少天，到期就登录不了；以后可以在「用户」里延期，和别的账号一样。改了只管以后注册的。"

[setting."register.quota_gb"]
label = "注册账号配额"
note = "自己注册的账号能用多少硬盘（任务的文件夹、计算缓存、还没有任务用到的上传，加上存在服务器上的模板），注册时写进这个账号自己的配额，以后在「用户」里按账号改。改了只管以后注册的。"

[setting."register.tags"]
label = "注册可用模型类别"
note = "自己注册的账号能用哪些类别的节点和模板，和「用户」里新建账号时的「可用」是同一套；基础节点人人都能用。改了只管以后注册的。"
empty = "只有基础节点"

[setting."register.per_hour"]
label = "每小时注册上限"
note = "全站所有人加起来，一小时里最多注册这么多个账号；到了就自动暂停注册，「概览」里写着，日志里记一笔，过了这一小时自己恢复。对方换多少 IP 都绕不过去。马上生效。"

[setting."register.per_day"]
label = "每天注册上限"
note = "全站所有人加起来，24 小时里最多注册这么多个账号；到了就自动暂停注册，和每小时的上限一样。马上生效。"

[setting."people.departments"]
label = "环节"
note = "每个账号属于哪个制作环节，一条一个（名字里不能有空格和逗号）：管理页面「用户」里给每个账号选一个，自己注册的人在注册页上从这张表里选，使用统计按它分环节。加一个新环节就添加一条；账号的环节不在这张表里时，统计照旧按原名列出（标「已不在列表」）。马上生效。"

[setting."storage.quota_gb"]
label = "账号配额"
note = "没单独设过配额的账号能用多少硬盘：它在服务器上实际占的全部字节——所有任务的文件夹（上传的素材、输出的文件夹和 zip）、它自己的计算缓存、还没有任务用到的上传，加上存在服务器上的模板；同一份字节只算一次。满了就不收新上传、不能提交新任务（正在算的照常算完），页面上写明占了多少、上限多少、主要占在哪；删掉不要的任务就腾出来。单个账号的配额在「用户」里按账号改，改了马上生效。"

[setting."feedback.reward_count"]
label = "每几条有效反馈"
note = "「用户反馈」里每有这么多条反馈被评为「有效」，就给提交的账号加一次使用时间（加多少是下面一项）。改了只管以后的奖励：已经加过的不变，还没凑满的按新条数接着算。"

[setting."feedback.reward_days"]
label = "加几天使用时间"
note = "凑满上面的条数就把账号的到期时间往后推这么多天，已经过期的从评定那一刻算起；0 表示不奖励。永不过期的账号不加，只记一笔。改了只管以后的奖励，已经加过的不变；评定改回无效时按当时加的天数扣回。"

[setting."plugins.download"]
label = "开放 DCC 插件下载"
note = "开：所有登录的用户都能在顶栏「DCC 插件」里下载插件。关：只有管理员和二级管理员看得到、下载得到（内部测试用，对话框里标着「未对用户开放」），普通用户看不到这个入口，直接请求下载也会被拒。只管下载，已经装好的插件照常连接服务器。马上生效；用户的页面重新载入后入口才出现或消失。"

[setting."queue.compute_jobs"]
label = "计算任务"
note = "关：服务器不再接受新的计算任务，提交都会被拒绝，说明现在只能查看；还没开始的等重新打开，已经开始的算完为止。看已经算好的结果不受影响，永远能用。服务器要整个暂停接任务时关掉。马上生效。"

[setting."queue.gpu_jobs"]
label = "显卡任务"
note = "关：所有显卡都不再接新任务，跟一张都没授权一样；正在算的任务算完为止，排队的等这个开关重新打开后自动接着算。不用显卡的任务和看已经算好的结果不受影响。显卡要检修、机器要给训练腾出来时关掉。马上生效。"

[setting."queue.node_minutes"]
label = "单节点超时"
note = "一个节点最多算多久：超过就停下，按出错处理（节点标红，用到它的节点跳过，别的分支照常算完，任务显示「部分失败」）。扩展的节点（跑在计算进程里）直接结束它的进程；核心节点每算完一帧看一次，在下一帧停下。常有单个节点就要算很久的长镜头时调长。马上生效。"

[setting."queue.task_gpus"]
label = "单任务最多占卡数"
note = "一个任务同时最多用几张显卡：任务里互不依赖的显卡节点可以同时在几张卡上算，一张卡同时只算一个节点。显卡只在节点算的时候占着，算完马上给排在最前面、有节点在等显卡的任务。马上生效。"

[setting."queue.task_cpus"]
label = "单任务 CPU 节点上限"
note = "一个任务同时最多算几个不用显卡的节点（每个节点自己会用好几个核）。防止一个任务接了一堆并行的节点把机器占满。马上生效。"

[setting."queue.cpu_nodes"]
label = "全局 CPU 节点上限"
note = "整台机器同时最多算几个不用显卡的节点，所有任务加起来。数的是节点，不是核：每个节点自己用好几个核（逐帧的节点同时算最多 8 帧），所以默认按核数 ÷ 8 算。空出来的名额按排队顺序给第一个有节点在等、又没超过自己上限的任务；查看器的预览只在没有节点在等时才用空着的名额，从不耽误节点。机器上同时有训练或渲染、电脑变卡时调小。马上生效。"

[setting."queue.max_frames"]
label = "帧数上限"
note = "一次提交的计算最多算多少帧，超过的服务器直接拒绝并说清楚（网页在提交前就拦下，这里挡绕过网页直接提交的）。防止一个长镜头把显卡和流量占满。只看这一次算的帧范围，和素材本身有多少帧无关：素材 1000 帧、只算其中 200 帧照样能提交。人少、镜头长时调大；机器要留给别的事时调小。马上生效。"

[setting."queue.reserved_cores"]
label = "保留核心数"
note = "算任务永远不许用的核数：留给浏览器、DCC、别的程序。计算进程只在剩下的核上跑（绑核 + 降优先级），自己带线程参数的项目（COLMAP）也按剩下的核数传。服务器和浏览器常常在同一台机器上：实际情况：一个 COLMAP 任务把 32 个核全吃满 207 秒，整个浏览器连别的标签页一起卡死，任务结束才恢复。默认按这台机器的核数算：核数 ÷ 4、至少 2。机器是专用服务器、没人在上面干别的时调到 0（算得最快）；一边算一边要用这台机器时调大。马上生效。"

[setting."queue.vram_margin_gb"]
label = "显存余量"
note = "挑卡时在节点声明的显存之外再留这么多：节点声明的是模型本身的峰值，新开的计算进程还要一份 CUDA 环境（实测 4090 约 0.4 GB、5090 约 0.7 GB）。任务老是刚开始就显存不够时调大；显存紧、想让大任务挤得进去时调小，但调到 0.5 以下很容易失败。马上生效。"

[setting."queue.gpu_order"]
label = "显卡优先顺序"
note = "几张空着的显卡都能计算某个节点时，按此顺序优先选用。填写 CUDA 编号，以逗号分隔，例如 1,0；编号按 PCI 总线顺序，与「显卡」页及 nvidia-smi 显示的编号一致。未列出的显卡排在其后，按原规则（够用的显卡中显存最小的优先）。仅在几张空着的显卡都放得下节点时起作用：放不下的显卡不会因此被选用，也不改变排队的先后。把显存大的显卡排在前面时，小节点也会优先占用它，只能在大显卡上计算的节点可能因此多等。立即生效。"
empty = "够用的显卡中显存最小的优先"

[setting."resident.keep"]
label = "常驻模型"
note = "开：任务算完后模型留在它的进程里，下一个用同样模型的任务不用重新加载，大模型省下一分钟以上。关：每个任务算完就结束进程，显存和内存马上还给别的程序，适合机器上同时有训练或渲染。关掉时已经常驻的模型立刻卸载。"

[setting."resident.idle_minutes"]
label = "空闲卸载"
note = "常驻的模型这么久没被用到就完全卸载，显存和内存都释放。长一些：隔一阵再算同一个项目也不用重新加载；短一些：显存和内存早点还给别的程序。"

[setting."resident.ram_idle_minutes"]
label = "内存中空闲卸载"
note = "模型给别的项目让路移到内存后，这么久没被用到就结束它的进程：移到内存的进程仍在显卡上占一份 CUDA 环境，内存里也占一份模型。比「空闲卸载」短，显存和内存早点还回去。"

[setting."resident.release_below_gb"]
label = "让出显存线"
note = "一张没在计算的显卡上，谁都没在用的显存少于这么多时（别的程序、另一个 Lab2Shot 服务的任务占着也算），空闲的常驻模型马上让出：先移到内存（「让路移到内存」开着时），还不够就结束进程。填 0 不按显存压力让出，只等「空闲卸载」。"

[setting."resident.per_gpu"]
label = "每卡常驻数"
note = "一张显卡上最多留几个空闲的常驻进程，正在计算的那个不算；再多的，最久没用的先卸载。每个进程在显卡上占约 0.5 GB 的 CUDA 环境，模型移到内存里时也一样。几个项目轮流用时调大，显存紧张时调小。"

[setting."resident.to_ram"]
label = "让路移到内存"
note = "别的项目要用这张显卡时，常驻的模型怎么让出显存。开：移到内存（移完机器还剩「保留内存」那么多时），下次用时几秒就移回显卡；关：直接卸载，下次用时重新加载，内存全留给别的程序。"

[setting."resident.ram_pct"]
label = "常驻内存上限"
note = "空闲的常驻进程合起来最多占机器内存的这个比例（移到内存的模型和进程自己留着的内存都算）；超了，最久没用的先卸载。机器剩下的内存少于「保留内存」时也一样先卸载最久没用的。几个人同时用、内存紧张时调小。马上生效。"

[setting."memory.keep_free_gb"]
label = "保留内存"
note = "机器至少留这么多内存给别的程序：任务等空出这么多才开始（节点声明要更多的按节点的），常驻模型也只在移过去之后还剩这么多时才移到内存。机器上同时有训练、渲染时调大，防止内存耗尽整台机器死机。"

[setting."memory.reuse"]
label = "内存复用"
note = "开：服务进程算完一帧用过的内存先不还给系统，留着给下一帧直接用，逐帧处理整幅画面的节点（图像合成、预乘……）快约 20% 到 30%，结果完全一样；代价是服务进程一直多占最多约「复用内存上限」那么多暂时没在用的内存。关：用完马上还给系统，内存紧张、机器上同时有训练或渲染时关掉。只管服务进程自己，扩展的计算进程不受影响。"
restart = "内存的分配方式在服务启动时定下，运行中改不回系统原来的方式"

[setting."memory.reuse_gb"]
label = "复用内存上限"
note = "「内存复用」开着时，服务进程最多留约这么多用过、暂时没在用的内存给下一帧。1080p 的素材 2 GB 就够；常算 4K 等大画面时调大，内存紧张时调小（调小马上把多留的还给系统）。马上生效。"

[setting."tasks.keep_days"]
label = "任务保留天数"
note = "每个任务（点「计算」提交的一次计算）从结束时起在服务器上留这么多天，到期整个清理：它的文件夹（节点图、素材、输出的文件夹和 zip、日志）一起删掉，只被它用到的缓存随后也清掉。选了文件、还没被任何任务用到的素材，过了这么多天也清掉。用户常隔几天才取结果就调大，硬盘紧张就调小。马上生效。"

[setting."tasks.upload_gb"]
label = "单任务上传上限"
note = "一个任务最多带多少上传的素材（只算上传的素材，不算算出来的结果），超了服务器直接拒绝提交并说清楚；一个文件本身比这还大时上传就不收。防止一个任务传上来的东西把硬盘撑爆；常要传很大的视频或 EXR 就调大。马上生效。"

[setting."storage.pause_free_pct"]
label = "暂停新计算的剩余空间"
note = "数据位置所在的硬盘剩下的空间少于这个比例时，所有账号暂停新计算：新提交和新上传都不收（说明原因），排队还没开始的先等着，正在算的照常算完；腾出空间回到这个比例以上自动恢复。上传另外至少给硬盘留 10 GB。马上生效。"

[setting."tasks.keep_most"]
label = "每账号保留的已完成任务"
note = "每个账号最多留这么多条已经结束的任务，只为保护数据库：超过时最旧的自动删除（和用户自己删除一样，连同它占的空间），日志里记一笔，用户的队列窗口里写着这条上限。空间由账号配额管，不靠这条。马上生效。"

[setting."paths.data_dir"]
label = "数据位置"
note = "用户的数据放哪：每个任务的文件夹、上传的素材、算好的缓存都在这里，生产里指向数据盘。放在一处，任务之间复用素材用的硬链接才都在同一个文件系统上。相对路径从项目文件夹算起；空：工作文件夹里的 data。换了以后原来的数据留在旧位置，要一起搬过去，不搬的任务和素材就不在了。"
restart = "数据在哪个盘上，服务启动时定下"
empty = "工作文件夹里的 data"

[setting."paths.work_dir"]
label = "工作文件夹"
note = "缓存、上传的素材、待取回的结果、任务记录、显卡授权和日志都在这里；相对路径从项目文件夹算起。只能在 config/local.toml 里改：换了以后原来的这些都留在旧文件夹，要一起搬过去。"
restart = "缓存、任务记录、显卡授权都在这个文件夹里，服务启动时定下"

[setting."database.backups"]
label = "数据库备份份数"
note = "数据库（账号、任务记录、使用统计……）自动备份留几份：每天一份（手动备份也算在里面），最旧的先删。每次升级数据库、更新程序之前的那一份另外留最近 5 份，不会被每天的挤掉。备份在 work/db/backups/，很小；留多一些，出错时能退回更早的样子。马上生效。"

[setting."logs.max_mb"]
label = "日志大小"
note = "服务日志 work/logs/lab2shot.log 长到这么大就换一个新文件，旧的改名留着。"

[setting."logs.files"]
label = "旧日志份数"
note = "留几份换下来的旧日志，更早的删掉；日志一共最多占「日志大小」×（份数 + 1）。要查更早的问题就调大。"

[setting."logs.debug"]
label = "详细日志"
note = "开：日志里另外记下 worker 进程空闲时打印的内容等更细的过程，查问题时用；平时关着，日志小，好读。"

[setting."view.proxy_px"]
label = "视图代理尺寸"
note = "二维那一半：视图里看到的每一帧有多大。解算算完就把结果等比缩到长边这么多像素、压好存起来，网页只拿这一份。512 最省流量，公网上播放最顺；线路好就调到 1024 或 2048，看得更清楚。比这一档还小的画面不放大。三维那一半看下面的「点云上限」。交付写出去的文件永远是原尺寸、原精度、无损，不受它影响；想看无损的就下载交付到 Nuke 或 DCC 里看。改了马上生效，下次看图就是新的这一档。"

[setting."view.local_px"]
label = "本机代理尺寸"
note = "用户自己机器上的素材（读取图像序列选的、交付写回的）在视图里有多大：浏览器后台把每一帧每一层等比缩到长边这么多像素、压好存在用户自己的硬盘上，视图从这份画，不上传、不经过服务器。比服务器代理清楚，比 Nuke 里无损看要糊一点。改了马上生效，下次看图重新生成。"

[setting."view.local_cache_gb"]
label = "本机缓存上限"
note = "浏览器私有文件系统里本机代理最多占用户硬盘多少。满了按最久没看的淘汰。三维整段缓存（点云等逐帧数据的块）也算在这份额度里。这是硬盘，和浏览器内存无关；内存里只装用户显示过的那几层。"

[setting."view.points_max_mb"]
label = "点云上限"
note = "三维那一半：一片点云一帧最多传这么大。超过就每 N 个点取一个，视图里一直写着「显示了 N / 共 M 点」，一眼看得出删了多少。删的只是看的那一份：留下的点坐标一个位都不改，计算、缓存和交付出去的文件一个点都不少。不到这个数的点云一个点不少地发。5 最省流量，公网上拖时间条最顺；线路好就调大，点更密。改了马上生效。二维那一半看上面的「视图代理尺寸」。"

[setting."view.gaussian_max"]
label = "高斯显示上限"
note = "三维那一半：一片 3D 高斯一帧最多显示多少个。超过就每 N 个取一个，视图里和点云一起写着「显示了 N / 共 M 点」，一眼看得出删了多少。删的只是看的那一份：留下的坐标一个位都不改，计算、缓存和交付出去的文件一个都不少。不到这个数的高斯一个不少地显示。30 万在一般机器上转视角顺；机器快就调大，机器慢就调小。改了马上生效。"

[setting."server.host"]
label = "访问范围"
note = "只有本机：只有这台机器上的浏览器和程序能连。局域网：局域网里别的电脑的浏览器、DCC 插件都能连；WSL2 要开镜像网络才分得清各台机器。每个人都要用账号登录（管理页面「用户」里新建）。"
restart = "服务只在启动时打开监听的网络接口"
[setting."server.host".option]
"127.0.0.1" = "只有本机"
"0.0.0.0" = "局域网"

[setting."server.port"]
label = "端口"
note = "网页和 DCC 插件连接的端口：地址是 http(s)://服务器:端口。改了以后所有人的书签、DCC 插件和命令行的 --server 都要换成新地址。"
restart = "端口只在服务启动时打开"

[setting."server.https"]
label = "HTTPS"
note = "用这台服务器自己的证书走 HTTPS。局域网里别的电脑的浏览器要把结果直接存进用户的文件夹、把节点图存回原文件，必须是 HTTPS，用 http 时保存都变成下载。每台用户电脑装一次证书：浏览器打开 /api/tls/ca.pem。用内网穿透分享时，最好让穿透工具在外面那一头用正式证书加密，这里就不用开。"
restart = "证书只在服务启动时装上"

[setting."server.names"]
label = "对外域名"
note = "别人访问用的域名或 IP，用空格隔开，比如内网穿透给的 abc.example.com、内网 DNS 给这台机器起的别名。服务器只回答用这台机器的名字、IP 地址或这里写了的域名打开的请求（别的网站把自己的域名指到这里的「DNS 重绑定」就进不来）；经「可信代理」转发来的请求由代理按域名分发，不看这一项。开了 HTTPS、穿透工具只转发端口不管加密时，证书也要写上这个名字，浏览器才认。空：只认这台机器自己的名字和地址。"
restart = "证书只在服务启动时做（认不认这个域名马上生效）"
empty = "只用本机的名字和地址"

[setting."server.trusted_proxies"]
label = "可信代理"
note = "在这台服务器前面、替用户转发请求的反向代理的地址，用空格隔开，可以写网段，如 127.0.0.1 或 10.0.0.0/8。只有从这些地址连来的请求，才按它在 X-Forwarded-For / X-Real-IP 里转告的地址算用户的 IP：注册按 IP 和网段的限制、输错邀请码和密码按来源的计数、登录记录里的 IP 都按它；它转告的 X-Forwarded-Proto（是不是 HTTPS）和 X-Forwarded-Host（用户打开的域名）也只从这些地址认。别的来源发来的这些头一律不看（谁都能随便写）。\n两种接法：① 云服务器上的 nginx / Caddy / frp https2http 用正式证书解开 HTTPS，再用 HTTP 转发到这里（这里的 HTTPS 关掉）：把转发过来的那个地址填在这里（frpc 在本机就填 127.0.0.1），就看得到每个用户的真实 IP。② frp 只转发 TCP 连接到这里自己的 HTTPS 端口：这里看到的来源全是本机地址，没有头可读，这一项留空；按 IP 的限制这时自动不算（不然会把所有人当成一个人一起挡住），全站注册上限、邀请码和工作量证明照常；这时每个请求在这里看都像是从本机来的：本机命令行的机器令牌照样要令牌本身才认，不靠地址，但没登录的请求（登录页、注册页）只能共用一个请求频率，一个人发得多，别人也会被说「太频繁」。对外公开注册时请用第 ① 种（HTTPS 在云服务器上解开）：只有它看得到每个人的真实 IP，按 IP 的限制才起作用。现在是哪一种，看这一组下面的「用户的 IP」。马上生效。"
empty = "不信任何代理：一律按连接的地址算"

[setting."install.mirror_hf"]
label = "HF 镜像"
note = "Hugging Face 连不上时按顺序试的镜像网址，用空格隔开。只有带 sha256 的模型文件才会从镜像下载，下载完和官方的 sha256 对上才用，对不上就删掉换下一个来源。登录令牌从不发给镜像。"
empty = "只用 Hugging Face 官方"

[setting."install.mirror_pypi"]
label = "PyPI 镜像"
note = "Python 包的官方源连不上时试的镜像（包索引网址），用空格隔开。只对带哈希锁文件（requirements.lock）的扩展包生效：每个包都要和锁里的官方哈希对上才装；没有锁文件的扩展包只从官方源装。"
empty = "只用 PyPI 官方"

[setting."install.mirror_github"]
label = "GitHub 镜像"
note = "GitHub 连不上时试的代理镜像，用空格隔开，官方网址接在镜像后面访问。代码按锁定的提交号取，拿到的提交号和锁定的不一样就不用；发布文件要和 sha256 对上才用。默认不设：请只填你信任的镜像。"
empty = "只用 GitHub 官方"

[setting."install.retries"]
label = "重试次数"
note = "安装扩展包时，下载、克隆代码、装包遇到网络问题（断开、超时、服务器忙）时每个来源最多试几次。每次之间等的时间翻倍（1、2、4、8 秒……），不超过「最长等待」。试完还不行就换下一个来源（镜像）。"

[setting."install.backoff_max"]
label = "最长等待"
note = "两次重试之间最多等多久。网络时断时续时调大一点，能少失败几次。"

[setting."build.archs"]
label = "编译目标架构"
note = "安装扩展包时，CUDA 代码（pytorch3d、DPVO、SAM 2 的 _C 等）为哪几代架构编译，一条一个：sm_75 Turing、sm_80 Ampere 数据中心、sm_86 Ampere、sm_89 Ada Lovelace、sm_90 Hopper、sm_100 Blackwell 数据中心、sm_120 Blackwell。编出来的代码只在这里列出的架构上能跑，和编译这台机器插的是什么卡无关；扩展包自己声明了只支持哪几代时，只编两边都有的。CUDA 工具包要支持所选的每一代（sm_120 要 CUDA 12.8 以上；「检查编译工具」会逐个核对）。改了以后新装的扩展包按新的来；已经装好的不会自动重编，要重装才按新的架构编译。"

[setting."build.cuda_home"]
label = "CUDA 路径"
note = "安装扩展包时编译 CUDA 代码（detectron2 等）用的 CUDA 工具包文件夹，如 /usr/local/cuda-12.8。空：用 $CUDA_HOME，没有就用 /usr/local/cuda。下次安装扩展包时生效。"
empty = "用 $CUDA_HOME"

[setting."build.cc"]
label = "C 编译器"
note = "安装扩展包时用的 C 编译器，如 gcc-14。CUDA 对 gcc 的版本有上限，系统默认的 gcc 太新时在这里指定旧一点的。空：系统默认。下次安装扩展包时生效。"
empty = "系统默认"

[setting."build.cxx"]
label = "C++ 编译器"
note = "安装扩展包时用的 C++ 编译器，如 g++-14，和 C 编译器同一个版本。空：系统默认。下次安装扩展包时生效。"
empty = "系统默认"

[setting."color.config"]
label = "OCIO 配置"
note = "服务器上 OCIO 配置文件 config.ocio 的路径，或 ocio:// 开头的 OCIO 内置配置。空：用环境变量 $OCIO，没有就用 OCIO 内置的最新 ACES studio 配置。换配置会改变读图时默认的颜色空间。"
restart = "颜色配置在服务启动时读入，网页里的颜色空间列表也跟着它"
empty = "用 $OCIO 或内置 ACES"

