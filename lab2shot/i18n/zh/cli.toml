# 命令行（lab2shot ...）的界面字：帮助、选项、运维命令（check、setup）的输出。键 cli.<命令>.<…>。
[cli.app]
help = "Lab2Shot：将论文算法转化为 CG 制作可用的工具。"

[cli.option]
version = "显示版本号"
lang = "界面语言：zh 或 en（默认：环境变量 LAB2SHOT_LANG，其次 LC_ALL / LANG 指明的语言；未指明、C 或 POSIX 时为中文）"

[cli.check]
summary.other = "{problems} 个问题，用时 {seconds:.1f} 秒"
unknown = "不存在此检查项：{name}（可选项：{names}）"
failed_to_run = "{name}：检查未能完成：{error}"
only = "仅运行指定的一项：{names}"

[cli.check.i18n]
english = "{where} 在网页标记里写死了英文「{text}」：显示的文字要进语言目录（t(\"ui.…\")）"
unknown = "{where} 用到的词 {key} 语言目录里没有：显示到它时会出错"
catalogues.other = "i18n：{langs} 两种语言的目录读得出（{words} 个词、{messages} 条消息）"
extra = "i18n：{language} 目录里有中文目录没有的键 {key}（{where}）"
placeholders = "i18n：{key} 的占位符中英不一致：中文 {zh}，英文 {en}"
app_placeholders = "i18n：{key}（应用模式的说法）用了 {base} 没有的占位符：调用处只给 {base} 的"
reserved = "i18n：{key}（{language}）有个占位符叫 {name}，和 t() 自己的参数同名，会被当成语言或作用域吃掉：换个名字"
eager = "i18n：{where} 的消息参数 {name} 是当下语言说定的字（t / pick / node_text / lookup，或用副标题指节点）：换成 i18n.Word，指节点用 node_ref（节点名（类型名））"
unused = "i18n：键 {key} 没有任何代码用到（{where}）"
over = "i18n：{area} 区的{what}有 {now} 处，超过基线 {most}（只许减不许增；见 lab2shot/i18n/baseline.toml）"
under = "i18n：{area} 区的{what}降到 {now} 处（基线 {most}）：运行 uv run python tools/i18n_baseline.py 收紧基线"
counted = "i18n：代码里的中文字面量 {cjk} 处、英文缺键 {missing} 个、模板单语言显示字段 {fields} 处，均未超过基线"
cjk = "中文字面量"
missing = "英文缺键"
fields = "模板单语言显示字段"
lacking = "i18n：{language} 目录缺中文目录里有的键 {key}（{where}）"
plural_zh_one = "i18n：{key}：中文只写复数形 .other，不写 .one（{where}）"
plural_pair = "i18n：{key}（{language}）：随数量变的句子英文要写 .one 和 .other 两形，中文写 .other（{where}）"
plural_twice = "i18n：{key}（{language}）既写成单一句子又写了复数形（{where}）"
plural_one_names = "i18n：{key}.one 用到了 .other 没有的占位符（{where}）"
plural_needed = "i18n：{key}（{language}）「{said}」跟在数量后面，1 时读不通：拆成复数形 .one / .other（{where}）"

[cli.menu]
number = "编号"
name = "名称"
description = "说明"
pick = "请输入编号"

# lab2shot login | logout 与 lab2shot admin（cli/accounts.py）。
[cli.accounts.option]
server = "Lab2Shot 服务地址"
server_example = "Lab2Shot 服务地址，例如 http://render-box:8765"

[cli.accounts.login]
help = "以账号登录一台 Lab2Shot 服务：此后本机的 lab2shot cook --server 和 DCC 插件均使用该账号（令牌保存在 ~/.lab2shot/tokens.json，仅当前用户可读）。"
username = "用户名（由管理员在「用户」中创建）；省略时提示输入"
prompt_username = "用户名"
prompt_password = "密码"
no_department = "未分环节"
done = "[green]已登录[/green]：{name}（{username} · {department}），令牌已保存至 {file}"

[cli.accounts.logout]
help = "退出一台 Lab2Shot 服务的登录：令牌作废，并从本机删除。"
done = "已退出登录"

[cli.admin]
help = "管理员账号的密码与「我的口令」：仅可在本服务器上通过以下命令修改（服务运行期间亦可执行）。"
by_command_line = "命令行"
cancelled = "已取消，未删除任何内容"
yes = "删除前不再确认"

[cli.admin.secret]
new = "新{what}"
again = "再次输入新{what}"

[cli.admin.password]
help = "重设内置管理员账号的密码，用于忘记密码或因输错次数过多被锁定的情况。立即生效：管理员在所有网页上的登录须用新密码重新登录，此前的错误次数清零。"
what = "管理员密码"
done = "[green]管理员密码已修改[/green]：用户名 {username}，立即生效，此前的密码错误次数已清零。"

[cli.admin.passphrase]
help = "设置「我的口令」：仅可在本服务器上设置，网页上不可查看或修改。忘记管理员密码时，在登录页点击「忘记密码」，凭口令设置新密码。"
what = "口令"
set = "[green]口令已设置[/green]：忘记管理员密码时，可在登录页点击「忘记密码」，输入口令后设置新密码。系统仅保存口令的不可逆指纹，任何人均无法查看原文，请妥善保管。"
updated = "[green]口令已更新[/green]：忘记管理员密码时，可在登录页点击「忘记密码」，输入口令后设置新密码。系统仅保存口令的不可逆指纹，任何人均无法查看原文，请妥善保管。"

[cli.admin.status]
help = "显示管理员密码是否仍为默认值、口令是否已设置、账号数量（谁在线只有运行中的服务知道：看后台「用户」页）。"
no_password = "管理员    {username}，[yellow]尚未设置密码，无法登录：请执行 ./setup.sh 并选择「账号与安全 → 设置管理员密码」[/yellow]"
password = "管理员    {username}，密码于 {when} 由{by}修改"
no_passphrase = "我的口令  未设置：运行 lab2shot admin passphrase 进行设置"
passphrase = "我的口令  {when} 设置"
accounts = "账号      {count} 个（在「用户」中新建），谁在线看后台「用户」页"

[cli.admin.logout]
help = "使所有网页、DCC 插件和命令行退出登录（所有使用者须重新登录）。怀疑密码泄露时，应先修改密码，再执行此命令。"
done = "已使 {count} 个登录会话退出。"

[cli.admin.restart]
help = "重启本机正在运行的 lab2shot ui。协调重启应使用此命令，不应通过密码登录调用 /api/admin/restart，否则会使管理员浏览器中的登录失效。"
mode = "drain：等待计算中的任务完成，排队中的任务在重启后继续排队；now：立即停止计算中的任务"
