[cli.admin.unlock]
help = "将输错密码的计数清零：被陌生设备试错而拖慢的账号、被锁住的来源马上可以再试。仅能在本服务器上执行（机器令牌），浏览器上的管理员登录无法清零，因为计数挡的正是用密码猜。"
done = "[green]已清零[/green]：已清除 {count} 次输错密码的记录。"

[cli.admin.gpus]
