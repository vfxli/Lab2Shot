"E-WORKER-VRAMSHOT.other" = "显存不够：{frames} 帧、{people} 个人要一次放进显卡，这台机器放不下。这一步没有能调小的参数：把镜头剪短，或者在前面接「选人」少算几个人"
"E-WORKER-VRAMFRAME.other" = "显存不够：第 {frame} 帧有 {people} 个人要一起算，这台机器放不下。这一步没有能调小的参数：在前面接「选人」少算几个人，或者先剪掉这一段"
"I-WORKER-VRAMCARD" = "显存不够时这块显卡共 {total_gb:.0f} GB，清掉缓存后空闲 {free_gb:.1f} GB"
"W-WORKER-VRAMTESTSTEP" = "显存不够：「{label}」从 {size} 降到 {smaller} 重算（测试模式自动降档；正式使用时会停下来，由使用的人来选）"
"W-WORKER-VRAMBATCH.other" = "显存不够：一次送进显卡的帧数从 {size} 降到 {smaller} 重算（只是算得慢一些，结果不变）"

