"E-WORKER-VRAMSHORT" = "这张显卡现在只空着约 {free:.0f} GB，这一档要约 {need:.0f} GB：调度时显存是够的，之后被别的程序占去了。没有悄悄降档（降了结果就和缓存里记的档位对不上）；等显卡空一些再算"
"I-WORKER-ATFRAME" = "第 {frame} 帧"
"I-WORKER-ATFILE" = "{file}"
"E-WORKER-NOFRAMES" = "没有收到画面：接到「图像」的节点一帧也没有给出。先看上游节点的消息，确认它算出了帧"
"E-WORKER-JOBPATH" = "任务单 {path} 不是绝对路径：worker 只在任务文件夹里写文件，不猜当前文件夹。手动调试时写完整路径（worker.py /…/job.json）；由 Lab2Shot 发出的任务出现这条是程序的问题，请把日志发给开发者"
"E-WORKER-NOINSTALLPATH" = "worker 没有拿到扩展包的安装位置 {name}（现在是「{value}」，要绝对路径）：worker 要由 Lab2Shot 启动（它会给出原始仓库和权重的位置）；手动调试时先设好这个环境变量。由 Lab2Shot 启动还出现这条是程序的问题，请把日志发给开发者"
"E-WORKER-TOOFEWFRAMES.other" = "至少要 {least:d} 帧，这一段只有 {have:d} 帧：{why}。接一段更长的镜头再算"
"I-WORKER-WHYCOMPARE" = "要比较帧和帧之间的变化，一张图不行"
"I-WORKER-WHYTEMPORAL" = "它的时序网络一次要看这么长的一段动作，更短的段算不了"
"I-WORKER-WHYSTEP.other" = "参与解算的帧是按「隔帧」{step:d} 取样后剩下的，把「隔帧」调小也行"
