# 扩展包 worker 的公共部分（worker_sdk/lab2shot_worker）：各扩展包的 worker 共用的消息。
# 一行一条：编号 = 模板。写法：谁估的、和什么比、数字和单位、意味着什么、怎么办。
# 扩展包自己的消息在 adapters/<名字>/i18n/<语言>.toml。

# ---- 任务和参数（lab2shot_worker/__init__.py）
"E-WORKER-NOPARAM" = "节点没有发来参数 {name}：节点和它的 worker 对不上（worker 读的参数名要和节点定义一致）。这是扩展包代码的问题，请把日志发给开发者"
"E-WORKER-NODE" = "这个扩展包的 worker 不认识节点 {node}（它只有 {nodes}）：节点和它的 worker 对不上，这是扩展包代码的问题，请把日志发给开发者"
"E-WORKER-LISTING" = "读不了输入 {name} 的逐帧列表 {path}：{detail}"
