# Core nodes (lab2shot/nodes: core/*, families/*, base.py, formats.py, output.py, registry.py).
# One line per message: code = template. Say who estimated it, against what, the number and unit, what it means, what to do.
# Node types are named by their type name (retarget_prepare); parameters and ports in Title Case.

