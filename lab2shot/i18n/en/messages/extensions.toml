# Extensions (lab2shot/extensions), installing, manual downloads, the database (lab2shot/database), this machine's settings (lab2shot/config.py).
# One per line: code = template. Say who estimated it, against what, the number and its unit, what it means, what to do.

# ---- an extension's state (extensions/status.py, extensions/registry.py): why a node cannot be used, as the help page says
"E-EXT-UNKNOWN" = "No extension \"{name}\". Available: {known}"
"E-EXT-NONE" = "No extension \"{name}\": this server has not loaded any extension"
"E-EXT-NEEDSEXT" = "{title} is built on extension {needs} (it uses its nodes and code), which is missing or failed to load: put its folder in adapters/ first"
"E-EXT-NEEDSMANUAL.one" = "{count:d} file still needs to be downloaded by hand: {needs}"
"E-EXT-NEEDSMANUAL.other" = "{count:d} files still need to be downloaded by hand: {needs}"
"E-EXT-NOTINSTALLED" = "Extension {title} is not installed: an administrator clicks \"Install\" under \"Extensions\" on the admin page, or runs lab2shot ext install {name} on the server"
"E-EXT-OUTDATED" = "The installed environment of extension {title} was not installed from the current code (the code was updated and needs recompiling or other dependencies, or the last install did not finish): click Install under \"Extensions\" on the admin page, or run lab2shot ext install {name}; its nodes work once installed"
"E-EXT-SELFCHECKFAILED" = "{title} is installed but failed its self-check, so its nodes cannot be used for now: {detail}"
"E-EXT-NOSELFCHECK" = "The environment of {title} has not been self-checked yet, so its nodes cannot be used for now: click Install under \"Extensions\" on the admin page (finished steps are skipped and the self-check follows), or run lab2shot ext selfcheck {name}"
"E-EXT-GATED" = "The model weights need access to be requested first: {page}; once granted, click Install again under \"Extensions\" on the admin page"
"E-EXT-WEIGHTSMISSING" = "The model weights did not finish downloading ({weights}): click Install again under \"Extensions\" on the admin page"
"E-EXT-NOTPLACED.one" = "{count:d} file of {title} is not yet where it needs it ({files} …): run `lab2shot ext place {name}` on the command line, or click Install again under \"Extensions\" on the admin page. A cook started now fails only at the step that uses it, wasting everything before"
"E-EXT-NOTPLACED.other" = "{count:d} files of {title} are not yet where it needs them ({files} …): run `lab2shot ext place {name}` on the command line, or click Install again under \"Extensions\" on the admin page. A cook started now fails only at the step that uses it, wasting everything before"

