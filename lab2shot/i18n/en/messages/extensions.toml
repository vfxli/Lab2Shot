"E-INSTALL-NOENV" = "The environment of {title} was not built, so it cannot be self-checked: click \"Retry\" to continue from building the environment"
"E-INSTALL-PROBLEM" = "The install hit an unexpected error ({step}): {detail}. Click \"Retry\" to continue from this step; if it still fails, send the install log to the developers"
