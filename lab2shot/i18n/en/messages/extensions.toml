"E-INSTALL-REPOCHANGED.one" = "The original code of {repo} was changed after it was installed ({count:d} file: {files}): the original repository is never changed, all our changes live in adapters/. Reinstalling would wipe these changes, so it stopped: to keep them, move them into adapters/; if they are not wanted, reinstall with lab2shot ext install --revert"
"E-INSTALL-REPOCHANGED.other" = "The original code of {repo} was changed after it was installed ({count:d} files: {files}): the original repository is never changed, all our changes live in adapters/. Reinstalling would wipe these changes, so it stopped: to keep them, move them into adapters/; if they are not wanted, reinstall with lab2shot ext install --revert"
"E-INSTALL-LOCKED" = "{title} is being installed elsewhere (another install task, or the command line on the server): install once it ends"
"E-INSTALL-GATED" = "These model weights need access requested on Hugging Face first: {weights}. Request it at {page} and click \"Retry\" once granted"
"E-INSTALL-SELFCHECK" = "The self-check failed: importing {modules} in the new environment failed ({detail}). The new environment was not switched in and the one in use is not affected; send the install log to the developers"
