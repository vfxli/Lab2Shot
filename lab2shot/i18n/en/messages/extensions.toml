"W-INSTALL-HASHMISMATCH" = "{what} from {source} does not match the official sha256 ({got}… ≠ {want}…): deleted and not used; trying the next source"
"W-INSTALL-COMMITMISMATCH" = "The code from {source} is not the locked commit ({got} ≠ {want}): not used; trying the next source"
"W-INSTALL-GATEDPENDING" = "Model weights {weight} have not been granted access on Hugging Face yet: request it at {page}"
"N-INSTALL-MIRROR" = "{what} is fetched from mirror {mirror} instead: once fetched it is checked against the official hash or commit and used only if they match"
