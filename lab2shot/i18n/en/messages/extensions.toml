"N-INSTALL-WAITJOBS.one" = "The new environment passed its self-check: waiting for {count:d} job using {title} to finish before switching it in (the old environment is never swapped out in the middle of a job)"
"N-INSTALL-WAITJOBS.other" = "The new environment passed its self-check: waiting for {count:d} jobs using {title} to finish before switching it in (the old environment is never swapped out in the middle of a job)"
"N-INSTALL-CANCELLED" = "The install of {name} stopped (cancelled, or the server restarted immediately): click \"Install\" again to continue from where it stopped; finished steps are not redone"
"N-INSTALL-QUEUED" = "{title} already has an install task queued or running: wait for it to end, or cancel it first"
"N-INSTALL-NOPREVIOUS" = "{title} has no old environment to roll back to (rolling back works only after the environment was replaced and the old one is still on disk)"
"N-INSTALL-NOTINSTALLED" = "{title} is not installed yet"
"N-INSTALL-INUSE" = "{count:d} running jobs are using {title}: wait for them to finish"
