"W-MATTE-NOGUIDE.other" = "The coarse mask lacks {count:d} frames (from frame {first} on); they are taken as empty masks and their matte is most likely empty: make the coarse mask cover every frame of the images"
"W-MATTE-EMPTYALPHA.one" = "{count} frame has alpha below 0.5 everywhere (the person is out of frame, or was lost): frame {frames}"
"W-MATTE-EMPTYALPHA.other" = "{count} frames have alpha below 0.5 everywhere (the person is out of frame, or was lost): frame {frames}"

