"E-MATTE-NOOVERLAP" = "The mask and the images share no frame: the mask must come from the same images (with matching frame numbers)"
"W-MATTE-MASKSIZE" = "The mask's size {mask_width}×{mask_height} differs from the images' {width}×{height}; stretched to fit: the edges may be off, most likely the mask came from resized images"
