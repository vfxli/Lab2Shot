"I-SKREC-HANDFORK" = "By structure: where the arm end forks into fingers"
"I-SKREC-HANDEND" = "By structure: arm end"
"I-SKREC-THUMB" = "By position: the branch farthest from the forearm direction and closest to the wrist"
"I-SKREC-FINGERROW" = "By position: counted across the palm from the thumb side"
"I-SKREC-FINGERROWUNSURE" = "By position: counted across the palm from the thumb side (not five fingers, so the order is uncertain)"
"I-SKREC-LONEHAND" = "By structure: where four or five fingers split"
"I-SKREC-EYES" = "By position: a mirrored pair of joints under the head, toward the front"
"I-SKREC-JAW" = "By position: a centered joint under the head, toward the front and bottom"
"I-SKREC-NOTDOWN" = "By position: higher than the segment above"
"I-SKREC-NOTUP" = "By position: lower than the segment below"
"I-SKREC-OFFGROUND" = "By position: too far above the ground"
"I-SKREC-BELOWHIPS" = "By position: below the hips"
"I-SKREC-HANDLOW" = "By position: the hand is far below the hips (as if on a leg)"
"I-SKREC-WRONGSIDE" = "By position: on the other side of the body"
"I-SKREC-ROLEPART" = "Part: {part}"
"I-SKREC-ROLEPROP" = "By name: prop, weapon or attachment point"
"I-SKREC-ROLEHELPER" = "By name: twist, helper or control bone"
"I-SKREC-ROLETWIN" = "By position: coincides with the joint of {part}; not a part itself"
"I-SKREC-ROLEONBONE" = "By position: lies on the bone of {part} (twist or helper)"
"I-SKREC-ROLEEND" = "End point (no child joints)"
"I-SKREC-ROLEUNWEIGHTED" = "Drives no vertices (neither it nor the joints below it have skin weights): a control, attachment point or unskinned bone"
"I-SKREC-ROLEUNWEIGHTEDEND" = "End point that drives no vertices (no skin weights)"
"I-SKREC-INERT" = "{joint} drives no vertices (neither it nor the joints below it have skin weights) and takes no part in the mapping"
"I-SKREC-ROLEFACE" = "Joint under the head"
