# ---- per-account disk quota (server/quota.py)
"E-QUOTA-FULL" = "You already use {used_gb:.2f} GB on the server, the limit is {limit_gb:.2f} GB, and this needs another {adding_gb:.2f} GB, so it was not accepted. Used by: {parts}. Open the \"Queue\" window and delete jobs you do not need (\"Free Up Space\" deletes the oldest few at once, or \"Delete\" on each row): deleting a job frees what it uses, and cache used only by it goes with it. {jobs:d} finished jobs can be deleted now. If that is not enough, ask an administrator for a larger quota"
"E-QUOTA-FULLSTUCK" = "You already use {used_gb:.2f} GB on the server, the limit is {limit_gb:.2f} GB, and this needs another {adding_gb:.2f} GB, so it was not accepted. Used by: {parts}. The queue has no finished jobs to delete (cancel running ones first; then they can be deleted). The most is used by \"{area}\" ({area_gb:.2f} GB): delete templates you do not need in \"My Templates\" to free it; cache goes with the jobs that use it, and footage not used yet is cleaned up after its retention days. If you cannot wait, ask an administrator for a larger quota"
"E-QUOTA-COOKFULL" = "You already use {used_gb:.2f} GB on the server, which reaches the limit of {limit_gb:.2f} GB: no new cooks can be submitted (running ones finish as usual). Used by: {parts}. Open the \"Queue\" window and delete jobs you do not need (\"Free Up Space\" deletes the oldest few at once, or \"Delete\" on each row): deleting a job frees what it uses, and cache used only by it goes with it. {jobs:d} finished jobs can be deleted now; then continue. If that is not enough, ask an administrator for a larger quota"
"E-QUOTA-COOKSTUCK" = "You already use {used_gb:.2f} GB on the server, which reaches the limit of {limit_gb:.2f} GB: no new cooks can be submitted (running ones finish as usual). Used by: {parts}. The queue has no finished jobs to delete (cancel running ones first; then they can be deleted). The most is used by \"{area}\" ({area_gb:.2f} GB): delete templates you do not need in \"My Templates\" to free it; cache goes with the jobs that use it, and footage not used yet is cleaned up after its retention days. If you cannot wait, ask an administrator for a larger quota"
"I-AUDIT-GROUPRENAMED" = "{who} renamed a job group of {owner} to \"{name}\""
