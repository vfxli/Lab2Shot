"B-EACH-LEAK" = "\"{input}\" of {node} is connected to \"{source}\" inside the for-each block \"{block}\". Inside the block every item has its own result, so a node outside cannot tell which one to use. Results inside the block must pass through \"For-Each End\" to leave it."
"B-EACH-OUTSIDE" = "\"{input}\" of {node} is connected to \"{source}\" outside the block. \"For-Each End\" only collects the results of each item inside block \"{block}\"; connect data from outside the block straight to the nodes that use it, not through \"For-Each End\"."
"B-EACH-CROSS" = "The for-each blocks \"{block}\" and \"{other}\" overlap, and a wire of {node} crosses a block boundary. When two blocks share nodes, the inner block's begin, end and nodes must all be inside the outer block."
