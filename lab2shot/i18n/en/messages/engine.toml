"E-COOK-WIRED" = "{node}: {reason}"
"E-COOK-MISSINGINPUT" = "\"{input}\" of {node} needs the result of \"{source}\", but it is no longer in the cache (most likely cleaned up during the cook): cook again"
"E-COOK-MISSINGINPUT.app" = "An intermediate result it needs is no longer in the cache (most likely cleaned up during the cook): click Cook and Package again"
"E-COOK-MISSINGOUTPUT" = "{node} did not produce {ports}: the node's code leaves these outputs out. This is a bug in the program; send the log to the developers"
"E-COOK-CONTRACT" = "Output \"{output}\" of {node} does not follow the rules of {kind}: {problems}. This is a problem of the node's code; send the log to the developers"
"E-COOK-OUTPUTTYPE" = "its type is {got}, the port's is {want}"
"E-COOK-NOSUCHOUTPUT" = "it gave an output that does not exist: {output}"
"E-COOK-OUTPUTSIZE" = "its size {width}×{height} differs from the input image's {plate_width}×{plate_height}"
