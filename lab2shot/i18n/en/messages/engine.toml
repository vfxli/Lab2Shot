# ---- lists (engine/graph.py)
"B-WIRE-LIST" = "\"{output}\" of \"{source}\" is {got} and is connected to \"{input}\" ({want}) of {node}: a list and a single item cannot connect. To process items one by one connect a \"For-Each Begin\"; to take only one connect a \"Take Item\"; to merge several into one list connect a \"Merge List\"."
"B-SWITCH-PERFRAME" = "The condition of {node} differs per frame (from \"{source}\"): a switch takes one input for the whole range. Use a condition with one value for the whole range (for example turn off \"Per Frame\" on \"Split Camera\", or compare a whole-range value with \"Compare\")"
"B-LIST-NESTED" = "\"{output}\" of \"{source}\" is already {got}, and \"{input}\" of {node} would wrap it once more: lists have only one level. To merge the inner items, use \"For-Each End\" (it flattens inner lists and names the items \"outer/inner\")."
# an output that cannot be used now (Port.applies): the page says this too, so it is in FROM_SERVER of tools/messages_web.py.
# It says nothing about what to do: the reasons differ (such as the "Lens Model" and "Distortion Coefficients" ports
# with an undistorted lens model chosen), and {why} says what to do (as for inputs with B-WIRE-INACTIVE)

"B-WIRE-OUTINACTIVE" = "\"{output}\" of \"{source}\" cannot be connected now: {why}"

