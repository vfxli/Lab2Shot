# Cooking (lab2shot/engine, lab2shot/farm/queue.py) and usage checks (lab2shot/nodes/expects.py).
# One per line: code = template. Say who estimated it, against what, the number and its unit, what it means, what to do.

# ---- cooking one node (engine/cook.py)
"E-COOK-FAILED" = "{node} failed: {reason}"
"E-COOK-FAILED.app" = "{reason}"
"E-COOK-NODELIVERY" = "{node} has nowhere to collect its results: this cook is not a job submitted through the queue (a script or test called the engine directly). Collecting and packaging go into the job's folder so that the results reach whoever submitted it"
"E-COOK-PROBLEM" = "{detail}"
"N-COOK-NOTHINGIN" = "{node} did not cook this time: its required \"{input}\" is empty (\"{source}\" gave no data this time; see its warning). Its outputs are empty too; cook again once the upstream node gives data"
"I-COOK-BLOCKED" = "{node} was skipped (blocked): its required \"{input}\" comes from \"{root}\", which is blocked. This is a switch turned off, not an error; turn on \"Pass\" on \"{root}\" and it cooks"
"I-GATE-BLOCKED" = "{node} is blocking: it takes no input and nothing upstream cooks; it only makes its downstream nodes skip. Check \"Pass\" to let it through"
"N-COOK-SKIPPED" = "{node} was skipped: its required \"{input}\" comes from \"{root}\", which failed. Look at the error of \"{root}\" first, fix it, then cook again"
"E-COOK-UNAVAILABLE" = "{node} cannot be used now: {reason}. Nodes after it are skipped; Output nodes its wires lead into are not packaged, other branches cook as usual"
"E-COOK-UNAVAILABLE.app" = "One step cannot be used now: {reason}"
"N-COOK-OVERSCAN" = "{node} only processes the pixels inside the frame: input \"{input}\" has left {left} top {top} right {right} bottom {bottom} more pixels outside it (overscan), which were not cooked and are not in the results delivered downstream"
