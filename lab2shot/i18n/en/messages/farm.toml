# The queue and GPU scheduling (lab2shot/farm), uploads and outputs (lab2shot/transfer), loading extensions (lab2shot/adapters.py).
# One per line: code = template. Say who estimated it, against what, the number and its unit, what it means, what to do.
# E-JOB-GONE, E-JOB-NOGRAPH and E-OUTPUT-GONE are shared with the server routes, in server.toml; B-QUEUE-PAUSED is in web.toml.

