# The sign-up page (webui/src/register.tsx), account field rules (platform/accountRules.ts). Keys ui.register.<…>.
[ui.register]
rule_username = "A username has 3 to 32 characters: it starts with a lowercase letter and uses only lowercase letters, digits and _ . -"
