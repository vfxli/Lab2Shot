about = "Lab2Shot brings state-of-the-art computer graphics research into one node-based framework, turning published algorithms into tools ready for CG production. A shared integration specification and a common toolkit let new algorithms be added quickly, so the set of available methods keeps growing. Common input and output conventions let algorithms be combined freely, with several algorithms to choose from for the same task; every result is converted into one camera space, so results can be layered and compared directly, and they are delivered in production formats such as USD, FBX and multi-layer EXR to DCC applications such as Maya and Nuke. On top of this, model ensembles fuse the predictions of several models with dedicated strategies, reaching higher accuracy than any single model."
