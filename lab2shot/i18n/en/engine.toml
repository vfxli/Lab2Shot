# ---- resources tied to an account (site/resources.py: the tabs and lists of the admin Users detail page)
[resource.job_state]
queued = "Queued"
running = "Cooking"
done = "Done"
failed = "Failed"
cancelled = "Cancelled"
interrupted = "Interrupted"

[resource.jobs]
label = "Jobs"
