# Words of the engine, farm, accounts and other core modules (P1-D): display text that is not a message (no code).
# Same keys as zh/engine.toml.

[engine]
# a message pointing at a node: node name (type name)
node_ref = "{name} ({type})"
quoted = "\"{name}\""
chain_unknown = "a step it needs did not work out; the reason is in the message bar"
port_of = "\"{port}\" of \"{node}\""
# the values of a wired list, after the description
values = ": {values}"
option_shown = "{value} ({label})"

[engine.exposed]
# what is wrong with the parameter interface (exposed): {where} / {why} / {widget} of E-EXPOSED-*
interface = "parameter interface"
nth = "item {n}"
not_list = "exposed must be a list"
expr_text = "must be written as text"
group_name = "a group must have a name"
group_children = "a group's children must be a list"
neither = "neither a group nor a parameter with a name and a target (one parameter or a list of them)"
targets_repeat = "the same parameter is listed twice"
targets_unlike = "they are not the same kind of parameter (type, range, choices, widget or unit differ), so one entry cannot drive both"
targets_values = "their values differ now: the interface shows only the first one's, so set them alike before exposing them as one entry"
word_bad = "word goes on a button only, is one of {words}, and comes without a label (the shared word is what shows)"
name_empty = "the exposed name cannot be empty"
widget_bad = "the widget can only be menu or checkbox, not {widget}"
options_list = "options must be a list"
option_shape = "each item needs a value and a label"
option_repeat = "same value as an item before it"
hide_when = "Hide When \"{expr}\": {why}"
disable_when = "Disable When \"{expr}\": {why}"
disable_why = "with a Disable When, disable_why must be given too (why it cannot be chosen while disabled)"
disable_why_alone = "disable_why goes only with disable_when"
show_on_change = "show_on_change (show this node in the viewport after a change) can only be true or false"

[engine.exposed.widget]
menu = "menu"
checkbox = "checkbox"
either = "menu or checkbox"

[engine.routes]
# every route through a template reads as a graph and plans (reported by lab2shot check)
defaults = "defaults"
unreadable = "{where}: the graph does not read: {why}"
unplanned = "{where}: the delivery cannot be planned: {why}"
switch_way = "Menu \"{menu}\" set to \"{option}\" sends \"{node}\" down input {way}, but it has only {ways}"
no_entry = "{where}: {target} needs the user (a file to pick, or picks in the viewport), yet app mode has no way to it: expose it, or list it in meta.internal when the card needs none"

[engine.interface]
# a node type exposes the same parameters on every card (reported by lab2shot check)
missing = "missing {params}"
extra = "extra {params}"
differs = "{param} differs in exposed name / label / conditions ({here}; most cards, such as \"{like}\", have {there})"
joiner = "; "
unlike.one = "{name}: the parameters {type} exposes differ from the other {others} card: {parts} (if that is intended, add {type} to meta.own_interface)"
unlike.other = "{name}: the parameters {type} exposes differ from the other {others} cards: {parts} (if that is intended, add {type} to meta.own_interface)"

[engine.kind]
# what a port carries (Port.data)
data = "a data image"
picture = "a picture"

[engine.contract]
output_port = "output port"
empty_undeclared = "an empty packet was produced, but the port does not declare may_be_empty"

[engine.shape]
# what is wrong with the graph file's structure ({what} of E-GRAPH-SHAPE)
nodes = "nodes must be a list"
edges = "edges must be a list"
node = "node {n} must have an id and a type, both text"
id.one = "node id \"{id}\" must be text of at most {most} character, without . / @ :, white space, control characters or invisible format characters"
id.other = "node id \"{id}\" must be text of at most {most} characters, without . / @ :, white space, control characters or invisible format characters"
comment = "the comment of node {id} must be text"
params = "the params of node {id} must be an object"
promoted = "the promoted of node {id} must be a list of parameter names"
edge = "wire {n} must have from and to, each [node, port]"

# ---- condition expressions (engine/conditions.py) say the page's words: ui.conditions.* (i18n/<lang>/ui/conditions.toml)

# ---- conventions of the templates' exposed parameter names (engine/conventions.py, reported by lab2shot check)
[conventions]
# the word the notes of the _conventions.md fixed name table mark an exception card with ("TRAM exception")
exception = "exception"
none = "(none)"
unpaired = "_conventions.md fixed name table, row \"{name}\": {names} names but {groups} target groups (grouped by \"/\"): pair each name with one target group, or give each name its own row"
unread = "_conventions.md fixed name table, row \"{name}\": cannot read its targets: {what} (write them as `extension.node.parameter`)"
no_type = "_conventions.md fixed name table, row \"{name}\", target {type}.{param}: there is no node type {type}"
no_param = "_conventions.md fixed name table, row \"{name}\", target {type}.{param}: {type} has no parameter {param}"
bound = "Exposed name {name} may only point at {want}; here it points at {type}.{param}"
several_outputs = "The card has {n} format output nodes (several deliveries): use {names}, not file_name"
one_output = "The card has one delivery only: its name is file_name, not {names}"
last_button_staged = "The last step's button {name} should say \"word\": \"{word}\" (shown as \"{want}\": the card has other stage buttons); it shows \"{label}\""
last_button_alone = "The last step's button {name} should say \"word\": \"{word}\" (shown as \"{want}\": the card has no other stage buttons); it shows \"{label}\""
exr_lossless = "On a card with data layers the exr_compression menu may list only the lossless {allowed}; extra: {extra}"
focal_filmback = "focal is exposed ({target}), so the same node's filmback must be exposed too ({node}.filmback_mm)"
filmback_when = "The Disable When of {name} must contain not focal (disabled while no focal length is given); it is {now}"
node_id = "Node id {id} is not a readable word (starts with a lowercase letter, only lowercase letters, digits and _, at least 3 characters): exposed names are derived from it"
derived_taken = "The exposed name {want} derived from node id {id}, parameter {param}, names something else in the fixed name table: give this node another id (rule 2)"
derived_name = "Exposed name {name} ({target}) is not in the fixed name table: it should be {want} (node id_parameter name, rule 1)"
meaning = "{name} = {value} means \"{meant}\" in the fixed name table but \"{label}\" on this card (a value means the same on every card, rule 3)"
after_button = "Parameters {params} act on the stage button {button} ({target}) but come after it: move them before the button"

# ---- cook stages (the core's shared stage.<id>: engine/resident.py making GPU memory for another job)
[stage]
resident_unload = "Freeing GPU memory: unloading {title}"
resident_to_ram = "Freeing GPU memory: moving the models of {title} to RAM"
resident_unload_no_ram = "Freeing GPU memory: not enough RAM, unloading {title}"
vram_retry = "Not enough GPU memory: unloading the resident models on this GPU and cooking again"

