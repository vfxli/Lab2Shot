# The command line's (lab2shot ...) words: help, options, the output of the operations commands (check, setup).
[cli.app]
help = "Lab2Shot: research algorithms turned into tools for CG production."

[cli.option]
version = "Show the version"
lang = "Interface language: zh or en (default: LAB2SHOT_LANG, else the language LC_ALL / LANG names; Chinese when they name none, or C or POSIX)"

[cli.check]
summary.one = "{problems} problem, {seconds:.1f} s"
summary.other = "{problems} problems, {seconds:.1f} s"
unknown = "No such check: {name} (one of: {names})"
failed_to_run = "{name}: the check did not finish: {error}"
only = "Run only this one: {names}"

[cli.check.i18n]
english = "{where} writes the English \"{text}\" into the page's markup: shown words go in the catalogue (t(\"ui.…\"))"
unknown = "{where} says the word {key}, which no catalogue has: showing it would fail"
catalogues.one = "i18n: the catalogues of {langs} read ({words} word, {messages} messages)"
catalogues.other = "i18n: the catalogues of {langs} read ({words} words, {messages} messages)"
extra = "i18n: the {language} catalogue has {key}, which the Chinese one does not ({where})"
placeholders = "i18n: {key} has other placeholders in Chinese ({zh}) than in English ({en})"
app_placeholders = "i18n: {key} (the app-mode words) names a placeholder {base} does not: the caller gives only those of {base}"
reserved = "i18n: {key} ({language}) has a placeholder named {name}, which t() takes as its own keyword (a language or scope): rename it"
eager = "i18n: message parameter {name} at {where} is a word said once in the language of the moment (t / pick / node_text / lookup, or a node named by its subtitle): use i18n.Word, and node_ref (name (type)) for a node"
unused = "i18n: no code uses the key {key} ({where})"
over = "i18n: {area} has {now} {what}, over its baseline of {most} (it may only go down; see lab2shot/i18n/baseline.toml)"
under = "i18n: {area} is down to {now} {what} (baseline {most}): run uv run python tools/i18n_baseline.py to tighten it"
counted = "i18n: {cjk} Chinese literals in code, {missing} English keys missing, {fields} one-language template fields: none over its baseline"
cjk = "Chinese literals"
missing = "missing English keys"
fields = "one-language template fields"
lacking = "i18n: the {language} catalogue lacks {key}, which the Chinese one has ({where})"
plural_zh_one = "i18n: {key}: Chinese writes only the plural form .other, never .one ({where})"
plural_pair = "i18n: {key} ({language}): a sentence that follows a number is written with .one and .other in English, .other in Chinese ({where})"
plural_twice = "i18n: {key} ({language}) is written both as one sentence and in plural forms ({where})"
plural_one_names = "i18n: {key}.one names a placeholder its .other does not ({where})"
plural_needed = "i18n: {key} ({language}): \"{said}\" follows a number and misreads for 1: write it in plural forms .one / .other ({where})"

[cli.menu]
number = "No."
name = "Name"
description = "Description"
pick = "Enter a number"

# lab2shot login | logout and lab2shot admin (cli/accounts.py).
[cli.accounts.option]
server = "Lab2Shot server address"
server_example = "Lab2Shot server address, e.g. http://render-box:8765"

[cli.accounts.login]
help = "Log in to a Lab2Shot server: lab2shot cook --server and the DCC plugins on this machine then use this account (the token is kept in ~/.lab2shot/tokens.json, readable by the current user only)."
username = "Username (created by the administrator under Users); asked for when left out"
prompt_username = "Username"
prompt_password = "Password"
no_department = "no department"
done = "[green]Logged in[/green]: {name} ({username} · {department}), token saved to {file}"

[cli.accounts.logout]
help = "Log out of a Lab2Shot server: the token is revoked and deleted from this machine."
done = "Logged out"

[cli.admin]
help = "The administrator account's password and passphrase: changed only on this server with the commands below (also while the service is running)."
by_command_line = "command line"
cancelled = "Cancelled, nothing deleted"
yes = "Do not ask before deleting"

[cli.admin.secret]
new = "New {what}"
again = "Repeat the new {what}"

[cli.admin.password]
help = "Reset the password of the built-in administrator account, when it is forgotten or locked after too many wrong attempts. Takes effect at once: the administrator logs in again with the new password on every web page, and the count of wrong attempts is cleared."
what = "administrator password"
done = "[green]Administrator password changed[/green]: username {username}. It takes effect at once; the count of wrong passwords is cleared."

[cli.admin.passphrase]
help = "Set the passphrase: set only on this server, never shown or changed on the web. When the administrator password is forgotten, click Forgot Password on the login page and set a new one with the passphrase."
what = "passphrase"
set = "[green]Passphrase set[/green]: when the administrator password is forgotten, click Forgot Password on the login page and enter the passphrase to set a new password. Only an irreversible fingerprint of the passphrase is kept, so no one can read it back: keep it safe."
updated = "[green]Passphrase updated[/green]: when the administrator password is forgotten, click Forgot Password on the login page and enter the passphrase to set a new password. Only an irreversible fingerprint of the passphrase is kept, so no one can read it back: keep it safe."

[cli.admin.status]
help = "Show whether the administrator password is still unset, whether the passphrase is set, and how many accounts there are (who is online only the running service knows: see the Users page of the admin page)."
no_password = "Administrator  {username}, [yellow]no password set, cannot log in: run lab2shot admin password (or Accounts and Security → Set Administrator Password in ./setup.sh)[/yellow]"
password = "Administrator  {username}, password changed {when} by {by}"
no_passphrase = "Passphrase     not set: run lab2shot admin passphrase to set it"
passphrase = "Passphrase     set {when}"
accounts = "Accounts       {count} (create them under Users); see who is online on the Users page of the admin page"

[cli.admin.logout]
help = "Log out every web page, DCC plugin and command line (everyone logs in again). When a password may have leaked, change it first, then run this."
done = "{count} login sessions ended."

[cli.admin.restart]
help = "Restart the lab2shot ui running on this machine. Use this for a coordinated restart rather than calling /api/admin/restart with a password login, which would end the administrator's browser session."
mode = "drain: let running jobs finish, queued jobs stay queued after the restart; now: stop running jobs at once"
wait = "Return only once the new service has started (its boot number changed), waiting 5 minutes at most"
asked = "Restart requested ({mode}): this is boot {boot}"
waiting = "Waiting for the new service to start…"
done = "[green]Restarted[/green]: boot {boot}"
timeout = "Waited 5 minutes and the restart has not finished: check the service"

[cli.admin.unlock]
help = "Clear the count of wrong passwords: accounts slowed down by guesses from unknown devices and locked-out sources can try again at once. Only on this server (machine token): the administrator's browser login cannot clear it, since the count is what stops password guessing."
done = "[green]Cleared[/green]: {count} wrong-password records removed."

[cli.admin.gpus]
help = "Show the GPUs the lab2shot ui running on this machine detected: model, memory, architecture, whether each takes jobs (machine token, no password login)."
json = "Print each GPU's uuid, model, vram_gb, arch and authorized as JSON (for the GPU test tool to pick GPUs)"
card = "GPU"
memory = "Memory"
arch = "Architecture"
taking = "[green]takes jobs[/green]"
not_taking = "[dim]takes no jobs[/dim]"

[cli.admin.authorize]
help = "Authorize GPUs, by UUID, to take jobs on the lab2shot ui running on this machine (machine token, no password login). The list is the whole authorization: GPUs not listed are no longer authorized."
uuid = "UUIDs of the GPUs that take jobs (see lab2shot admin gpus; several allowed, replacing the current authorization)"
none = "Authorize no GPU (running jobs finish, no new ones are taken)"
need_uuid = "Name the UUIDs of the GPUs to authorize (see lab2shot admin gpus); to authorize none, use --none"
done = "[green]{count} GPUs authorized[/green]"
listed = ": {uuids}"
none_taking = ": no GPU takes jobs"
taking = " ({count} GPUs of the service take jobs now)"

[cli.admin.switches]
help = "The two switches for GPU jobs and compute jobs (machine token). Without options, only shows them. Running jobs are not affected and run to the end."
gpu = "GPU jobs switch (queue.gpu_jobs): off, GPU jobs only queue and do not start"
compute = "Compute jobs switch (queue.compute_jobs): off, no new compute jobs are taken"
on = "[green]on[/green]"
off = "[yellow]off[/yellow]"
gpu_state = "GPU jobs      {state}"
compute_state = "Compute jobs  {state}"

[cli.admin.queue]
help = "Check whether the queue is idle (before a coordinated restart; do not call /api/admin/queue with a password login): exit code 0 when idle; when busy, lists the active jobs with exit code 3."
idle = "Idle: no job is queued or running"

[cli.admin.joblog]
help = "Look up the full record of a cook by its error number (node, parameters, model, GPU memory, full stack): finds the job's folder in the cache by the eight-character number of the error (<number>*_job) and prints the node, extension, time, frame count and parameters of its job.json and the end of its worker.log; when one number matches several folders, the newest. Exit code 4 when not found."
code = "The eight-character error number of the error message (given by the user)"
lines = "How many lines of the end of the log to print; 0 for all"
bad_code = "[yellow]Malformed error number: {code}[/yellow]"
not_found = "[yellow]Error number {code} not found[/yellow]: the cache has no such job (it may have been cleaned, or the number is wrong)"
several.one = "[yellow]Error number {code} matches {count} job; using the newest: {folder}[/yellow]"
several.other = "[yellow]Error number {code} matches {count} jobs; using the newest: {folder}[/yellow]"
record = "Node        {node}\nExtension   {extension}\nTime        {created}\nFrames      {frames}\nParameters  {params}"
no_log = "[yellow]The job has no log file[/yellow] ({file})"
tail.one = "[dim](only the last {shown} of {total} lines; use --lines 0 to show all)[/dim]"
tail.other = "[dim](only the last {shown} of {total} lines; use --lines 0 to show all)[/dim]"
full = "[dim]Full log: {file}[/dim]"

[cli.admin.feedback]
help = "List the feedback history, or clear all of it with --clear. The delete buttons of the admin page need a password login, which would end the administrator's browser session; this command calls the feedback module directly, without a login. It deletes the rows of the database's feedback table and the screenshots and diagnostics in work/feedback/<id>/, nothing else; copies in database backups stay until the backups rotate."
clear = "Delete the whole feedback history (with its screenshots and diagnostics)"
empty = "The feedback history is empty"
count = "{count} feedback entries:"
how_to_clear = "[dim]To delete them all: uv run lab2shot admin feedback --clear[/dim]"
already_empty = "The feedback history is already empty"
confirm = "Delete {count} feedback entries and their screenshots? This cannot be undone"
done = "{count} feedback entries deleted"
orphans.one = "Also removed {count} folder without a record ({mb:.1f} MB): the database no longer had them, but the folders were still on disk"
orphans.other = "Also removed {count} folders without a record ({mb:.1f} MB): the database no longer had them, but the folders were still on disk"

[cli.admin.jobs]
help = "List the queue history, or remove every finished job with --clear. Works through the service running on this machine with the machine token, without a login; nothing is removed when the service is not running. The same rules as Delete All of the queue panel: queued or running jobs are kept (the result says how many were skipped); each job's folder (graph, inputs, outputs, logs) is removed whole, and caches only it referenced go with the next cleanup."
user = "Only this account's jobs (default: the administrator)"
clear = "Delete the whole history of finished jobs (and free the space it takes)"
no_account = "No such account: {name} (accounts: {names})"
empty = "The queue history of {name} is empty"
count.one = "Queue history of {name}: {count} job ({active} queued or running):"
count.other = "Queue history of {name}: {count} jobs ({active} queued or running):"
more = "… {count} more"
how_to_clear = "[dim]To delete them all: uv run lab2shot admin jobs --clear[/dim]"
nothing = "No finished job to delete (cancel queued or running jobs first)"
confirm = "Delete the {count} finished jobs of {name} and free the space they take? This cannot be undone"
done.one = "{count} job deleted, {mb:.1f} MB freed"
done.other = "{count} jobs deleted, {mb:.1f} MB freed"
skipped = "; {count} skipped (queued or running)"

# The checks of lab2shot check (cli/check.py, cli/check_naming.py). Keys cli.check.<check>.<…>.
[cli.check.help]
text = "The project's static invariants: ports and citations, node body parameters, categories, message codes, templates, channel mapping, deletion paths, imported names, release notes. Run it after changing code; it takes seconds and changes nothing in work/."

[cli.check.common]
sep = "; "
more = "…"

[cli.check.official]
takes = "official {type}: takes[{port}] is not an input port or parameter of the node"
gives = "official {type}: gives/ours[{port}] is not an output port of the node"
input_undeclared = "official {type}: input port {port} is not in takes: upstream does not take it, so it was added by us"
output_undeclared = "official {type}: output port {port} is not in gives or ours: upstream does not output it, so it was added by us"
unreadable = "official {type}: cannot read the citation: {error}"
absent.one = "official: the upstream of {count} node is not installed, its citations not checked: {types}"
absent.other = "official: the upstream of {count} nodes is not installed, citations not checked: {types}"
ok = "official: ports and upstream citations of {count} third-party nodes"

[cli.check.nodes]
on_node_many.one = "on_node {type}: {count} parameter on the node body, more than {most} ({names})"
on_node_many.other = "on_node {type}: {count} parameters on the node body, more than {most} ({names})"
on_node_unknown = "on_node {type}: {names} are not parameters of the node"
button_clash = "buttons {type}: button names {names} clash with parameters or other buttons"
button_value = "buttons {type}: buttons {names} need an action and no value, and stay out of the fingerprint and the worker"
ok.one = "on_node: the {count} node shows no more than {most} parameters on its body; button names clash with no parameter and hold no value"
ok.other = "on_node: none of the {count} nodes shows more than {most} parameters on its body; button names clash with no parameter and hold no value"
data_undeclared = "data: image input ports that do not say whether they take pictures or values (Port.data: False / True / EITHER): {ports}"
data_contrary = "data: one- or two-channel input ports declared to take pictures only: {ports}"
data_ok = "data: every three-, four- and any-channel image input port declares whether it takes pictures, values or both"
contracts_missing = "contracts: data types {types} have no row in data/contracts.py META"
contracts_ok = "contracts: all {count} data types have a row"
metric_undeclared = "metric {type}: a depth and camera node states whether its output is in metres (metric = True / False, or a condition on its parameters): no default to forget it by"
metric_ok.one = "metric: the {count} depth and camera node states whether its output is in metres"
metric_ok.other = "metric: all {count} depth and camera nodes state whether their output is in metres"

[cli.check.workers]
base = "workers {type}: an extension node inherits WorkerNode (or its families), ImportNode or OutputSettings; now {now}"
cook = "workers {type}: extension classes do not override cook ({classes}): what is sent goes in prepare, what is read back in convert"
ok = "workers: all {count} extension nodes run their worker through WorkerNode / import / format output nodes, none overrides cook"

[cli.check.categories]
bad_id = "categories {tree}: the id {id} breaks the naming rule"
parent = "categories {tree}: the parent {parent} of {id} is not a top-level category"
section = "categories {tree}: the top-level category {id} names no section ({sections})"
