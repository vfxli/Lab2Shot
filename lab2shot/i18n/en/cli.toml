sequence = "Image Sequence"
video = "Video"
still = "Still"
kind = "Type          {kind}"
path = "Path          {path}"
frames.one = "Frames        {range} ({count} frame)"
frames.other = "Frames        {range} ({count} frames)"
resolution = "Resolution    {width} × {height}"
fps = "FPS           {fps}"
fps_unknown = "unknown (image sequences default to 24)"
colorspace = "Color space   {space} (by file format; can be changed on the read node)"

# The one-click update (cli/update.py). Keys cli.update.<…>.
[cli.update.step]
title = "Step {step} of {steps}: {name}"
preflight = "Preflight"
record = "Record the current state"
managed = "Back up managed files"
stop = "Confirm the service is stopped and back up the database"
environment = "Sync the environment and build the web page"
check = "Check"
start = "Start the service"
rollback = "Roll back"
report = "Report"

[cli.update.baseline]
other_root = "the deployment record belongs to another checkout"
no_record = "No finished update on record and no git pull just run: the environment is synced and checked for the current code, which is also the rollback baseline."
not_ancestor = "the last deployed commit does not exist, or is not an ancestor of the current version; check work/installed.json and the current branch"
how_uv = "run ./setup.sh again to be guided through installing it, or see https://docs.astral.sh/uv/"
how_npm = "install Node.js first (https://nodejs.org/)"
local = "This update uses the local code: branch {branch}, version {version}; on failure it rolls back to {previous}."

[cli.update.record]
git = "git version: {version} \"{subject}\" (branch {branch})."
plan = "Step 4 backs up the database of the stopped service, before the environment is synced and migrated."
settings_copied = "Settings file: copied to {path}."
settings_none = "Settings file: {path} does not exist; every setting is at its default."
where = "This update's record: {path}"
no_database = "The work folder has no database yet (the service has never started): nothing to back up."
database = "Database backed up: {backup} (work/db/backups/; the service is stopped, nothing is written after the backup)."

[cli.update.managed]
none = "The managed files (menu/*.json, templates/*.json) have no local changes."
file = "Managed file"
change = "Local change"
backup = "Backup"
changed = "Modified"
deleted = "Deleted"
untracked = "New (not in git)"
deletion = "Deletion recorded"
saved = "The local managed files are backed up; the update keeps their current content."

[cli.update.run]
stopped = "The service is stopped: the database can be backed up."
checked = "lab2shot check: no problems found."
no_database = "The work folder has no database yet: nothing to upgrade or check; the new version creates it when it first starts."
database = "The database is upgraded and passed the integrity check."
started = "The service started and answers: {address} (/api/server and the web page both answered)."
output.one = "The new version's service output (the last {lines} line of {log}):"
output.other = "The new version's service output (the last {lines} lines of {log}):"
confirm = "Start the update? (back up, sync the environment, build the web page, check, migrate the database and start the service)"
cancelled = "Cancelled; nothing was changed."
interrupted = "the rollback was interrupted (Ctrl-C)"
extension = "{title} ({name})"
done = "This update's record: {path}; the local managed files keep their current content."
exit_code = "exit code {code}"
migrated = "The installed extensions are recorded as the new code identifies them (lab2shot ext migrate)."

[cli.update.rollback]
new_stopped = "The new version's service stopped (port {port}; process {pid} has ended)."
new_not_stopped = "the new version's service did not stop: {error}"
new_no_pid = "the new version's service (port {port}) answers, but its process ID cannot be seen, so it was not stopped"
git_failed = "git did not go back to {version}"
code = "The code is back at {version}."
backup_gone = "{backup} is gone: {path} was not restored"
file_failed = "{path} was not restored: {error}"
managed = "{count} managed files restored to their local content from before the update."
settings = "Settings file restored: {path}."
settings_removed = "The settings file made during the update was removed: {path}."
settings_failed = "the settings file was not restored: {error}"
database = "The database is restored to {backup} (the one the new version used moved to {moved})."
database_failed = "the database was not restored to {backup}: {error}"
sync_failed = "uv sync did not restore the old version's Python environment"
web_failed = "the old version's web page was not built again"
migrate = "The installed extensions are as they were before the migration."
migrate_failed = "a migration of the installed extensions was not undone: {error}"
start_failed = "the old version's service did not start"
page_failed = "the old version's service started, but its web page does not open"
started = "The old version's service started and answers: {address}."

[cli.check.routes]
undeclared = "routes: {route} declares no access (server/routes.py)"
unowned = "routes: {route} takes one account's data ({params}) but declares no owner (owned=, server/owners.py): any other account could read it"
body_undeclared = "routes: {route} reads {fields} from its request body, named like one account's data: declare them (body_ids=) with the owner that checks or filters them (owned=, server/owners.py)"
body_unknown = "routes: {route} declares body_ids {fields}, which are not fields of its request body"
admin_unowned = "routes: the admin route {route} takes one account's data ({params}): declare its owner (owned=) or make it need {right}"
ok = "routes: every route is declared, and every one naming an account's data declares its owner (routes: {routes})"

[cli.check.layers]
unplaced = "layers: {unit} ({where}) is in no layer of the table (cli/check_arch.py LAYERS): put it in one"
upward = "layers: {where} imports {module}: the {low} layer may not depend on the higher {high} layer (cli/check_arch.py LAYERS)"
past_sdk = "layers: {where} imports {module}: an extension uses the core only through lab2shot.sdk"
ok = "layers: every import goes down the layer table, and extensions use the core only through lab2shot.sdk (imports: {imports}; layers: {layers})"

[cli.check.tests]
passed = "tests: {suite} all passed"
failed = "tests: {suite} failed (exit code {code}):\n{tail}"

[cli.check.digests]
direct = "digests: {where} uses hashlib directly: keys and content digests are made by lab2shot/io/digest.py (cli/check_arch.py DIGEST_ALLOWED lists the exceptions)"
ok = "digests: keys and content digests all go through io/digest.py (files: {files}; exceptions: {allowed})"
