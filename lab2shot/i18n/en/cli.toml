proxy_hint = "The reverse proxy must write the user's address into X-Forwarded-For, replacing it rather than appending (Nginx: proxy_set_header X-Forwarded-For $remote_addr;); it must also pass on the address the user opened unchanged, port included, or logins and other actions are refused as coming from another site (Nginx: proxy_set_header Host $http_host;, not $host, which drops the port); and forward to http://{target}."
