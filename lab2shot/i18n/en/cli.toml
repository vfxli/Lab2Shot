[cli.setup.step.update]
label = "One-Click Update"
summary = "Stop the service and git pull --ff-only by hand first, then upgrade the pulled local code: back up, sync the environment, build the web interface, check, migrate, start; roll back on failure"
what = "With the newly pulled upgrade program: checks the working tree and that the service is stopped, records the last deployed version (on a first upgrade, from the latest manual pull record), backs up the settings, the locally managed files and the old database, runs uv sync, npm ci and the web build, lab2shot check, the database upgrade and integrity check, starts the service and confirms it answers; a failure after the environment sync restores the recorded code, database and environment and brings the old version back online"
why = "Deploys the pulled code; the administrator runs git pull by hand before this step"
changes = ".venv/, webui/node_modules/ and webui/dist/; work/db (backed up before the update); the deployed version in work/installed.json; the update record, settings file and copies of the locally managed files in work/updates/<time>/; on rollback, the project code"
scope = "Inside the project and work folders; stop the service with the old version before pulling; extensions are not reinstalled"

[cli.setup.step.env]
label = "Install the Python Dependencies"
summary = "Create the Python environment of the service and the command line from uv.lock (uv sync)"
what = "Runs uv sync, installing the dependencies of uv.lock"
why = "The environment the service and the command line run in"
changes = ".venv/; the package cache is in ~/.cache/uv"

[cli.setup.step.web]
label = "Build the Web Interface"
summary = "Install the front-end dependencies and build the web interface (npm)"
what = "Runs npm ci (installs exactly by package-lock.json, leaving it unchanged) and npm run build"
why = "Makes the pages the service gives browsers"
changes = "webui/node_modules/, webui/dist/"

[cli.setup.step.check]
label = "Check the Requirements"
summary = "List the state of what the service needs: Python, Node.js, the web build, the GPU driver, ... (read-only)"
what = "Lists the state of Python, uv, Node.js, the web build, the GPU driver, the work folder and the settings file"
why = "Finds what is missing"
changes = "Nothing"

[cli.setup.step.build_setup]
label = "Extension Build and Download Settings"
summary = "The settings building and downloading extensions need, and the Alembic and FBX modules"
what = "Build environment settings, toolchain check, download mirrors, retry policy, format module installation (Alembic, FBX)"
why = "The settings extensions depend on when they compile CUDA kernels in their own environments and fetch code and model weights"
changes = "config/local.toml; format modules are installed into third_party/, the original files moved to downloads/installed/"

[cli.setup.step.archs]
label = "Choose the Compile Target Architectures"
summary = "Which GPU architectures the extensions' CUDA code is compiled for (default Ada Lovelace and Blackwell)"
what = "Lists the architectures (by platform name) to choose by number"
why = "The compiled CUDA code runs on the chosen architectures only, whatever GPU the compiling machine has"
changes = "config/local.toml (only values that differ from their defaults); installed extensions compile for the new architectures only when reinstalled"

[cli.setup.step.toolchain]
label = "Check the Build Tools"
summary = "git, compilers, nvcc, compile target architectures, and nvcc and GCC compatibility (read-only)"
what = "Checks git, the C and C++ compilers and nvcc, whether nvcc supports every chosen compile target architecture, and whether the nvcc and GCC versions are compatible"
why = "Confirms the tools for compiling extensions are all there and their versions match"
changes = "Nothing"

[cli.setup.step.formats]
label = "Install the Alembic and FBX Modules"
summary = "Every template that reads or writes DCC scene files (Alembic, FBX) depends on these two modules"
what = "Installs the Alembic and FBX format modules; the FBX SDK must be put into downloads/ first, and its license is read and accepted here"
why = "Every template that reads or writes DCC scene files depends on these two modules"
changes = "The format modules in third_party/; the original files moved to downloads/installed/; license acceptances recorded in work/db"

[cli.setup.step.hf_login]
label = "Log in to Hugging Face"
summary = "List the models that need an access request, and log this machine in to Hugging Face"
what = "Lists the model weights whose repositories need an access request, with their request pages, and runs hf auth login"
why = "Once approved, the installer downloads these model weights with the account this machine is logged in with"
changes = "The Hugging Face token file (by default ~/.cache/huggingface/token; inside HF_HOME when that is set)"
scope = "The Hugging Face login in the current user's home folder; the project folder is not changed"

[cli.setup.step.downloads]
label = "Install the Manually Downloaded Files"
summary = "Recognise and install the files put into downloads/ (SMPL, FLAME, FBX SDK, ...), and list the files still missing with their download pages"
what = "Recognises and installs the files in downloads/, listing each item's download page, the file it needs and its state"
why = "Some models can only be downloaded after registering or accepting a license on their site, which the installer cannot do"
changes = "third_party/_body_models/ or the extension's weights/; the original files moved to downloads/installed/; license acceptances recorded in work/db"

[cli.setup.step.extensions]
label = "Install Extensions"
summary = "List every extension with its state, and install the chosen ones in turn"
what = "Lists every extension and runs the pre-install checks and the installation of the chosen numbers in turn (the same as Install on the admin page's Extensions page)"
why = "Each algorithm node runs in its extension's own environment"
changes = "third_party/<project>/: code, its own environment and model weights"

[cli.setup.step.password]
label = "Set the Administrator Password"
summary = "Set or reset the password of the administrator account admin"
what = "Sets or resets the administrator account's password"
why = "A new installation's administrator has no password; nobody can log in until it is set"
changes = "The account record in work/db (the service must have started once); takes effect at once, logged-in browsers must log in again"

[cli.setup.step.passphrase]
label = "Set the Recovery Passphrase"
summary = "Set the passphrase that resets a forgotten administrator password"
what = "Sets the passphrase used when the administrator password is forgotten"
why = "Forgot Password on the login page resets the password with this passphrase; it can only be set on this machine"
changes = "The passphrase's hash in work/db (the service must have started once)"

[cli.setup.step.start]
label = "Start the Service (Background)"
summary = "Start the service in the background, logging to work/logs/"
what = "Starts lab2shot ui in the background"
why = "The service the web pages and DCC plugins connect to"
changes = "work/logs/ui_stdout.log; on the first start the service creates work/ (database, administrator account, machine token)"

[cli.setup.step.start_fg]
label = "Start the Service (Foreground)"
summary = "Run the service in this terminal, to watch its log"
what = "Starts lab2shot ui in this terminal; Ctrl-C stops it"
why = "Watch the log directly when looking into a problem"
changes = "The same as the background start"

[cli.setup.step.restart]
label = "Restart the Service"
summary = "Restart the running service, optionally waiting for jobs to finish"
what = "Restarts the running service through the machine token, optionally waiting for the jobs being computed to finish"
why = "Applies the settings that need a restart"
changes = "Nothing"

[cli.setup.step.stop]
label = "Stop the Service"
summary = "Stop the running service, optionally waiting for jobs to finish"
what = "Asks the running service to stop through the machine token, either after the current jobs finish or at once, and waits until it exits; when the service does not answer, ends the process listening on the port after confirmation"
why = "Shutting down, changing the port or retiring the service"
changes = "Nothing; queued jobs wait for the next start of the service, and stopping at once stops the jobs being computed"

[cli.setup.step.gpus]
label = "Choose the GPUs for Computing"
summary = "Choose the GPUs that take jobs (GPU authorization)"
what = "Chooses the GPUs that take jobs"
why = "A GPU not authorized does not compute"
changes = "The running service's authorization list (work/db)"

[cli.setup.step.settings]
label = "All Settings"
summary = "View and change every setting, by the pages of the admin page's Settings group"
what = "Lists every setting by the pages of the admin page's Settings group, with its current value, default and how it takes effect; each can be changed"
why = "Manage the server's settings without a browser"
changes = "config/local.toml (only values that differ from their defaults); some settings take effect after a restart of the service"

[cli.setup.step.server]
label = "Set the Network and Port"
summary = "By access type (this machine only, direct LAN access, behind a reverse proxy): set the listening scope, HTTPS, trusted proxies and public names, then the port"
what = "Asks first how the server is reached, listing every setting each way writes; writes the listening scope, HTTPS, trusted proxies and public names of the chosen way, then asks for the port, and sums up the values actually written"
why = "Each of the three access types needs one definite set of network settings; choosing the type writes them all right, with no setting to work out one by one"
changes = "config/local.toml (the same as Settings → Network and Installation); with HTTPS on, the service makes a self-signed certificate in work/tls/ when it starts; takes effect after a restart of the service"

[cli.setup.step.db_status]
label = "Database Status"
summary = "Database file, size, version, integrity and every backup (read-only)"
what = "Shows the database's file, size, version, latest integrity check and backup, and lists every backup"
why = "Know the state of the database"
changes = "Nothing"

[cli.setup.step.db_backup]
label = "Back Up the Database Now"
summary = "Back up the database now (also while the service runs)"
what = "Copies the database by SQLite's online backup and verifies the copy"
why = "Keep a restorable copy before an important operation"
changes = "A new backup and its attached files in work/db/backups/; beyond the number kept, the oldest backup is deleted"

[cli.setup.step.db_check]
label = "Check the Database Integrity"
summary = "Check the database's integrity and foreign keys"
what = "Runs SQLite's integrity check and foreign key check"
why = "Confirm the database can be trusted"
changes = "Nothing (only the check's result is recorded)"

[cli.setup.step.db_restore]
label = "Restore the Database from a Backup"
summary = "Replace the current database with a backup (the service must be stopped)"
what = "Lists every backup and replaces the current database with the chosen one"
why = "Recover the data when the database is damaged, missing or must go back"
changes = "work/db/lab2shot.db; the previous database moved to work/db/lab2shot.db.replaced-<time>, not deleted"

[cli.setup.step.db_upgrade]
label = "Upgrade the Database Version"
summary = "Upgrade the database to the version of this program (the service must be stopped)"
what = "Backs up first, then upgrades the database to the version of this program"
why = "Matches the database to the program after updating Lab2Shot; starting the service also does it"
changes = "work/db/lab2shot.db; a new pre-upgrade backup in work/db/backups/"

[cli.setup.step.db_claim]
label = "Claim the Work Folder for This Project"
summary = "Give the work folder to this project folder; services of other project folders can no longer use it"
what = "Changes the work folder's owner to this project folder"
why = "Processes of other project folders (other branches, test checkouts) can no longer open it"
changes = "The owner record in the work folder (owner.json)"

[cli.setup.step.status]
label = "Status Overview"
summary = "Service, administrator, passphrase, accounts, extensions, database and work folder (read-only)"
what = "Shows an overview of the service, the administrator password, the recovery passphrase, the number of accounts and extensions, the database and the work folder"
why = "See the overall state"
changes = "Nothing"

[cli.setup.group.g4]
label = "One-Click Update"
summary = "After stopping the service and pulling by hand, upgrade the local code; roll back and go online again on failure"

[cli.setup.group.g5]
label = "Installation and Environment"
summary = "Python dependencies, web interface, requirements, extension build and download settings, Hugging Face, manually downloaded files, extensions"

[cli.setup.group.g6]
label = "Service"
summary = "Network and port; start, restart and stop the service; choose the GPUs for computing"

[cli.setup.group.g7]
label = "Accounts and Security"
summary = "Administrator password, recovery passphrase (the service must have started once)"

[cli.setup.group.g8]
label = "Settings"
summary = "Every setting of the admin page's Settings group, viewed and changed by the same pages"

[cli.setup.group.g9]
label = "Database"
summary = "Status, integrity check, backup, restore, version upgrade, claiming the work folder for this project"

[cli.setup.group.g10]
label = "Status Overview"
summary = "Overview of the service, administrator, database and work folder (read-only)"

# lab2shot gpus | color | inspect (cli/tools.py).
[cli.tools.gpus]
help = "List the GPUs with their UUIDs, marking those that take jobs (authorized on the admin page /admin)."
