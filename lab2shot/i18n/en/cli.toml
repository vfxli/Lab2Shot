ok.one = "categories: {templates} row in the templates tree, {menu} in the menu tree, {placed} nodes placed, {files} node text files"
ok.other = "categories: {templates} rows in the templates tree, {menu} in the menu tree, {placed} nodes placed, {files} node text files"

