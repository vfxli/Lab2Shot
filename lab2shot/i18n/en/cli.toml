proxy_ip_required = "The IP of the proxy machine is required."
question = "[bold]How is the server reached?[/bold]  (written to {file} by your choice; each value can be changed later in Settings → Network and Installation)"
no_change = "Change nothing"
difference_title = "② versus ③"
difference = "Both let other computers open Lab2Shot over HTTPS; they differ in who faces the users:\n  ② Lab2Shot faces the users itself: it serves HTTPS with a self-signed certificate and listens on every interface; each user's computer installs its root certificate once; it trusts no forwarding header (X-Forwarded-For, ...) and knows users by the address of the connection itself.\n  ③ Lab2Shot is behind a proxy: the proxy serves HTTPS with a proper certificate and users install nothing; Lab2Shot does not encrypt and takes the users' real IPs only from the trusted proxy's address (registration limits per IP, failed password counts and login records rely on it).\n     (a) The proxy is on this machine, or connections come through a tunnel such as frp on this machine: it listens on this machine only, so nobody can bypass the proxy; trusted proxy 127.0.0.1.\n     (b) The proxy is on another machine: it must listen on every interface for the proxy to reach it; the trusted proxy is that machine's IP only, and the firewall should let only that machine reach this port."
unchanged = "Nothing was changed."
names_hint = "Public names only go into Lab2Shot's self-signed certificate: press Enter when others use this computer's name or LAN IP; enter the other names (such as a domain from a tunnel service), separated by spaces."
