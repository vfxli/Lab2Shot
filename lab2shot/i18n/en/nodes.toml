[node.ensemble_camera]
subtitle = "Camera Ensemble"
description = "Combines the cameras several solvers found for one shot into one. Move the candidates into one base camera's world with Camera Space first. The judge is the shot's own Tracks (such as CoTracker spread over the whole shot): each track is triangulated through a candidate's cameras from half of its frames and reprojected into the other half (error in pixels), independent of every candidate; a candidate whose whole-shot error is over twice the best one's is not used. Objective: Robustness takes the one camera the tracks fit best over the whole shot; Accuracy picks, per stretch of 30 frames, the candidate the tracks fit best, cross-fading 5 frames either side of a switch; Smooth takes per frame the median orientation and the geometric median position of the candidates used. Without Tracks there is no judge and every objective takes the candidates' median. Each frame's lens is the one of the candidate its pose comes from (in the first candidate's filmback). Outputs the combined camera, a per-frame confidence, which candidate each frame came from and per-frame reprojection errors per candidate; the result is named from the solvers and the objective used, and its licence is the strictest of the candidates'. Measured (ViPE and COLMAP as candidates, 11 clips with ground truth, 5 held out): no objective passed (Robustness 30% worse than COLMAP on the held-out median), so no card uses it."
