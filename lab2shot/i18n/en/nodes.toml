[node.foreach_end]
subtitle = "For-Each End"
description = "The same node as Houdini's For-Each End: gathers the result of every item in the block and outputs a list; item names follow those from foreach_begin (name can change them). Connect one wire for each result an item should carry out; they are packed into one scene. Lists gathered by an inner block are flattened here, with item names written as \"outer/inner\". Items that fail or are skipped are left out of the list, and the node lists which ones."

