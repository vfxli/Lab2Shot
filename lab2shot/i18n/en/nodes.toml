[node.ensemble_normal]
subtitle = "Normal Ensemble"
description = "Combines the normals of several models per pixel on the unit sphere. The candidates must be in one space (all camera or all world); candidates from one model (MoGe's own normals and the normals of MoGe's depth) count as one vote. Objective: Accuracy takes the spherical median, leaves out at each pixel the candidates more than three spreads (at least 5°) from it and averages the direction of the rest by weight; Robustness takes the spherical median itself, which no single far-off candidate can pull. Measured (12 clips with ground truth, 7 tuning, 5 held out): neither objective passed (held-out median angular error only 1–2% better than the best single model, MoGe, with one clip more than 5% worse), so no card uses it. A candidate whose Region is People (such as Sapiens2, which only knows people) takes part only inside People Region. Outputs the combined normals, a confidence map, which candidate each pixel is closest to and per-frame angles of each candidate to the result; the result's layer name is made from the models and the objective used, and its licence is the strictest of the candidates'."
