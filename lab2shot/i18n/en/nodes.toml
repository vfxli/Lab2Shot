[node.lock_focal]
subtitle = "Lock Focal Length"
description = "Solved camera → a camera with a constant focal length and position and orientation re-solved per frame, plus a before/after comparison curve. Machine-learning solvers estimate focal length per frame; when the focal length jitters, they compensate by pushing the camera back and forth along the lens axis (a dolly zoom), so just setting focal length to a constant without moving the camera makes the image stop lining up. This node re-solves the position too: connect a point cloud (the point cloud output of the solve node) as an anchor; also connect the 2D Tracks from the same node to use real image observations, which is more reliable. Use it for prime lenses; don't lock a real zoom lens."

[node.lock_focal.param.focal_mm]
placeholder = "Auto"

[node.lock_focal.param.filmback_mm]
placeholder = "36"

[node.lock_focal.port.points]
help = "3D points used as anchors: the Point Cloud output of the solve node, or 3D Tracks"

[node.lock_focal.port.tracks]
help = "Image observations from the same node as Point Cloud, matching it one to one. When connected, real observations replace \"positions projected by the original camera\""

[node.lock_focal.port.curves]
label = "Before/After"
waits = ""

[node.logic]
