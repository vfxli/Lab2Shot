label = "Result"

[node.gate]
subtitle = "Gate"
description = "A switch on one wire: with Pass checked, the incoming data passes through unchanged; unchecked, it blocks: it does not fetch its input, the whole upstream is not cooked, and it and the downstream nodes that depend only on it show \"Skipped (blocked)\" with no error or warning. Optional inputs downstream, one wire of a multi-input, and the row connected to it in output, merge, make_list or exr.output are treated as unconnected (exr.output leaves no empty layer). When building a template, expose Pass as a checkbox so users can turn off a feature branch with one click; to toggle several branches together, connect one value_toggle node to each of their Pass inputs; for two mutually exclusive branches (one on, the other off), turn on Invert on one of them."

[node.gate.param.through]
label = "Pass"

[node.gate.param.invert]
label = "Invert"

[node.has_data]
subtitle = "Has Data"
description = "Asks whether the connected wire carries anything this time and outputs a boolean: an empty upstream, one closed by gate, or a read with no file selected (and switch or gate nodes that only pass those along) gives No; everything else gives Yes. It only checks presence and never fetches content, so upstream is not cooked for it; the answer is known before cooking, so connected to the Select Input of switch or the Pass of gate, the path is decided before submission. In templates, use it for \"use it if uploaded, otherwise take another path\", for example inbetween when a reference motion is uploaded, and pure generation otherwise."

