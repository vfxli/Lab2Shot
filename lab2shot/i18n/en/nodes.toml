[node.lens_distortion]
subtitle = "Lens Distortion"
description = "One lens → two ST maps: an undistort one (straightens the original plate onto an overscanned canvas with the principal point at the canvas center) and a distort one (puts canvas-sized CG back onto the original plate). It does not touch pixels: whichever map you use to warp an image, connect it to stmap: the source image goes into the Source of stmap, and the ST map from here goes into its ST Map. The lens is entered on the node: choose a lens model (the three 3DE ones match the 3DE lens sheet exactly, the three OpenCV ones come from calibration tools) and enter the coefficients, focal length and aperture from the lens sheet; for lenses solved by COLMAP / AnyCalib / GeoCalib, connect three wires: Focal Length, Aperture and Lens Intrinsics (choose the same lens model on both sides). When the production supplies ready-made ST map files you don't need this node: connect that map to stmap. The same goes for zoom lenses: connect the per-frame ST map sequence baked by 3DE, since the lens sheet here is a fixed set of values and cannot describe a zoom."

