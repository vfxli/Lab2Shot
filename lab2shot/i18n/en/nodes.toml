[node."image.output"]
subtitle = "Image Sequence Output"
description = "Images, or data images such as depth, position and mask maps → an image sequence, one file per frame, frame numbers unchanged (data images are written as EXR as-is, with no color conversion and unaffected by the format settings here). When writing EXR, channels are named by the convention of whatever you enter in Layer: motion writes Nuke's standard forward.u/v, backward.u/v (ready to use in VectorBlur and IDistort; not NukeX's SmartVector, whose file format is not public and can only be written by NukeX's SmartVector node, the only thing VectorDistort accepts), depth writes depth.Z, and empty uses our own R G B A. Single channels connect to the four inputs R, G, B and A: whichever input a wire goes to is the channel it is written as, and unconnected inputs produce no channel (connect a matte's alpha to A and the EXR has only A; when Image is connected along with them, Image is the base and the separately connected channels replace theirs). This node only sets the name and format; files are actually written when it is connected to output. To write several results into one EXR, use exr.output."

