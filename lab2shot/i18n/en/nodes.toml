[node.logic.port.value]
label = "Result"

[node.make_list]
subtitle = "Make List"
description = "Combines several pieces of the same data type into one list to cook together with foreach_begin: names go one per line in wiring order; empty ones use the name from an upstream name node, and failing that are numbered 1, 2, 3. The name is the hierarchy name when written and the folder name on delivery."

[node.make_list.param.names]
label = "Names"
placeholder = "In order, comma-separated"

[node.make_list.port.items]
label = "Items"

[node.mask_adjust]
subtitle = "Mask Adjust"
description = "Equivalent to Nuke's Dilate / Erode followed by Blur and Invert: grows or shrinks, feathers and inverts a mask, in that order. Any mask can be connected: leave margin for matting, remove fringes, turn \"person\" into \"everything but the person\"."

[node.mask_adjust.param.grow]
label = "Grow/Shrink"

[node.mask_adjust.param.feather]
label = "Feather"

[node.mask_adjust.param.invert]
label = "Invert"

[node.mask_from_boxes]
subtitle = "Person Boxes to Mask"
description = "Person boxes → a mask that is 1 inside the boxes (original image size). Person boxes from any detection node can be connected: feed nodes that need mask guidance such as SAM 3 and MatAnyone, or exclude people from depth_align and point clouds. For masks that follow the silhouette use a segmentation or matting node; this one gives rectangles."

[node.mask_from_boxes.param.ids]
placeholder = "All"

[node.mask_from_confidence]
subtitle = "Confidence to Mask"
description = "Confidence → mask: pixels with confidence above Confidence Threshold are 1, Soft Edge ramps near the threshold, and choosing Doubtful in Region inverts it. Confidence is the model's own score, not a mask: to exclude uncertain areas, or track and align only where reliable, go through this node first. Any confidence can be connected (depth maps, camera and depth, motion vectors, dense correspondence)."

[node.mask_from_confidence.param.keep]
label = "Region"

[node.mask_from_confidence.param.keep.option]
trusted = "Trusted"
doubtful = "Doubtful"

[node.mask_from_depth]
subtitle = "Depth to Mask"
description = "Depth map → a mask keyed by distance: pixels whose distance from the camera is between Near and Far are 1, with edges falling off by Soft Edge. Any depth map can be connected; for depth maps that need manual scaling, enter values in their own units (not real centimeters), or connect depth_align first to enter real distances."

[node.mask_from_depth.param.near]
label = "Near"

[node.mask_from_depth.param.far]
label = "Far"
placeholder = "Infinity"

[node.mask_from_depth.param.include_empty]
label = "Include Empty Pixels"

[node.mask_from_segments]
subtitle = "Segmentation to Mask"
description = "Segmentation → the selected classes combined into one mask: certain objects from SAM 3, hair or hands from Sapiens2. Any segmentation node can be connected; after upstream has cooked, click class names in the parameters, or click regions of the image in the 2D view."

[node.mask_from_segments.param.classes]
label = "Classes"
placeholder = "All objects"

[node.mask_from_segments.param.picks]
label = "Picks"
placeholder = "Click the regions you want in the 2D view"

[node.mask_from_segments.port.segmentation]
label = "Segmentation"

[node.mask_merge]
subtitle = "Mask Merge"
description = "Two masks → one mask: Union (A or B), Subtract (A minus B), Intersect (in both A and B). Any masks can be connected, for example people from SAM 3 plus the subject from BiRefNet, or the full frame minus person boxes."

[node.mask_merge.param.mode.option]
union = "Union"
subtract = "Subtract"
intersect = "Intersect"

[node.mask_merge.port.a]
label = "Mask A"

[node.mask_merge.port.b]
label = "Mask B"

[node.math]
subtitle = "Math"
description = "Computes one value from several: add, subtract, multiply, divide, minimum, maximum, round, absolute value, in wiring order. Incoming values are converted to the unit chosen in Unit; if they cannot be converted, an error explains why. Integer Result is the same rounded to the nearest whole number, for wiring into an integer parameter (a radius in pixels, a frame count)."

[node.math.param.operation.option]
add = "Add"
subtract = "Subtract"
multiply = "Multiply"
divide = "Divide"
min = "Minimum"
max = "Maximum"
round = "Round"
abs = "Absolute"

[node.math.param.unit.option]
cm = "cm"
m = "m"

[node.math.port.values]
label = "Values"

[node.math.port.value]
label = "Result"

[node.math.port.integer]
label = "Integer Result"

[node.merge]
subtitle = "Merge"
description = "The same node as Houdini's Merge (SOP) and Nuke's Scene: geometry, cameras, point clouds, curves, skeleton animation and skinned characters → merged into one scene, transformed and grounded together. Writing files does not need it: format output nodes take multiple wires themselves; it can also take a list of scenes, each placed under /shot/<item name>. Data with different frame counts is aligned by frame number; if two pieces of data share a name (every camera is called camera), submission is blocked; give each a name with name."

[node.merge_items]
subtitle = "Merge List"
description = "Merges a list back into one piece of data, any list will do: several people's person boxes into one multi-person set, scenes cooked one by one into one scene (each placed under /shot/<item name>), and likewise for tracks and segmentation. The opposite of split_items."

[node.motion_warp]
subtitle = "Motion Vector Warp"
description = "The same node as Nuke's IDistort (UV from forward / backward): image + motion vectors → the next (or previous) frame pulled onto this frame, each pixel sampling where it moved to in the neighboring frame. Use it to check motion vector accuracy (subtract from this frame), push a neighboring frame's mask or paint fix by one frame, or for temporal denoising; images, masks and depth maps can all be warped and keep their original type. To jump to a reference frame in one step, use stmap_from_motion."

[node.motion_warp.param.direction]
label = "Sample Frame"

[node.motion_warp.param.direction.option]
next = "Next Frame"
previous = "Previous Frame"

[node.motion_warp.port.image]
label = "Result"

[node.name]
subtitle = "Name"
description = "The same node as Houdini's Name (SOP): gives data a name used when writing and delivering: scenes go under /shot/<name>, lists are renamed item by item as \"name_index\", and other data records the name on itself, used when foreach_end gathers. Use it to separate two pieces of data with the same name; nothing renames them behind your back."

[node.normal_from_depth]
subtitle = "Depth to Normal"
description = "Depth map + camera → the surface normal of each pixel (normal map). Any depth map node can be connected, including depth maps that need manual scaling (normals are scale-independent); use it to add normals to depth methods without a normal output and to aligned depth maps. To convert normals between camera space and world space, use normal_space."

[node.normal_space]
subtitle = "Normal Space"
description = "Normal map + camera → a normal map converted to another space, using the camera's orientation on every frame. Any normal map can be connected (MoGe, Sapiens2, Cosmos DiffusionRenderer, normal_from_depth); world-space normals let you relight in Nuke with a fixed light direction that stays correct however the camera moves."

[node.normal_space.param.space]
label = "Convert To"

[node."nuke.output"]
subtitle = "Nuke Camera Output"
description = "Camera → a Nuke Camera3 node (.nk text): per-frame position, orientation, focal length and aperture written as animation curves, in centimeters with Y up, matching Nuke's camera. \"Copy to Nuke\" on the node copies this text; paste it into your comp, or use File → Import Script in Nuke. Camera3 is a pinhole camera; lens distortion stays in the data and is added back in comp with an ST map. To bring the camera into other 3D software, use a 3D scene format output node."

[node.occlusion_from_motion]
subtitle = "Occlusion Mask"
description = "Motion vectors → two masks: Occluded is the pixels in this frame that will be covered or leave the frame in the next frame, and Revealed is the pixels not visible in the previous frame that only appear in this one. It performs a forward-backward consistency check, and any motion vectors can be connected; when pushing frames or propagating paint, these areas cannot be taken from neighboring frames and must be fixed by hand."

[node.occlusion_from_motion.port.occluded]
label = "Occluded"

[node.occlusion_from_motion.port.revealed]
label = "Revealed"

[node.orientation_field]
subtitle = "Orientation Field"
description = "An image → the direction the texture runs at each pixel, and how reliable that estimate is (two channels: angle, confidence). A bank of Gabor filters at different angles sweeps the image, and the angle with the strongest response is the direction. Works for thin, elongated textures such as hair, fur, fabric weave and brush strokes; hair strand solving projects use it as input. Direction has no sign (up-left and down-right are the same direction), so angles are only within 0-180°, and you cannot compare them by subtracting. Each angle uses a quadrature pair (one even-phase and one odd-phase copy of the same kernel, taking the energy), which is the standard definition of Gabor energy. The implementation common in hair strand solving projects uses only the even-phase kernel (upstream example: utils/vision.py in the HairGS repository; we have not integrated that project), whose response periodically crosses zero with the stripe phase, and taking the maximum at zero crossings is a coin toss. Measured per pixel on USC-HairSalon ground truth: the quadrature pair gives a mean angle error of 10.19° and median 4.13°, the even kernel alone 14.46° / 6.54°, so the quadrature pair is used here; if your numbers differ from upstream, this is where the difference comes from."

[node.orientation_field.param.period]
label = "Texture Period"

[node.orientation_field.param.reach]
label = "Sample Radius"

[node.orientation_field.param.angles]
label = "Angles"

[node.orientation_field.param.angles.option]
90 = "90 Steps"
180 = "180 Steps"
360 = "360 Steps"

[node.orientation_field.port.image]
label = "Image"

[node.orientation_field.port.mask]
help = "Measure orientation only inside this region; confidence outside is 0. Confidence is normalized by the most concentrated pixel in the whole image; with a mask it is normalized only within the mask, so background clutter does not drag down the subject's confidence"

[node.orientation_field.port.orientation]
label = "Orientation Field"
help = "The first channel is the direction in degrees, 0-180; the second is confidence, 0-1. The angle measures the run of the texture itself"

[node.output]
subtitle = "Output"
description = "An \"XX Output\" node plus this one together are equivalent to a Nuke Write (in Nuke one node both sets the format and writes the file; we split it into two): files written by format output nodes → one package or folder delivered: one subfolder per format output node, named after it (depth/depth.1001.exr, scene/scene.usd). You need it to write files; a node network can have several, each delivering to a different place."

[node."ply.import"]
subtitle = "Import PLY"
description = "Imports PLY (.ply) exported by scanning or photogrammetry (RealityCapture, Metashape, COLMAP): the vertices are a point cloud (with colors if present), and if there are faces it is also geometry. PLY does not record units or up axis, so set them in Unit and Up Axis."

[node."ply.import".param.unit.option]
cm = "Centimeters"
m = "Meters"

[node."ply.import".port.models]
waits = "Pick a geometry"

[node."ply.import".port.points]
waits = "Pick a point cloud"

[node."ply.import".port.gaussians]
waits = "Pick a Gaussian splat"

[node."ply.import".fact.models]
kinds = "Selected Geometry"

[node."ply.output"]
subtitle = "Point Cloud PLY Output"
description = "Point cloud → PLY (x y z plus red green blue colors): read directly by MeshLab, CloudCompare, Open3D, Houdini and others. Point transforms are baked into the positions; point clouds that change per frame are written per frame. For USD delivery use usd.output (colors are written to displayColor). This node only sets the name; files are actually written when it is connected to output."

[node."ply.output".param.unit.option]
cm = "Centimeters"
m = "Meters"

[node."ply.output_gaussian"]
subtitle = "Gaussian Splat PLY Output"
description = "Gaussian splats → Inria-format PLY (position, scale, rotation, opacity, spherical harmonic colors): the common exchange format of the Gaussian splat ecosystem, read directly by splat viewers and DCC splat plugins. Transforms are baked into positions and covariances, and spherical harmonics are rotated along; dynamic objects are written per frame. For USD delivery use usd.output (splats are kept as-is in USD). This node only sets the name; files are actually written when it is connected to output."

[node."ply.output_gaussian".param.unit.option]
cm = "Centimeters"
m = "Meters"

[node.pointcloud_fuse]
subtitle = "Point Cloud Fuse"
description = "Fuses the per-frame point clouds of a whole shot (or per-frame depth + camera) into one static global point cloud, merging the many points repeated between frames. Connecting Per-Frame Point Cloud uses voxel stitching: points from all frames are combined and each voxel keeps only one centroid. Connecting Depth Map uses TSDF fusion: each frame's depth is back-projected into a voxel grid accumulating signed distances, and points are interpolated at the surface zero crossings, giving higher quality and stronger denoising. Both use Voxel Size to control how aggressively duplicates are removed. With depth, also connect Image and each point takes the color of the pixel and frame it came from (averaged per voxel during fusion); without it, points are shaded by distance. With per-frame point clouds, colors come with the point cloud."

[node.pointcloud_fuse.param.voxel_size]
label = "Voxel Size"

[node.pointcloud_fuse.param.truncation]
label = "Truncation Distance"

[node.pointcloud_fuse.param.color]
label = "Keep Color"

[node.pointcloud_fuse.port.depth]
help = "Per-frame depth maps (real scale), fused with Camera into a global point cloud by TSDF."

[node.pointcloud_fuse.port.image]
label = "Image"
help = "Point cloud colors come from this image: each point takes the color of the pixel and frame it came from, averaged per voxel during fusion. Without it, points are shaded by distance: near is bright, far is dark. With Per-Frame Point Cloud, colors come with the point cloud."

[node.pointcloud_fuse.port.camera]
help = "The camera for the per-frame depth: depth is back-projected into 3D through it before fusion. Required when Depth Map is connected."

[node.pointcloud_fuse.port.points]
label = "Per-Frame Point Cloud"
help = "A point cloud that changes per frame (one per frame), all combined and deduplicated by voxel. Connecting it uses voxel stitching; connecting Depth Map uses TSDF fusion."

[node.pointcloud_fuse.port.points.output]
label = "Point Cloud"
help = ""

[node.pointcloud_fuse.cost]
whole = "fuses the whole shot at once"

[node.points_from_depth]
subtitle = "Depth to Point Cloud"
description = "Depth map + camera → one point cloud per frame (USD, cm). Connect Color to take colors from the image; without it, points are shaded by distance (near is bright, far is dark). Any depth map node and any camera can be connected; connect a mask to remove moving objects such as people and cars from the point cloud, and connect the confidence from the depth map node so uncertain points (edge streaks, sky, reflections) are left out. For the 3D position of every pixel, use position_from_depth."

[node.points_from_depth.port.image]
label = "Color"
help = "Point cloud colors come from this image. Without it, points are shaded by distance: near is bright, far is dark"

[node.points_from_depth.port.mask]
label = "Exclude"

[node.points_from_depth.port.confidence]
help = "Confidence from the depth map node: points below Confidence Threshold are left out (where the model itself is unsure: flying points trailing off object edges, sky, reflections)"

[node.points_from_tracks]
subtitle = "Tracks to 3D"
description = "2D tracks + depth map + camera → 3D tracks (an animated point cloud with IDs, visibility and velocity, in cm): on each frame where a point is visible, it takes the depth map value under it and places it in the camera's world; frames where it is occluded are filled in between the visible positions before and after. Any 2D tracks (CoTracker3, TAPNext++, AllTracker, the four corners from WOFTSAM), any depth map and any camera can be connected; in Houdini, 3D tracks serve as locators for pinning CG props."

[node.points_from_tracks.port.image]
label = "Color"

[node.position_from_depth]
subtitle = "Depth to World Position"
description = "Depth map + camera → the 3D position of every pixel (position map, cm, three-channel EXR). Any depth map node and any camera can be connected; the depth map and camera from the same solve node always line up. In Nuke, position maps are used for relighting, projection and position-based mattes. For normals use normal_from_depth; for point clouds use points_from_depth."

[node.premultiply]
subtitle = "Premultiply"
description = "Equivalent to Nuke's Copy followed by Premult: image + mask → an image with alpha, using the mask as alpha and multiplying the colors by it (premultiplied). Connect matting and segmentation results (BiRefNet, MatAnyone 2, SAM 3...) here to deliver EXR (premultiplied) or PNG with alpha; the image's original alpha is replaced by this mask. The result is in the rendering space (sRGB-encoded Rec.709, same as the image); when a format output node writes EXR, it is converted to the delivery color space (ACEScg by default, following the unpremultiply, convert, premultiply rule)."

[node.premultiply.port.image.output]
label = "RGBA"

[node.rasterize_geometry]
subtitle = "Rasterize Geometry"
description = "Scene (people, meshes, point clouds) + camera → the mask (silhouette), depth map (cm) and normal map seen from the camera, at the original image size. Any solved people and any imported geometry and point clouds can be turned back into 2D: masks for matting nodes, depth and normal maps for comp, or to compare against the results of depth map methods."

[node.rasterize_geometry.param.width]
placeholder = "From camera"

[node.rasterize_geometry.param.height]
placeholder = "From camera"

[node.rasterize_geometry.param.space]
label = "Normal Space"

[node.resample]
subtitle = "Resample"
description = "The same node as Houdini's Resample: curves → curves each resampled by equal arc length to a fixed number of points. Hair strands and fur guides often have hundreds of points each; reducing them to a few dozen before handing off to a DCC or writing files keeps the shape and makes files much smaller; more points than the original means densifying. Per-point attributes such as width, color and orientation are resampled along with the points. Every curve gets the same number of points, matching Houdini's Resample to a fixed segment count."

[node.resample.param.per_curve]
label = "Points per Curve"

[node.resample.param.per_curve.option]
8 = "8"
16 = "16"
24 = "24"
32 = "32"
48 = "48"
64 = "64"
100 = "100"

[node.resample.port.curves]
waits = ""

[node.retarget]
subtitle = "Retarget"
description = "A skeleton animation (or a skinned character's motion) → transferred onto another skeleton, output as skeleton animation on the target hierarchy. Like Maya HumanIK and Unreal IK Retargeter: body parts are matched in Mapping (click a joint on each side in the viewport to link them; unmapped ones are matched by name and hierarchy), rest poses (T-pose or A-pose) are aligned, then motion is transferred; when spine, neck or finger joint counts differ, bending is spread by bone length not piled onto one or two. Horizontal translation follows the motion 1 : 1 (the character steps where the person in the plate does); hip height is raised by Hip Height From (legs / height / arms / none) × Hip Height Scale, with Hip Height Mode choosing Lift over the Feet (stairs, jumps, sitting) or Proportional (flat ground); soles are aligned automatically, plus optional Height Offset; bone lengths and scale come from the target. If either side lacks hips and both have hands (HaMeR hands, hand-only rigs), only hands are mapped: aligned by wrist and fingers, the wrist follows 1 : 1, and hip height settings are ignored. Character Scale scales the whole character by height or a manual factor before hip height. Only Target's skeleton is used, so a one-frame character (standard_human, a fresh rig) is enough. To see skinning, connect bone_deform; to deliver the skeleton, connect fbx.output / usd.output."

[node.retarget.param.rest_fix]
label = "Rest Pose Correction"

[node.retarget.param.rest_fix.option]
none = "None"
tpose = "Auto T-Pose"

[node.retarget.param.size_by]
label = "Character Scale"

[node.retarget.param.size_by.option]
none = "None"
height = "Auto by Height"
manual = "Manual Factor"

[node.retarget.param.size]
label = "Scale Factor"

[node.retarget.param.scale_by]
label = "Hip Height From"

[node.retarget.param.scale_by.option]
legs = "Leg Length"
height = "Height"
arms = "Arm Length"
none = "No Scaling (1 : 1)"

[node.retarget.param.scale]
label = "Hip Height Scale"
placeholder = "1"

[node.retarget.param.height_mode]
label = "Hip Height Mode"

[node.retarget.param.height_mode.option]
lift = "Lift over the Feet (Stairs, Jumps, Sitting)"
proportional = "Proportional (Flat Ground Only)"

[node.retarget.port.target]
help = "Who the motion goes onto: your own character or skeleton; only its skeleton and bind pose are used, and one frame is enough"

[node.retarget.port.motion]
help = "Where the motion comes from: a skeleton animation (an imported BVH, generated motion, a solved person), or another character"

[node.retarget_expression]
subtitle = "Retarget Expression (ARKit52)"
description = "An expression performance → applied to another character's blend shapes, outputting a skinned character with animated expressions. Expressions takes the Expression Curves from a face solve (52 ARKit curves from MediaPipe, FLAME expressions from SMIRK / Pixel3DMM), or a character with expression animation; Target takes a character with blend shapes (ARKit shapes from Character Creator / AccuRIG, MetaHuman, FLAME characters all work; one frame is enough, and body animation is fine too, joint animation is kept as-is). Names on both sides are matched in Mapping: the same editor as retarget, with the humanoid diagram replaced by expression slots grouped by brows, eyes and mouth; ARKit names are recognized automatically regardless of case, underscores, L / R or Left / Right, and anything unrecognized is clicked manually. Weights are copied as-is (0..1), and target shapes left unmapped stay at 0. FLAME's expression_00... are statistical components, not specific actions, and only match FLAME characters that carry the same components."

[node.retarget_expression.param.source_skeleton]
label = "Expression Skeleton"
placeholder = "First one with expressions"

[node.retarget_expression.port.target]
help = "Whose face the expressions go onto: a skinned character with blend shapes (one frame is enough; body animation is fine too)"

[node.retarget_expression.port.expressions]
label = "Expressions"
help = "Where the expressions come from: the Expression Curves from a face solve (ARKit 52 from MediaPipe, FLAME from SMIRK / Pixel3DMM), or a character with expression animation"

[node.retarget_post]
subtitle = "Retarget Post-Process"
description = "The third stage of learned retargeting: applies translation explicitly on top of the solver's raw result: the horizontal trajectory follows the source motion 1 : 1 and hip height is converted by the leg length ratio and sole difference of both sides, or the model's trajectory is kept; Height Offset can be added. It changes the animation curves of the hip bone, not an outer transform. Body parts and rest poses come from retarget_prepare. For grounding, connect auto_ground."

[node.retarget_post.param.root_motion]
label = "Root Motion"

[node.retarget_post.param.root_motion.option]
source = "Follow Source (Leg Length Corrected)"
model = "Keep Model (Uncorrected)"

[node.retarget_post.param.stride]
label = "Horizontal Translation"

[node.retarget_post.param.stride.option]
legs = "Scale by Leg Length (No Sliding)"
plate = "Match Plate (Fit Position in Video)"

[node.retarget_post.port.skeleton]
label = "Solver Result"

[node.retarget_post.port.skeleton.output]
label = "Skeleton Animation"

[node.retarget_prepare]
subtitle = "Retarget Prepare"
description = "The first stage of learned retargeting: in the viewport, set the body part mapping between the two skeletons, the rest poses on both sides (initial pose alignment) and the bones not sent to the solver. Each of the three has an \"Auto\"; results are written into the parameters where you can see and edit them, and if you change nothing the automatic results are used. It outputs Source and Target unchanged, with annotations written on their respective USD skeletons; animation and bind poses are untouched. Connect it to solvers such as STaR / MeshRet / SATA / Kinematic Refinement."

[node.retarget_prepare.param.motion_ignore]
label = "Ignored Motion Bones"

[node.retarget_prepare.param.target_ignore]
label = "Ignored Target Bones"

[node.retarget_prepare.param.ignore_rule]
label = "Ignore Rule"

[node.retarget_prepare.param.motion_scale]
label = "Motion Size"
placeholder = "Auto"

[node.retarget_prepare.param.target_scale]
label = "Target Size"
placeholder = "Auto"

[node.retarget_prepare.param.auto_record]
label = "Auto Record"

[node.retime]
subtitle = "Retime"
description = "The same thing as Nuke's TimeOffset plus Retime and Houdini's Time Shift, combined in one node because they all answer \"which frame maps to which frame\". Scene → frame numbers shifted as a whole, or frames resampled at a speed. This is the only node in the whole network that changes frame mapping, and what it changed is shown on the node. Speed is the \"speed\" on Nuke's Retime: how many frames advance per frame, with in-between frames interpolated (to fit 30-frame mocap into a 24-frame shot, set Speed to 1.25 = 30 ÷ 24)."

[node.retime.param.offset]
label = "Offset"

[node.retime.param.speed]
label = "Speed"

[node.retime.param.anchor]
label = "Anchor Frame"
placeholder = "First frame"

[node.retime.fact]
speed_changes = "Speed Is Not 1"

[node.select_item]
subtitle = "Select Item"
description = "Takes one item from a list to cook downstream: by index (counting from 1) or by name. To cook every item, use foreach_begin."

[node.select_item.param.by]
label = "By"

[node.select_item.param.by.option]
index = "Index"
name = "Name"

[node.select_item.param.index]
label = "Index"

[node.select_people]
subtitle = "Select People"
description = "Person boxes → person boxes with only the selected people: connect to a solver's Person Boxes input, and it solves as many people as you select. Select by the most prominent one, the top few, all, IDs, or by clicking people in the 2D view; place it after a detection node to decide who gets solved this time."

[node.select_people.param.mode]
label = "Select"

[node.select_people.param.mode.option]
largest = "Largest"
top = "Top N"
all = "All"
ids = "IDs"
picked = "Picked"

[node.select_people.param.count]
label = "Count"

[node.select_people.param.ids]
placeholder = "1,3"

[node.select_people.param.picks]
label = "Picks"
placeholder = "Click people in the 2D view"

[node.split_camera]
subtitle = "Split Camera"
description = "Camera → a set of values: focal length, aperture (mm), per-frame position (cm) and rotation (degrees, XYZ order). Connect them to the parameter inputs of other nodes: a 3DE camera's focal length to MoGe, rotation to a body solver, position to camera."

[node.split_camera.param.per_frame]
label = "Per Frame"

[node.split_camera.port.translate]
label = "Position"

[node.split_camera.port.rotate]
label = "Rotate"

[node.split_camera.port.filmback]
help = ""

[node.split_grid]
subtitle = "Split Grid"
description = "An image laid out as a grid → a sequence with one cell per frame (Nuke's ContactSheet in reverse). Storyboard sheets, texture sheets and contact sheets that tile a motion into one image can all be split and then processed downstream as a sequence. It purely cuts pixels: no scaling, no color change, and the pieces keep their original type (images, masks, depth maps all work)."

[node.split_grid.param.rows]
label = "Rows"

[node.split_grid.param.cols]
label = "Columns"

[node.split_grid.param.order]
label = "Order"

[node.split_grid.param.order.option]
row = "Rows First"
col = "Columns First"

[node.split_grid.param.margin]
label = "Margin"

[node.split_grid.port.image]
label = "Grid Image"

[node.split_grid.port.image.output]
label = "Image"

[node.split_items]
subtitle = "Split to List"
description = "Splits data containing several entries into a list, one per item: person boxes by person (person_01...), scenes by the groups under /shot, 2D tracks by group, segmentation by object. Connect it to foreach_begin to cook each person or object separately."

[node.split_scene]
subtitle = "Split Scene"
description = "Scene → 3D data separated by kind: cameras, geometry, point clouds, curves, skeleton animation and skinned characters each become an output, all in their original positions (parent transforms included). Use it for format output nodes that can only write certain kinds (some formats have no bones, some no point clouds), or to hand over just the people; kinds missing from the scene come out empty, with a note on the node. To take one item from a list of scenes, use select_item."

[node.split_scene.port.curves]
waits = ""

[node.standard_human]
subtitle = "Standard Human"
description = "A generic T-pose human with skinning and a skeleton, needing no footage. Skeleton-only results (motion generation, mocap cleanup, imported BVH) show as just a few lines in the viewport; connect retarget (Target from this node, Motion from that skeleton animation) and then bone_deform (skeleton animation from retarget, Skinned Character also from this node) to see skin deformation. Bone names and joint axes match exactly those of people output by the solvers, recognized by both retarget and HumanIK; the body is the SMPL-X neutral shape (you need to register and download that model file yourself)."

[node.standard_human.param.skeleton]
label = "Skeleton"
placeholder = ""

[node.standard_human.param.skeleton.option]
smplx = "SMPL-X (22 Joints)"

[node.standard_human.param.height_cm]
label = "Height"
placeholder = "Model's 172"

[node.standard_human.licence]
note = "The SMPL-X skeleton uses the SMPL-X neutral body: its model files are downloaded by each person after registering at smpl-x.is.tue.mpg.de (Manual Downloads on the Extensions admin page), non-commercial, for non-commercial research, teaching and art projects only, no redistribution. The other skeletons come with the extension that brings them, under that extension's licence. The node itself carries no model data."

[node.stmap]
subtitle = "STMap"
description = "The same node as Nuke's STMap: source image + ST map → the result resampled by the ST map, each output pixel sampling the source at the position the ST map points to. With AnyCalib's undistort ST map it undistorts, with the distort ST map it distorts (putting CG renders back onto the plate); when the source is a single frame (paint fixes or textures drawn on a reference frame) and the ST map is per frame (AllTracker, stmap_from_motion), the image is applied to every frame. Images, depth maps, normal maps, masks and segmentation can all be warped and keep their original type. It knows nothing about lenses and adds no tags to the result (same as Nuke's STMap): for undistort or distort that accounts for canvas and overscan, bake an ST map with lens_distortion and connect it here."

[node.stmap.port.image]
label = "Result"

[node.stmap_from_motion]
subtitle = "Motion Vectors to ST Map"
description = "Motion vectors → an ST map per frame pointing back to the reference frame, chaining the per-frame vectors frame after frame (the same idea as Nuke's SmartVector propagation). Paint once on the reference frame (paint fixes, tattoos, textures) and apply it to the whole shot with stmap; Valid Region is the pixels that can be traced all the way back to the reference frame (those ever occluded or out of frame are 0). The longer the chain, the larger the error: for hundreds of frames without drift, use the ST map given in one step by alltracker.track."

[node.switch]
subtitle = "Switch"
description = "The same node as the Switch in Nuke and Houdini: takes only one path, chosen by Select Input: without a wire it uses its value (1 = first input, 2 = second input...); when its input has a wire, the wire decides: a boolean on takes the first input and off the second, an integer picks that input. It starts with two inputs; for more, click the \"+\" at the end of the inputs or drag a wire onto \"+\", up to ten; each input's name can be changed by double-clicking on the node, and in the Inputs table of the parameter pane you can remove and drag to reorder them (input numbers follow the table order). If Select Input exceeds the number of inputs, this is pointed out before cooking. The path not taken is not cooked at all, with no error and not counted as skipped. All inputs must carry the same data type. When building a template, to let users choose an input by name: expose Select Input and, in \"Edit Interface...\" in the parameter pane, display it as a dropdown, filling in each entry's value and name (for example 1 = use solved camera, 2 = use your own camera); to share one choice among several switches, connect one value_int node to each of their Select Input."
row = "Input"

[node.switch.param.which]
label = "Select Input"
placeholder = "1 = first input"

[node.switch.param.ways]
label = "Inputs"

[node.switch.param.ways.field.name]
label = "Port"

[node.switch.param.ways.field.label]
label = "Display Name"

[node.switch.port.a]
label = "Input 1"

[node.switch.port.b]
label = "Input 2"

[node.switch.port.c]
label = "Input 3"

[node.switch.port.d]
label = "Input 4"

[node.switch.port.e]
label = "Input 5"

[node.switch.port.f]
label = "Input 6"

[node.switch.port.g]
label = "Input 7"

[node.switch.port.h]
label = "Input 8"

[node.switch.port.i]
label = "Input 9"

[node.switch.port.j]
label = "Input 10"

[node.time_shift]
subtitle = "Time Shift"
description = "Like Houdini's Time Shift and Nuke's FrameHold: a sequence → one of its frames. Everything connected after it sees that frame. Place it before solvers that only take a single frame (such as environment light probes) to choose the frame yourself, keeping frame picking and solving in two separate nodes. Empty means the start frame; a frame number means that frame."

[node.time_shift.param.frame]
label = "Frame"
placeholder = "Start frame"

[node.time_shift.port.image]
label = "Image"

[node."tracks.output"]
subtitle = "2D Tracks Output"
description = "2D tracks → a 3DEqualizer 2D points file (import into 3DE for camera solving), CSV (readable by Nuke, Houdini and scripts), a Nuke Tracker node (one track per point), or four points (the corners of a plane) written as a Nuke CornerPin2D node (screen replacements, sign replacements). When writing a Nuke node, the node offers \"Copy to Nuke\"; once copied, it can be pasted into your comp. This node only sets the name and format; files are actually written when it is connected to output."

[node."tracks.output".param.format.option]
3de = "3DE"
cornerpin = "CornerPin"

[node."tracks.output".param.min_visible]
label = "Min Visible Frames"

[node.transform]
subtitle = "Transform"
description = "The same node as Houdini's Transform (SOP) and Nuke's TransformGeo: scene → the scene translated, rotated and scaled as a whole (cameras and people move together), in centimeters. What goes in comes out as the same kind (a camera stays a camera); to level automatically by the ground, use auto_ground."

[node.transform.param.translate]
label = "Translate"

[node.transform.param.scale]
label = "Scale"

[node."usd.import"]
subtitle = "Import USD"
description = "Imports USD (.usd / .usda / .usdc / .usdz) made in Maya, Houdini, Blender or 3DE: the cameras, geometry, point clouds, curves, skeleton animation and skinned characters in the file; whatever you select in the hierarchy is output. Units and up axis are converted to centimeters, Y up, according to the file's own settings, and parent transforms (including animation) are included. Only flattened files are accepted: USD that references, payloads or layers other files must be flattened in your DCC first (.usdz is a single file by itself and reads normally)."

[node."usd.import".port.camera]
waits = "Pick a camera"

[node."usd.import".port.characters]
waits = "Pick a skinned character"

[node."usd.import".port.skeletons]
waits = "Pick a skeleton animation"

[node."usd.import".port.models]
waits = "Pick a geometry"

[node."usd.import".port.points]
waits = "Pick a point cloud"

[node."usd.import".port.gaussians]
waits = "Pick a Gaussian splat"

[node."usd.import".port.curves]
waits = "Pick a curve"

[node."usd.import".port.fps]
help = "The frame rate recorded in the USD (timeCodesPerSecond). Connect it to the FPS of a motion model or a format output node to follow this file; if the file does not record it there is no value here, and that node uses its own setting"

[node."usd.import".fact.models]
kinds = "Selected Geometry"

[node."usd.output"]
subtitle = "USD Output"
description = "Writes 3D data as a USD file: geometry, cameras, point clouds, curves, skeleton animation and skinned characters are all written as-is, readable by Maya, Houdini and Blender. Scene can take several wires, or a list of scenes (each written under /shot/<item name>), packed into one scene before writing. Connect it to output to deliver."

[node."usd.output".param.format.option]
usd = "Binary .usd"
usda = "Text .usda"

[node."usd.output".param.unit.option]
cm = "Centimeters · Maya"
m = "Meters · Houdini"

[node.uv_from_position]
subtitle = "Canonical Position to UV"
description = "Canonical-space position map → UV map: the UV coordinate of each pixel on the model (two-channel EXR, 0-1), the same for a given point on every frame. The position map must be in the model's own coordinate system (such as the canonical coordinates from faceanything.face_maps): world and camera coordinates move with the shot, so the projected UVs would not be fixed, and this is blocked. Connect a mask to compute only the pixels inside it, and the projection extent is also based only on those pixels. In Nuke, the UV map is used with STMap for texturing; in Houdini and Maya, for texture transfer."

[node.uv_from_position.param.way]
label = "Projection"

[node.uv_from_position.param.way.option]
cylinder = "Cylindrical"
sphere = "Spherical"
plane = "Planar"

[node.uv_from_position.port.position]
help = "A position map in the model's own coordinate system (canonical coordinates): projection uses the bounding box of the whole shot, so UVs match on every frame"

[node.uv_from_position.port.mask]
help = "Compute UVs only on pixels inside the mask, and the bounding box is based only on those pixels (background outside the face is excluded)"

[node.value_float]
subtitle = "Float"
description = "Enter a decimal number and its unit here → a float value. Connect it to the input of any decimal parameter (focal length, aperture, strength...): fill it in once and share it among several nodes."

[node.value_float.param.unit.option]
cm = "cm"
m = "m"

[node.value_int]
subtitle = "Integer"
description = "Enter an integer and its unit here → an integer value. Connect it to the input of any integer or decimal parameter (frame numbers, counts, resolution...)."

[node.value_int.param.unit.option]
cm = "cm"
m = "m"

[node.value_string]
subtitle = "String"
description = "Enter some text here → a string value. Connect it to the input of any text parameter (person IDs, class names...)."

[node.value_toggle]
subtitle = "Toggle"
description = "Turn it on or off here → a toggle. Connect it to the input of any toggle parameter: switch it in one place and several nodes change together."

[node.value_vector]
