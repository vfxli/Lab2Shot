description = "Equivalent to building layers with Nuke's Shuffle / Copy and then a Write: several results → different layers of the same EXR, one file per frame. The Layers table has one row per input, stating which layer and which channels that wire is written to; top to bottom is the layer order. Default names follow the data type: image R G B, depth Z, normal R G B, position XYZ, mask A, ST map R G, segmentation written as Cryptomatte (hard edges: each pixel belongs to one object only), motion vectors written as Nuke's motion layer; both layer and channel names can be changed. In Nuke one Read gets everything; when read back with file, each layer keeps its original type, and data layers are always lossless 32-bit. Single-image layers (ST map, HDRI) written together with per-frame layers are included in every frame (Nuke requires the same layers on every frame of a sequence); if you only want one copy, connect it separately to image.output. This node only sets the name and format; files are written when it is connected to output."
