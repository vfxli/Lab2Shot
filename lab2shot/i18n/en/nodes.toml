[node.ensemble_matte]
subtitle = "Matte Ensemble"
description = "Combines the alphas of several matting models into one. An object check comes first: a candidate that draws a part more or less than the Object (the user's own selection, such as a SAM 3 point-picked first-frame mask) is left out for the shot; candidates sharing one rough mask (VideoMaMa on BiRefNet's) count as one vote; when the votes disagree on which object it is, the majority decides and a tie goes to whoever drew the Object most closely, the losers being left out of that frame; the rest are averaged by weight. Objective: Accuracy checks the object more loosely (not passed); Robustness more strictly (measured: no wrong object on any of 117 clips, frame-to-frame stability 8% better than VideoMaMa with no clip worse, edges and MSE 24% better on the median, SAD 9% worse); Edges checks as Accuracy, then, where the candidate whose Use is Combine, Most Trusted and the others disagree, leans on that one (measured with VideoMaMa trusted: edges 22% better than VideoMaMa on the median, two held-out clips more than 5% worse instead of eight; still not passed). The card uses Robustness only. Outputs the combined alpha, a confidence map, which candidate each pixel came from and per-frame scores per candidate; the result's layer name is made from the models and the objective used, and its licence is the strictest of the candidates'."
