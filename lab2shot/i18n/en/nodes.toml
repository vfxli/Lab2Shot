[node.ensemble_segment]
subtitle = "Object Segmentation Ensemble"
description = "Combines several models' segmentations of one object into one hard mask. A candidate can be a mask (such as SAM 3's point-picked mask), a label map (such as VidEoMT's panoptic segments: the objects the Object covers on its first frame are taken) or a matte alpha (voting with its soft value). An object check comes first: a candidate drawing a part more or less than the Object is left out for the shot; candidates sharing a guide (SAM 3's mask and MatAnyone 2 on it; BiRefNet and VideoMaMa on its rough mask) count as one vote, and when the votes disagree on which object it is the majority decides, the losers being left out of that frame. Objective: Accuracy is the per-pixel majority; Stability is the majority with hysteresis (a pixel that was foreground stays so until its votes drop below 30%, fewer flickers); Reliability is STAPLE, weighting each vote by its estimated reliability (needs three votes, otherwise the majority). Measured (12 clips with ground truth, 6 held out): no objective passed (median IoU about 0.988, level with the best single models at 0.990–0.992), so no card uses it. Outputs the combined mask, a confidence map (the share of candidates agreeing with it), which candidate each pixel is closest to and per-frame IoU of each candidate with the result; the layer name is made automatically and the licence is the strictest of the candidates'."
