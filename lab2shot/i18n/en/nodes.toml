[family.lens_calibration.focal]
help = "Focal length (mm). Upstream gives it in pixels (a length measured with the width of one photosite as the ruler); here it is converted to millimetres. The conversion uses the node's Aperture: focal length (mm) = focal length (px) ÷ image width × Aperture."

[family.lens_calibration.filmback]
help = "The Aperture typed on the node, passed on as it is: the focal length was converted to millimetres with it, so downstream (lens_distortion, camera) need not type it again and both sides always hold the same number"

[family.lens_calibration.lens]
help = "Everything of this lens except its focal length and aperture: the lens model's name, its distortion coefficients, the principal point X / Y (mm) and the pixel aspect, in one value. Wire it into lens_distortion's Lens Intrinsics: the lens model and coefficients there follow this one"

[family.matte.foreground]
help = "The foreground colour with the background taken out (RGBA, premultiplied by alpha): the background and green-screen spill mixed into hair and semi-transparent edges was removed when the model unmixed them. Composite it as the foreground in Nuke and the edges no longer carry the old background's colour, which multiplying the plate by alpha cannot do. Wire it into image.output to write an EXR"

[family.humans.plate_camera]
help = "The camera the people are placed with: a still pinhole camera at the origin, its focal length the node's Focal Length (the solver's own estimate or the default when left empty), its principal point at the image centre. Not a solved camera: the people are placed in its space, so through it they line up with the image plane. Use it as the solver's camera, or as camera_space's target"

