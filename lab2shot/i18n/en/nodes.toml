# ---- The core nodes

[node.attrib_delete]
subtitle = "Attribute Delete"
description = "Point cloud or curves → removes some of the attributes attached to the points: type the attribute names (separated by spaces or commas, * wildcards allowed, same as Houdini's Attribute Delete). Confidence, normals, classes and point IDs computed by models all ride on the points; delete here whatever you don't want to pass downstream before delivery, and the files get smaller. Points, positions and colors are left untouched; only the values attached to the points are removed. To see which attributes the data currently has, check the exclamation mark at the node's lower right."

[node.attrib_delete.param.attributes]
label = "Attributes"
placeholder = "Connect data first"

[node.auto_ground]
subtitle = "Auto Ground"
description = "Scene → the scene leveled and placed on y = 0 (camera and people together). If a gravity direction is given (the per-frame up direction in camera space from geocalib.calibrate and similar), it first rotates around the origin to level the scene so the Y axis truly points up (a solved world follows the first-frame camera, so if the camera tilts down or rolls, the ground is slanted; only tilt and pitch are corrected, heading is unchanged), then moves it vertically so the ground sits on y = 0: by the height of people's feet (lowest joint for skeleton animation), or by the densest layer of the point cloud. What goes in comes out as the same kind of data; to enter values yourself, use transform."

[node.auto_ground.param.gravity]
label = "Gravity Direction"

[node.auto_ground.param.gravity_error]
label = "Gravity Error"

[node.auto_ground.param.source]
label = "Ground Reference"

[node.auto_ground.param.source.option]
people = "People's Feet"
points = "Point Cloud"
none = "No Grounding"

[node.auto_ground.param.percentile]
label = "Grounded Frame Ratio"

[node.bake_geometry]
subtitle = "Bake Geometry"
description = "Skinned character → per-frame deformed geometry (geometry cache): blend shapes and skinning are evaluated with the DCC algorithm, the vertices of every frame are baked, and the bones are dropped. Use it before writing to a format without bones; the result matches the original motion exactly, but the bones can no longer be adjusted. If you only want the bones, use extract_skeleton."

[node.blast]
subtitle = "Blast"
description = "Geometry → geometry with only one group left: the faces of the mesh in the group with this name are kept, all other faces and all other meshes are removed. A group is a USD GeomSubset (part of a mesh), read as a primitive group in Houdini and a face set in Maya; face solves give the whole head while hair solves need the scalp, so use this node to extract the \"scalp\" part. Points are renumbered from the kept faces (unused points are not carried over); UVs, normals and per-point attributes are cut accordingly, and per-frame deforming geometry caches are cut on every frame."

[node.blast.param.subset]
label = "Group"
placeholder = "Connect geometry first"

[node.bone_deform]
subtitle = "Bone Deform"
description = "Skeleton animation + skinned character → the skinned character driven by this animation (mesh, skinning and blend shapes unchanged; the original animation is replaced). It only verifies, never guesses: the joint names and parent-child relationships of both skeletons must match one to one; otherwise it reports an error listing the differences. If the animation comes from a different skeleton, run it through retarget first. Typical setup: connect the skeleton animation from retarget, and connect the character to the same target (for example, wire one output of standard_human to both the Target of retarget and the Skinned Character here). The viewport shows the skin deformation directly; for a mesh cache, add bake_geometry."

[node.bone_deform.param.skeleton_path]
label = "Animation Skeleton"
placeholder = "First one"

[node.bone_deform.param.character_skeleton]
label = "Character Skeleton"
placeholder = "First one"

[node.bone_deform.port.character]
help = "The character to drive: mesh, skinning and blend shapes stay as-is; its original animation is replaced"

[node.bone_deform.port.skeleton]
help = "The animation to apply: its skeleton hierarchy must match the character's exactly (usually the output of retarget)"

[node.bone_deform.port.character.output]
help = ""

[node."boxes.output"]
subtitle = "Person Boxes Output"
description = "Person boxes → JSON (each person's box per frame, read by scripts and DCC plugins), CSV (one person per frame per row, readable by Excel and Houdini), or a Nuke Tracker node (one track per person, following the box center). When writing a Nuke node, the node offers \"Copy to Nuke\"; once copied, it can be pasted into your comp. This node only sets the name and format; files are actually written when it is connected to output."

[node."bvh.import"]
subtitle = "Import BVH"
description = "Imports motion capture BVH (.bvh, exported from CMU, Rokoko, MotionBuilder): the bone hierarchy and per-frame motion become one skeleton animation; the frame rate follows the Frame Time in the file, and frame numbers start at 1. BVH does not record units, so set them in Unit; it contains only bones without a mesh, so for characters with meshes use an import node for another 3D format."

[node."bvh.import".param.unit.option]
cm = "Centimeters"
m = "Meters"
auto = "Auto (Estimate from Bone Length)"

[node."bvh.import".port.skeletons]
waits = "Pick a skeleton animation"

[node."bvh.import".port.fps]
help = "The frame rate recorded in the BVH (the inverse of Frame Time). Connect it to the FPS of a motion model or a format output node to follow this file"

[node."bvh.import".fact.models]
kinds = "Selected Geometry"

[node.camera]
subtitle = "Camera"
description = "The same node as Nuke's Camera3 and Houdini's Camera: enter focal length, aperture, position and orientation here → a static camera. Focal length, aperture and principal point can also be wired in (from the matching outputs of anycalib.calibrate, or from split_camera); when wired, the wired values are used. By default it sits at the origin looking down -Z; connect an image and it takes that image's resolution and frame range, and the image also becomes its image plane (shown underneath when the 3D viewport looks through it). Nodes that need a camera (SAM 3D Body, GVHMR...) get a locked-off camera with known focal length when connected to it; when no focal length is given at all it is empty, and the downstream node computes its own."

[node.camera.param.focal_mm]
placeholder = "Auto"

[node.camera.param.filmback_mm]
placeholder = "36"

[node.camera.param.translate]
label = "Position"

[node.camera_space]
subtitle = "Camera Space"
description = "Scene + source camera + target camera → the same scene, moved into the target camera's world so it lines up with the image under the target camera. People, meshes, skeletons, curves, point clouds, Gaussian splats and cameras can all be moved. Leave Source Camera empty when the scene sits right in front of the camera (SAM 3D Body, HaMeR, SMIRK...); for results with their own world (WHAM, GVHMR), connect their Reference Camera to Source Camera. To move a camera a solver found, connect it to both Scene and Source Camera and pick Smooth Whole Range: the camera delivered is in the target camera's world (position scaled, orientation only rotated, lens unchanged). As long as a project can deliver a camera, its space can be converted to any other project's space. Only position changes; the data itself stays the same."

[node.camera_space.param.fit]
label = "Fit Mode"

[node.camera_space.param.fit.option]
per_frame = "Per-Frame Fit"
whole = "Smooth Whole Range"

[node.camera_space.port.target_camera]
label = "Target Camera"
help = "Which camera's world to move into: the solved one (ViPE, COLMAP...) or a real camera brought in by usd.import. Both cameras must have the same focal length and film gate (templates use split_camera to feed the target camera's values to the solver)"

[node.camera_space.port.scene]
help = "What to move: people, meshes, skeletons, curves, point clouds, Gaussian splats, cameras"

[node.camera_space.port.source_camera]
label = "Source Camera"
help = "Which camera's space the scene is currently in: for solvers with their own world (WHAM, GVHMR), connect their Reference Camera here. Leave empty when the scene sits right in front of the camera with no world position (SAM 3D Body, HaMeR, SMIRK, MediaPipe face); each frame is then placed into the world directly by the target camera"

[node.camera_space.port.reference]
label = "Reference Point Cloud"
help = "A point cloud already in the target camera's world (for example a scene point cloud fused with the target camera). With Smooth Whole Range, connecting it means scale is no longer read from the two trajectories but by comparing, frame by frame, the distances each side sees through its own camera: when reconstruction solvers (WorldMirror, NeoVerse) solve a nearly translating shot as rotating in place, scale cannot be read from the trajectories, and this is what makes them line up"

[node.camera_space.port.scene.output]
help = "The same scene, in the target camera's world"

[node.channel_join]
subtitle = "Channel Join"
description = "Three single-channel masks → one RGB image: connect one to each of the R, G and B inputs; pixels are copied into the three channels as-is with no color conversion (what Houdini's Float to Vector looks like on images; in Nuke it is a Shuffle moving three channels into rgb). Grayscale images read by file have only one channel and cannot connect to inputs that need RGB (the Image of colmap.camera_solve): connect the same grayscale image to R, G and B to get a gray RGB image. Pixels are unchanged and tagged as the working space (sRGB)."

[node.channel_join.port.r]
label = "R"

[node.channel_join.port.g]
label = "G"

[node.channel_join.port.b]
label = "B"

[node.compare]
subtitle = "Compare"
description = "Compares two values and outputs a toggle: connect it to the condition of switch. Different units are converted first; if they cannot be converted, an error explains why."

[node.compare.param.operation.option]
gt = "Greater Than"
ge = "Greater Than or Equal"
lt = "Less Than"
le = "Less Than or Equal"
eq = "Equal"
ne = "Not Equal"

[node.compare.port.a]
label = "A"

[node.compare.port.b]
label = "B"

[node.compare.port.value]
label = "Result"

[node.compare_cameras]
subtitle = "Compare Cameras"
description = "Two cameras → per-frame curves of position difference, angle difference and focal length difference, plus the camera aligned into the reference camera's world. Any two cameras can be compared (solved in 3DE, by ViPE...), to pick which solve suits which kind of shot; give the aligned camera a name with name (both cameras are called camera), and it can be merged with the reference into one scene to view together."

[node.compare_cameras.param.align]
label = "Align"

[node.compare_cameras.param.align.option]
similarity = "Scale + Rotate + Translate"
rigid = "Rotate + Translate"
none = "No Alignment"

[node.compare_cameras.port.reference]
label = "Reference Camera"

[node.compare_cameras.port.camera.output]
label = "Aligned Camera"

[node.compare_cameras.port.errors]
label = "Per-Frame Errors"

[node.composite]
subtitle = "Composite"
description = "Equivalent to Nuke's Merge: combines an image and a mask into one image with an operation. The most common is multiply: \"Stencil\" blacks out the area inside the mask (masking out walking people before solving the camera), \"Keep\" keeps only the area inside the mask. The mask is automatically applied to every channel of the image. \"Over (A over B)\" is the same as Nuke's Merge over: premultiplied-alpha A is laid over Background, and Background shows through where A is transparent (use the Background input instead of Mask here; lowering Opacity makes A semi-transparent, so Background shows through even when A has no alpha), for example to view AllTracker patches or images aligned by RoMa over the original plate."

[node.composite.param.operation.option]
multiply = "Keep"
stencil = "Stencil"
plus = "Plus"
minus = "Minus"
min = "Min"
max = "Max"
over = "Over (A over B)"

[node.composite.param.mix]
label = "Opacity"

[node.composite.port.a]
label = "Image"
help = "With \"Over\", the image laid on top (premultiplied-alpha RGBA; without alpha it covers everything)"

[node.composite.port.b]
label = "Mask"
help = "A single-channel mask, automatically applied to every channel of the image"

[node.composite.port.bg]
label = "Background"
help = "With \"Over\", the image underneath: it shows through where A is transparent (for example to view AllTracker patches or RoMa-aligned images over the original plate)"

[node.composite.port.image]
label = "Image"

[node.constant]
subtitle = "Constant"
description = "The same node as Nuke's Constant: give a size, frame count and color, and it outputs a solid-color image sequence with no footage. Use it to get started when you have no plate: draw_mask needs an image to draw on, and sketch2anim.motion needs an image sequence to set the motion length (it ignores pixels, only the frame count matters). Once real footage is connected you don't need it: the footage itself can then serve as a storyboard to draw over."

[node.constant.param.frames]
label = "Frames"

[node.constant.param.frames.option]
24 = "24 Frames · 1 s"
48 = "48 Frames · 2 s"
96 = "96 Frames · 4 s"
144 = "144 Frames · 6 s"
192 = "192 Frames · 8 s"

[node.constant.param.colour]
label = "Color"

[node.crop]
subtitle = "Crop"
description = "The same node as Nuke's Crop: crops the image to a region, and the cropped region becomes the new image frame. Set how many pixels to cut from each of the four edges; all four at 0 does nothing. Some solvers have framing requirements: face and hand solvers need the subject to fill most of the frame, and camera and point cloud solves even more so: run uncropped on the same 4K footage, COLMAP solved only 3 camera positions out of 267 frames; cropped to a square centered on the subject, all 267 frames solved. Crop to the subject with this node first, then connect the solver. Overscan does not carry over: the cropped image is just that region, with no pixels outside the frame."

[node.crop.param.left]
label = "Left"

[node.crop.param.right]
label = "Right"

[node.crop.param.top]
label = "Top"

[node.crop.param.bottom]
label = "Bottom"

[node.crop.port.image]
label = "Image"

[node.curve_channel]
subtitle = "Curve Channel"
description = "Animation curves (expression curves, per-frame errors from compare_cameras...) → one of them, one float per frame. Connect it to a parameter that takes per-frame values, or view its curve on its own."

[node.curve_channel.param.curve]
label = "Curve"
placeholder = "First one"

[node.curve_channel.param.unit.option]
cm = "cm"
m = "m"

[node.curve_channel.port.curves]
label = "Curves"
waits = ""

[node."curves.output"]
subtitle = "Curves Output"
description = "Animation curves (such as expression curves) → CSV, .chan (Houdini / Nuke), JSON or USD (curves written as animated attributes, to connect to a character in your DCC). This node only sets the name and format; files are actually written when it is connected to output."

[node."curves.output".param.format.option]
chan = ".chan"
usd = "USD"

[node."curves.output".port.curves]
label = "Curves"
waits = ""

[node.data_info]
subtitle = "Data Info"
description = "Extracts facts the data states about itself as values: frame count, start frame, end frame, width, height, count, plus any other facts this data type declares (focal length, point count, number of people..., chosen in Item). It reads the same description as port tooltips and the middle-click data info."

[node.data_info.param.item]
label = "Item"
placeholder = "Connect data first"

[node.data_info.port.frames]
label = "Frames"

[node.data_info.port.first]
label = "Start Frame"

[node.data_info.port.last]
label = "End Frame"

[node.data_info.port.width]
label = "Width"

[node.data_info.port.height]
label = "Height"

[node.depth_align]
subtitle = "Depth Align"
description = "Aligns a depth map that needs manual scaling, a relative-only depth map or a disparity map to a reference at real-world scale, producing a real-scale depth map (cm). The reference can be another real-scale depth map (MoGe, UniDepth...), or a point cloud plus its camera (COLMAP, LiDAR). A common setup aligns the stable, flicker-free disparity from Video Depth Anything to the real-scale depth from MoGe, giving depth that is both stable and at real scale."

[node.depth_align.param.depth_is]
label = "Input Is"

[node.depth_align.param.depth_is.option]
auto = "Auto"
disparity = "Disparity"
relative = "Scale Only"
affine = "Scale and Shift"

[node.depth_align.param.fit]
label = "Fit"

[node.depth_align.param.fit.option]
shot = "Whole Shot"
frame = "Per Frame"

[node.depth_align.port.depth]
label = "Depth Map to Align"

[node.depth_align.port.reference]
label = "Reference Depth Map"

[node.depth_align.port.mask]
label = "Alignment Region"

[node.depth_align.port.confidence]
help = "Where the depth map is more reliable (connect the confidence from the node of the reference or the depth to be aligned): each pixel is weighted by it during fitting; uncertain pixels count less, and 0 does not count"

[node.depth_align.port.camera]
label = "Point Cloud Camera"

[node.depth_align.port.points]
label = "Reference Point Cloud"

[node.depth_align.port.depth.output]
label = "Depth Map"

[node.deshake_camera]
subtitle = "Camera Deshake"
description = "Camera → a camera with small per-frame jitter removed and the overall motion kept, plus a before/after comparison curve. Solved cameras jitter frame to frame; cameras inferred by MapAnything, LingBot-Map and GVHMR are all recommended to go through it. Strength is a period: 8 frames removes jitter with a period shorter than 8 frames, and slower motion is kept as-is; sudden stops and whip pans are protected separately by Keep Sudden Moves and are not rounded off."

[node.deshake_camera.param.strength]
label = "Strength"

[node.deshake_camera.param.keep_sudden]
label = "Keep Sudden Moves"

[node.deshake_camera.param.rotation]
label = "Smooth Rotation"

[node.deshake_camera.param.focal]
label = "Focal Length"

[node.deshake_camera.param.focal.option]
keep = "Unchanged"
smooth = "Deshake Too"

[node.deshake_camera.port.curves]
label = "Before/After"
waits = ""

[node.draw_figure]
subtitle = "Draw Stick Figure"
description = "One key pose per frame: click \"Add Frame\" in the parameter pane to place a standing stick figure (T-pose) on the current frame, then drag the joints into place one by one in the 2D view. From the second frame on you can use \"Based on Previous Frame\" to copy the previous pose as-is and then edit it. When done, connect it to the Sketch input of sketch2anim.motion. Connect an image sequence and you draw on each of its frames: wherever you scrub the timeline, the background shows that frame, and the stick figure is the one drawn on that frame. That image is only a background to trace over and does not take part in the computation; without it you draw on a blank canvas. The path between the hip joints of two stick figures is the route the body travels (with only one, there is no route and the body stays roughly in place); drawing large or small does not affect the result, only changes in pose and position matter."

[node.draw_figure.param.poses]
label = "Key Poses"
placeholder = "Click \"Add Frame\" to place the first pose"

[node.draw_figure.port.image]
label = "Image"
help = "The background to trace over, an image sequence: wherever you scrub the timeline that frame is shown, and you draw on that frame. This image does not take part in the computation; downstream Sketch2Anim only uses the stick figure's joint coordinates, not a single pixel"

[node.draw_mask]
subtitle = "Draw Mask"
description = "Drag a loop around the area you want in the 2D view to get a mask. It is a static mask: draw once and the whole shot uses it, with no keyframes and no following the subject (which is why it is not called Roto: Nuke's Roto is an animated spline reshaped frame by frame; this is not). Use it when automatic selection can't isolate the part you want: SAM 3 needs something a single word can describe, BiRefNet only finds the most salient subject, while \"this person's coat\" or \"the second person from the left\" can't be described or selected; a quick loop settles it. Two common uses: seeding the Coarse Mask of matting nodes such as MatAnyone 2 (they only read the first frame), and garbage masks for locked-off shots (once the camera moves the mask is wrong, so don't use it on handheld shots). To grow, feather or invert, follow it with mask_adjust."

[node.draw_mask.param.shapes]
label = "Shapes"
placeholder = "Drag an outline in the 2D view"

[node.draw_mask.port.image]
label = "Image"

[node."exr.output"]
