[settings.state.ip]
label = "User IP"
via = "Visible: {ip} (passed on by trusted proxy {via})"
via_tip = "Per-IP limits (registration, wrong invite codes, request rate) use the real address the proxy passes on"
via_none = "The user's real IP is not visible: trusted proxy {via} passed no address"
via_none_tip = "This request came from a trusted proxy without X-Forwarded-For / X-Real-IP: set the proxy to forward that header (nginx: proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;), otherwise per-IP limits have no effect"
direct = "Visible: {ip} (the connection's own address)"
direct_tip = "Users connect to this server directly (local network); per-IP limits use the connecting address"
local = "The user's real IP is not visible: every source is this machine, {ip}; per-IP limits have no effect"
local_tip = "Requests are forwarded in by this machine itself (a browser on this machine, or a tunnel such as frp that only forwards TCP connections to this port): nobody can be told apart, so the per-IP and per-network registration limits and the count of wrong invite codes by source do not apply, rather than blocking everyone together as one person; the site-wide registration limits, invite codes and proof of work still apply. To see real IPs: let nginx / Caddy / frp https2http on a cloud server decrypt HTTPS and forward over HTTP with X-Forwarded-For, then enter the address it connects from under \"Trusted Proxies\""
ignored = "This request carries forwarding headers such as X-Forwarded-For, but {host}, where it comes from, is not a \"Trusted Proxy\": none of them were used"

