# 镜头畸变（lab2shot/data/lens_models.py、lab2shot/nodes/core/lens_distortion.py）。
# 一行一条：编号 = 模板。写法：谁估的、和什么比、数字和单位、意味着什么、怎么办。

# 没有「需不需要去畸变」那一类检测提示（原始素材、镜头状态未知、广角未知、已去畸变还要解畸变……），也不要加：
# 制作人员自己知道输入的是否去过畸变，节点不替他猜。

# ---- 提交前拦截
"W-LENS-NOLENS" = "「{node}」的畸变系数还都是 0，画面原样通过（零畸变的重采样只会让画面变软）：把「AnyCalib 镜头标定」的「镜头模型」和「畸变系数」接到节点上的同名输入口，或者照 3DE、标定程序的数逐个填。现成的 ST-map 用「STMap」，不用这个节点"
"B-LENS-STMAPFRAMES" = "逐帧的 ST-map 缺画面要用的 {count:d} 帧（从第 {first:d} 帧起）：补齐 ST-map，或者换成整段一张的定焦 ST-map"
"B-LENS-MODELMISMATCH" = "「{node}」选的镜头模型是「{here}」，接进来的「镜头内参」（{source}）是「{upstream}」：两边要选同一个模型才能算——把这里的「镜头模型」改成「{upstream}」，或者让上游按「{here}」解"
"B-LENS-RASTER" = "画面是 {width:d}×{height:d}，镜头是在 {lens_width:d}×{lens_height:d} 的画面上定的：宽高比不同，这份镜头对这个画面不成立"

# ---- 错误
"E-LENS-MODEL" = "不认识的畸变模型「{model}」：可选 {models}"
"E-LENS-PARAMS" = "畸变模型「{model}」的参数不对：缺 {missing}，多了 {unknown}（参数名照软件里的写法）"
"E-LENS-PHYSICAL" = "镜头的 {what} 是 {value}，物理上不成立（Filmback、像素比、挤压都要大于 0）"
"E-LENS-NOFOCAL" = "畸变模型「{model}」按 Focal Length 归一化，镜头上没有 Focal Length：填上 Focal Length 再用"
"E-LENS-NORASTER" = "镜头没有写它是在多大的画面上定的：畸变只对定义它的那个画面尺寸成立"
"E-LENS-COEFF" = "畸变系数 {name} = {value:g} 不在 {low:g}–{high:g} 之间：检查是不是填错了位置或单位"

# ---- 生产风险（红色，--production-risk；只给可能造成生产事故的提醒，普通错误仍用紫色 --error）
"P-LENS-ESTIMATED" = "畸变是「{by}」从画面估的，没有剧组镜头网格的 ST-map 或 3DE 镜头数据：估计的畸变可能差几个像素，这样交付可能造成画面贴合不上。交付前换成镜头网格的 ST-map 或 3DE 的镜头数据"

# ---- 警告和提醒
"W-LENS-OVERSCANCAP" = "自动扩边到上限 {cap:.0%} 还装不下：原始画面有 {outside:,} 个像素拉直后落在画布外（鱼眼或极端广角），这些像素在去畸变画面里没有"
"W-LENS-FOLD" = "畸变在 {count:,} 个像素处折叠（同一个位置对应多处，多项式超出了单调范围）：这些像素的去畸变和加畸变不可靠，核对畸变参数"
"N-LENS-NOPLATE" = "「{node}」还不知道这颗镜头对多大的画面成立，没有结果可交：接一张画面进来，或者在节点上填「画面宽度」和「画面高度」"
"N-LENS-PARAMRANGE" = "「{model}」的「{name}」是 {value:g}，超出 3DE 常用范围 {low:g} 到 {high:g}：照收，请核对单位和正负号"

# ---- 信息
"I-LENS-MEASURED" = "畸变 · 实测，来自「{by}」"
"I-LENS-SOLVED" = "畸变 · 解算得出，来自「{by}」"

# ---- 接了相机之后节点上的镜头参数就不该再起作用：接进来的相机是经人工跟踪、质检过的，比算法可信，不去怀疑它

"N-LENS-CAMERAHASIT" = "接进来的相机自带 Focal Length 和 Filmback，用它的：一个参数悄悄压过一台解算好的相机，就说不清最后用的是哪个。真要改镜头，在相机那一头改——「锁定 Focal Length」能把逐帧估出来的 Focal Length 锁成一个定值，而且连相机位置一起重算（只换 Focal Length 数字、相机不动，画面就对不上了）"
