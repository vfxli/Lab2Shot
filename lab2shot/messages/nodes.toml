"E-MAP-HIPS" = "对应关系：{side}骨架的「髋」配的是 {hips}，但「{part}」{joint} 不在它下面。髋要是两条大腿和脊柱共同的上级关节（移动它，整个身体才跟着走），在「对应关系 · 编辑…」里换一个"
"E-MAP-SHARED" = "对应关系：「{first}」和「{second}」都用了{side}骨架的 {joint}，一个关节只能属于一个部位"
"N-IMGMERGE-GAP" = "B 缺 {count} 帧（如第 {first} 帧）：这些帧原样交出 A，没有合成。接同一段镜头的图，或只算两边都有的帧"
