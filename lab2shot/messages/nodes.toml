"W-OUTPUT-JPGALPHA" = "这些图像带 alpha，JPG 装不下 alpha：只写了颜色（压在黑底上），alpha 没有了。要 alpha 选 EXR 或 PNG"
"E-EXR-LOSSYDATA" = "压缩选了{compression}：深度图这类数据只能无损、32 位，不然数值会被改掉（这个压缩连数据图层也会压坏）。换一种压缩，或者单独接「序列图输出设置」写这一层"
"E-IMAGES-NOINPUT" = "「序列图输出设置」什么都没接：把一整张图接到「图像」，或者把单条通道接到 R、G、B、A"
"N-IMAGES-GAP" = "{channel} 缺 {count} 帧（如第 {first} 帧）：这些帧里这条通道是 0。接同一段镜头的数据，或只算它有的帧"
