"E-MAP-DUPNAME" = "对应关系：「{part}」选的 {joint} 在{side}骨架里有好几个关节都叫这个名字（{paths}），不知道是哪一个。打开「对应关系 · 编辑…」重新点选（重名的关节按路径列出）"
