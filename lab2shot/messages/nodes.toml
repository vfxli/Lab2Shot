# 核心节点（lab2shot/nodes：core/*、families/*、base.py、formats.py、output.py、registry.py）。
# 一行一条：编号 = 模板。写法：谁估的、和什么比、数字和单位、意味着什么、怎么办。

# ---- 节点类型和参数（nodes/base.py、nodes/registry.py）
"E-NODE-NOPARAM" = "「{node}」没有参数 {names}：节点图文件里的参数名不对，或者是别的版本的节点图"
"E-NODE-NOTWIREABLE" = "「{node}」的「{label}」不能接线（只有数值、开关、向量和文字参数可以）"
"E-NODE-DUPOUTPUT" = "「{node}」有重名的输出：{names}"
"E-NODE-DUPINPUT" = "「{node}」有重名的输入：{names}"
"E-NODETYPE-BROKEN" = "扩展包 {extension} 没有加载成功：{reason}"
"E-NODETYPE-NOEXTENSION" = "没有扩展包 {extension}"
"E-NODETYPE-UNMET" = "扩展包 {extension} 还不能用：{reason}"
"E-NODETYPE-NOTINEXTENSION" = "扩展包 {extension} 里没有这个节点"

# ---- 相机（core/camera.py、kit/cameras.py）
"N-CAMERA-ONEPOSE" = "相机只有一个位置（没有帧或只有一帧）：没有抖动可去，原样输出"
"N-CAMERA-INTERPOLATED" = "{count} 帧没有逐帧解出（隔帧或没解上），相机由前后帧插值"
"E-COMPARE-NOCOMMON" = "两台相机没有共同的帧可比：「相机」是第 {camera} 帧，「参考相机」是第 {reference} 帧，帧号要对得上"
"E-COMPARE-ONECOMMON" = "两台相机只有第 {frame} 帧是共同的：至少要两帧才能对齐和比较"
"N-COMPARE-REFSTILL" = "参考相机几乎不动：只按朝向和位置对齐，不对齐比例"
"N-COMPARE-CAMSTILL" = "要比的相机几乎不动：只按朝向和位置对齐，不对齐比例"
"W-COMPARE-REVERSED" = "两台相机沿同一条直线移动、方向却相反：多半是其中一台的解算把方向解反了。比例按大小对齐、不做镜像，转向按两台相机的朝向对齐，误差会把这段反向算进去"
"N-COMPARE-LINE" = "相机沿直线移动，只凭位置定不了绕这条线的转向：转向按两台相机的朝向对齐"
"I-COMPARE-RESULT" = "{frames} 帧：位置误差 RMS {rms:.1f} cm{share}、最大 {max:.1f} cm；角度差中位数 {angle:.2f}°、最大 {angle_max:.2f}°；Focal Length 差中位数 {focal}%{scale}"
"I-COMPARE-SHARE" = "（参考相机行程的 {share:.1f}%）"
"I-COMPARE-SCALE" = "，比例 {scale:.3f}"

# ---- 相机去抖（core/camera.py DeshakeCamera、kit/deshake.py）
"I-DESHAKE-RESULT" = "去抖：位置最多改了 {moved:.1f} cm、转动最多 {turned:.2f}°；按 {distance:.0f} cm 远的物体算，画面上相当于 {shift:.2f} px"
"W-DESHAKE-OFFPLATE" = "去掉的可能是画面里真实的手持晃动，不只是解算噪声：按 {distance:.0f} cm 远的物体算，合成时 CG 会和画面滑开 {shift:.1f} px（第 {frame} 帧）。要去的只是解算噪声就把「强度」调小；真要稳定画面，合成时把画面一起稳"
"N-DESHAKE-SUDDEN" = "{count} 帧的急停急转留着没磨（第 {frames} 帧）：那几帧的加速度突变是真的。不想留就关掉「保留急停」"

# ---- 锁定 Focal Length（core/camera.py LockFocal、kit/lock_focal.py）
"I-FOCAL-RESULT" = "解算出的 Focal Length {low:.1f}–{high:.1f} mm，锁成 {locked:.1f} mm（{said}）；相机位置最多挪了 {moved:.1f} cm；挪相机补不回来的部分中位 {median:.2f} px、最大 {max:.2f} px"
"I-FOCAL-MEASURED" = "用了真实的画面观测：每帧约 {count} 个跟踪点（不是按原相机投出来的位置）"
"W-FOCAL-REPROJ" = "把 {low:.0f}–{high:.0f} mm 抖动的 Focal Length 锁成 {locked:.0f} mm 后，挪相机补不回来的部分中位 {median:.1f} px、最大 {max:.1f} px（第 {frame} 帧）：透视本身差得多。建议在上游解算节点的「Focal Length」填 {locked:.0f} mm 重新解算"
"N-FOCAL-ZOOMLIKE" = "Focal Length 从 {low:.0f} mm 平稳变到 {high:.0f} mm，像是真的变焦镜头，不是解算抖动：锁成定值会错。真是定焦才用这个节点"
"N-FOCAL-NOFRAMES" = "接进来的相机没有帧（不动的相机）：Focal Length 本来就是一个定值，没有逐帧位置要重算，原样输出"
"N-FOCAL-FEWANCHORS" = "{count} 帧的锚点不到 {least} 个：那几帧只用了闭式估计，没有逐点精修。点云在那几帧太少或者不在画面里"

# ---- 重定时（core/scene.py Retime、kit/retime.py）
"I-RETIME-MAP" = "速度 {speed:g} · 偏移 {offset:d} 帧 · {was} → {now}"
"N-RETIME-INTERP" = "{total} 帧里有 {count} 帧不在原来的帧上，是插出来的：相机位置线性、朝向球面插值，关节旋转球面插值"
"N-RETIME-GAP" = "接进来的场景有断档（中间缺帧）：落在断档里的 {count} 帧照样缺着，没有用两边的帧插出来"
"N-RETIME-HIDDEN" = "有物体自己的断档（中间隐藏的帧）：落在它显示与隐藏两帧之间的 {count} 帧里它隐藏着，没有用断档两边的姿势插出来"
"N-RETIME-NEAREST" = "{count} 帧的点数逐帧不同，没法插值：取了最近一帧的点"
"N-RETIME-NOTHING" = "偏移 0、速度 1：原样输出"
"N-RETIME-STILL" = "接进来的场景没有帧（不动的相机、静止的模型）：它对每一帧都成立，没有帧号可挪，原样输出"
"E-RETIME-NOFRAMES" = "重定时之后一帧都不剩：接进来的是 {first}–{last}，这样换算落不到任何一个整帧上。把「偏移」或「速度」改一改"

# ---- 镜头假设（nodes/applies.py standing_notices：只在声明 lens = "pinhole" 的节点上；模板卡片上不显示）
# a node whose output decides its own size says so before it cooks。节点底行只放得下
# 短说法（.short，最多 12 个全角字，messages/__init__.py SHORT_WIDTH），整句在节点的「数据信息」卡片和参数面板里。
"I-SHAPE-CROP" = "输出画面的尺寸由「左 右 上 下」四个数定：接进来的画面减去切掉的那几条边"
"I-SHAPE-CROP.short" = "尺寸按切掉的边算"
"E-CROP-ALLCUT" = "四条边切下来什么都不剩了：画面 {width}×{height}，左 {left}、右 {right}、上 {top}、下 {bottom}。左右加起来要小于画面宽度，上下加起来要小于画面高度"
"I-CROP-DONE" = "裁成 {width}×{height}（原来 {was_width}×{was_height}）"

"N-MEANING-ASSUMED" = "「{source}」没说明 {key}：按「{value}」算。要的是别的就在做出它的那个节点上写明（读进来的图层，含义由文件自己的说明带）"

# ---- 读取序列和视频（core/input.py）
"E-READ-VIDEO" = "「{file}」是视频：用「读取视频」节点"
"E-READ-NOTONEPICTURE" = "选中的是一段 {count:d} 帧的序列（{file}）：「读取图片」只读一张图。整段镜头用「读取序列」——不过接它的那个节点是逐帧算的，几百帧会算很久；只要其中一帧就在对话框里只选那一个文件"
"E-READ-RANGEOUT" = "「读取序列」的「首帧」「末帧」{lo}–{hi} 里一帧也没有：这条序列是 {first}–{last}。把首帧、末帧改到这段里，或者留空读整条"
"N-READ-GAP" = "「读取序列」读的 {file} 中间缺 {count} 帧（{frames}）：这些帧没有画面，往下算的结果也没有这几帧。要连续的结果就在素材里补齐这几帧后重新选择；只算有画面的部分用计算按钮旁的帧范围避开"
"N-READ-NOMANIFEST" = "「读取序列」读的 {file} 里，Cryptomatte 图层「{layer}」的物体名单放在旁边的 {manifest}，它没有和 EXR 一起上传：物体按编号区分（「id 1a2b3c4d」这样），名字不知道。要物体名字就把 {manifest} 和 EXR 一起选上重新上传"
"E-VIDEO-RANGEFORMAT" = "区间要写成 开始-结束（秒），如 0-10 或 5-8：「{text}」不是"
"E-VIDEO-NOFRAMES" = "「{file}」一帧都没解出来（文件头说有 {count} 帧）：文件多半截断了或者坏了。重新导出一次再选"
"W-VIDEO-SHORT" = "「{file}」文件头说有 {want} 帧，实际解出来少 {count} 帧（从镜头第 {first} 帧起）：这些帧没有画面。多半是文件末尾截断或带 edit list，重新导出一次可以补齐"
"E-VIDEO-RANGEOUT" = "区间 {text} 超出视频长度 {seconds:.1f} 秒"

# ---- 图像（core/image.py、core/image_output.py）
"E-STMAP-NOFRAME" = "{source}没有第 {frame} 帧（它有 {first}–{last}）"
"N-STMAP-NOTHING" = "整段一个像素都没取到源图里的值，交出的是空图：接进来这张 ST-map 的取值在 {low:g} 到 {high:g} 之间，而 ST-map 是按源图画幅归一化的坐标（0 是左边／下边，1 是右边／上边），这些值指到 {width:d} × {height:d} 的源图外面去了。接进「ST-map」的如果是方向场、法线图、深度图这类数值图，它们的数值不是坐标：按运动矢量变形用「运动矢量转 ST-map」，按镜头去畸变／加畸变用「LensDistortion」"
"N-FRAMEHOLD-EMPTY" = "第 {frame:d} 帧整幅都是 0：挑中的这一帧上游没有结果，或者本来就是黑场。换一帧，或者查上游这一帧为什么是空的"
"N-CHANNELMERGE-GAP" = "「合并通道」有 {count:d} 帧（从第 {first:d} 帧起）R、G、B 三张里缺了一张，这些帧没有结果"
"N-ALPHA-GAP" = "Alpha 缺 {count} 帧（如第 {first} 帧）：这些帧整幅透明。接同一段镜头的遮罩，或只算遮罩有的帧"
"I-RETARGET-DONE" = "转动目标 {joints}/{total} 个关节（没配上的保持静止姿势、跟着父关节），髋高比例 {scale}（{how}），水平位移 1 : 1 跟着动作"
"I-RETARGET-HANDS" = "只配了手（{hands}）：转动目标 {joints}/{total} 个关节，{wrist}；两边没有都带髋，「髋高依据」「髋高倍率」「髋高跟法」「高度偏移」「角色缩放」这次不起作用"
"E-RETARGET-RESTFRAME" = "{rig}的基准帧 {frame} 不在它的帧里（{first}–{last}）：在「{rig}静止姿势」里改帧号，或者选绑定姿势 / 第一帧"
"W-RETARGET-POSEJOINT" = "「{rig}初始姿势」里有 {count} 个关节{rig}骨架上没有：{joints}（换了骨架或骨骼？）。这些修正这次跳过，在 3D 视图里重新摆或清空「{rig}初始姿势」"
"W-RETARGET-SIZELEGS" = "「角色缩放」按身高要两边都配上头，{rig}骨架上没有：这次按腿长比缩放。要按身高就在「对应关系 · 编辑…」里把头配上"
"E-RETARGET-MISSINGPARTS" = "{rig}骨架上没有这些部位：{parts}。{why}，在「对应关系 · 编辑…」里把它们配上"
"E-RETARGET-NOLENGTH" = "{rig}骨架上量不到{what}（长度是 0：关节重合或骨架退化），髋高比例算不出来。检查这副骨架，或者「髋高依据」选不缩放、用「髋高倍率」手填"
"W-RETARGET-LEGVARIES" = "动作这边每帧量出来的{what}在 {low:.1f}–{high:.1f} cm 之间变（差超过 3%），髋高比例按中位数 {median:.1f} cm 算：解算时没有锁体型？要稳定的比例就在解算节点里锁定体型，或者「髋高依据」选不缩放、用「髋高倍率」手填"
"I-EXPRMAP-DONE" = "目标的 {driven}/{total} 个形变跟着表情动，{frames} 帧；没配上的形变保持 0。表情这边没用上的曲线：{unused}"
"I-EXPRMAP-GUESS" = "按名字认出来的 {count} 对：{pairs}。认错了点「对应关系 · 编辑…」改"
"E-EXPRMAP-NOCURVES" = "「表情」接进来的角色没有 blendshape 动画：接面部解算的「表情曲线」口，或者带表情动画的角色"
"E-EXPRMAP-NOSHAPES" = "目标角色（{path}）的网格上没有 blendshape，表情没有地方动：接一个带 blendshape 的角色（ARKit 52 个，或 FLAME 的表情形变）"
"E-EXPRMAP-NOPAIR" = "表情和目标一个形变也没对上（表情这边是 {curves} 这类名字，目标是 {shapes} 这类）：在「对应关系 · 编辑…」里手动配"
"E-EXPRMAP-NONAME" = "对应关系：「{slot}」选的 {name} 在{side}这边没有（换过角色？）。打开「对应关系 · 编辑…」重新点选"
"E-EXPRMAP-ONENAME" = "对应关系：「{slot}」只能配一个，{side}这一栏选了 {count} 个"
"E-EXPRMAP-SHARED" = "对应关系：「{first}」和「{second}」都用了{side}这边的 {name}，一条曲线只带一个形变、一个形变只跟一条曲线"
"I-SKIN-DONE" = "{joints} 个关节的动画挂上了，{frames} 帧"
"E-SKIN-HIERARCHY" = "骨架动画和角色的骨架层级不一样，挂不上（只按关节名和父子关系逐一核对，不猜）。只在动画里有的关节：{only_anim}；只在角色里有的：{only_char}；父关节不同的：{parents}；重名的：{twice}。动画来自另一副骨架时，先接「动作重定向」（目标接这个角色）"
"W-SKIN-LENGTHS" = "{count} 根骨头在动画里的长度和角色的不一样（差 5% 以上）：{joints}。照样挂上了，角色会被拉长或压短；多半是动画来自另一副骨架，先接「动作重定向」"
