# 队列和显卡调度（lab2shot/farm）、上传和交付（lab2shot/transfer）、加载扩展包（lab2shot/adapters.py）。
# 一行一条：编号 = 模板。写法：谁估的、和什么比、数字和单位、意味着什么、怎么办。
# E-JOB-GONE、E-JOB-NOGRAPH、E-DELIVERY-GONE 和服务器接口共用，在 server.toml；B-QUEUE-PAUSED 在 web.toml。

