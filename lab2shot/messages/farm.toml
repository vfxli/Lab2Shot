# 没有「等待可用的机器」这一条，也不要加：卡在忙是等一等就自己好的事，用户看了什么也做不了，而且排第几位
# 界面上本来就画着，所以一个字都不说，对用户就是「排队中」。要有人去做点什么的那几种照说，见下面三条和
# farm/queue.py 的 `_told`。「等不到」和「等一会」是两回事：显卡的架构对不上是装好就定死的，再等也不会开始，
# 这种情况若还写着「有机器能算时自动开始」，用户只能干等。
"N-QUEUE-NOMACHINEEVER" = "这台服务器上没有能算它的机器：它不会自己开始，请取消它，或者请管理员检查这个项目的环境"
# 「机器」不是「显卡」：用户永远看不到卡，哪张卡、为什么，是管理员那一格
# （Job.waiting_detail，N-GPU-NOCARD）。这一句和 NOMACHINEEVER 的区别是「要有人去打开」对「换不了」。
"N-QUEUE-NOCARD" = "还没有能接任务的机器：管理员打开之后它才会开始；请联系管理员"
"N-QUEUE-BEHIND" = "排队中：前面还有 {ahead:d} 个任务，轮到它就自动开始"
"N-QUEUE-GPUOFF" = "显卡任务暂停中（管理员关了显卡）：排着的任务先等着，管理员重新打开显卡任务后接着算"
"N-QUEUE-WAITRAM" = "等内存：要 {need:.0f} GB，现在可用 {free:.0f} GB"
"N-QUEUE-ACCOUNTDELETED" = "这个账号已被管理员删除"
"N-QUEUE-SERVEREND" = "服务结束，任务停下了：算好的节点留在缓存里，再点「计算」接着算"
"W-QUEUE-TIMELIMIT" = "立即计算最多算 {minutes:g} 分钟，这次超过了，已经停下；算好的节点留在缓存里，再点「计算」从停下的地方接着算。单个节点就要这么久的，请管理员在设置里调长「立即计算限时」"

