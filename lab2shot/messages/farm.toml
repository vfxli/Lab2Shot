# 队列和显卡调度（lab2shot/farm）、上传和输出（lab2shot/transfer）、加载扩展包（lab2shot/adapters.py）。
# 一行一条：编号 = 模板。写法：谁估的、和什么比、数字和单位、意味着什么、怎么办。
# E-JOB-GONE、E-JOB-NOGRAPH、E-OUTPUT-GONE 和服务器接口共用，在 server.toml；B-QUEUE-PAUSED 在 web.toml。

# ---- 提交和排队（farm/queue.py）
"E-QUEUE-RESTARTING" = "服务器正在重启：十几秒后再提交"
"E-QUEUE-CLOSED" = "队列已经关闭（服务正在结束）：服务再启动之后再提交"
# 一个工作文件夹的队列只在一个进程里（服务）：命令行要动队列，走正在运行的服务（本机令牌），自己不另开一个
"E-QUEUE-OWNED" = "这个工作文件夹（{folder}）的队列已经由另一个进程（pid {pid}）在管：同一个工作文件夹只能运行一个服务；命令行请通过正在运行的服务操作"
"E-QUEUE-UNPARK" = "服务重启后排不回队列：{reason}"
"E-QUEUE-NOTWAITING" = "任务 {job} 已经不在队列里了：可能刚刚算完或被取消了；刷新页面看现在的队列"
"E-QUEUE-STILLRUNNING" = "这个任务还在算，删不掉：先点「取消」，停下来之后再删"
"E-QUEUE-NOJOB" = "队列里没有任务 {job}：可能已经删掉了；刷新页面看现在的队列"
"N-QUEUE-PAUSED" = "服务器暂停接任务：排着的任务先等着，管理员重新打开计算任务后接着算"
# 没有「等待可用的机器」这一条，也不要加：卡在忙是等一等就自己好的事，用户看了什么也做不了，而且排第几位
# 界面上本来就画着，所以一个字都不说，对用户就是「排队中」。要有人去做点什么的那几种照说，见下面三条和
# farm/queue.py 的 `_told`。「等不到」和「等一会」是两回事：显卡的架构对不上是装好就定死的，再等也不会开始，
# 这种情况若还写着「有机器能算时自动开始」，用户只能干等。
"N-QUEUE-NOMACHINEEVER" = "这台服务器上没有能算它的机器：它不会自己开始，请取消它，或者请管理员检查这个项目的环境"
# 「机器」不是「显卡」：用户永远看不到卡，哪张卡、为什么，是管理员那一格
# （Job.waiting_detail，N-GPU-NOCARD）。这一句和 NOMACHINEEVER 的区别是「要有人去打开」对「换不了」。
"N-QUEUE-NOCARD" = "还没有能接任务的机器：管理员打开之后它才会开始；请联系管理员"
"N-QUEUE-BEHIND" = "排队中：前面还有 {ahead:d} 个任务，轮到它就自动开始"
"N-QUEUE-GPUOFF" = "显卡任务暂停中（管理员关了显卡）：排着的任务先等着，管理员重新打开显卡任务后接着算"
"N-QUEUE-WAITRAM" = "等内存：要 {need:.0f} GB，现在可用 {free:.0f} GB"
"W-QUEUE-NEVERRAM" = "「{node}」要 {need:.0f} GB 内存，这台机器一共只有 {total:.0f} GB：它永远等不到，别的节点不等它。请取消任务，换一档更省内存的参数，或者请管理员检查这个节点声明的内存"
"N-QUEUE-ACCOUNTDELETED" = "这个账号已被管理员删除"
"E-QUEUE-STILLSTOPPING" = "这个账号还有 {count:d} 个任务在 {seconds:.0f} 秒内没有停下：账号已停用，过一会儿再删除一次"
"N-QUEUE-SERVEREND" = "服务结束，任务停下了：算好的节点留在缓存里，再点「计算」接着算"
# 按节点调度（farm/scheduler/pools.py）：节点等名额时为什么还在等。都是等一等自己就好的，只写进管理员那一格
"N-QUEUE-TASKGPUS" = "这个任务已经同时占着 {most:d} 张卡（单任务最多占卡数）：等它的一个显卡节点算完"
"N-QUEUE-TASKCPUS" = "这个任务已经同时在算 {most:d} 个不用显卡的节点（单任务 CPU 节点上限）：等其中一个算完"
"N-QUEUE-CPUBUSY" = "整台机器同时最多算 {most:d} 个不用显卡的节点（全局 CPU 节点上限），现在都满着：等一个算完"
"E-QUEUE-NODETIMEOUT" = "「{node}」算了超过 {minutes:g} 分钟（单节点超时），已经停下：用到它的节点跳过，别的照常算完。确实要算这么久的，请管理员在设置里调长「单节点超时」"

