"E-WORKER-NOWEIGHTS" = "「{node}」选的模型还没有下载：{weight}。管理员执行 lab2shot ext install {extension}"
"E-WORKER-GATEDWEIGHTS" = "「{node}」选的模型还没有下载：{weight}。先在 {page} 申请权限，通过后管理员执行 lab2shot ext install {extension}"
"E-WORKER-GPUARCH" = "这个扩展包环境的 PyTorch（{torch}）没编译出这块显卡（compute capability {capability}）的核心，不是显存不够：管理员换一块这个扩展包支持的显卡接任务，或重装扩展包换新版 PyTorch"
"E-WORKER-FAILED" = "「{node}」计算失败（编号 {code}）：\n{detail}"

# ---- 队列（farm/queue.py）
"E-FARM-INTERNAL" = "内部错误：{detail}。这是程序的问题，原因写在服务日志里，请把日志发给开发者"

# ---- 用法检查（nodes/expects.py）：能算，但可能不是你要的
# 方法的前提（算之前就知道、算了也过不去）：B 级，节点在提交前拦下
"B-EXPECT-FEWFRAMES" = "「{node}」至少要 {need} 帧画面才能算，接进来的「{source}」只有 {count} 帧：接一段更长的镜头，或者把帧范围放宽"
"B-EXPECT-FEWFRAMESSTEP" = "「{node}」至少要 {need} 帧画面才能算，「{source}」的 {count} 帧按「隔帧」{step} 取样后只剩 {used} 帧：把「隔帧」调小，或者接一段更长的镜头"
"W-DEPTH-DISPARITY" = "「{source}」自己写着它是视差（距离的倒数，只知道远近顺序），不是距离：反投影出来的三维是变形的。在中间插入「深度对齐」，参考接一张真实尺度的深度图，换算成距离再用"
"W-EXPECT-SEVERALPEOPLE" = "「{source}」找到 {count} 个人，每个人都会算一遍（背景里的路人、断开的人物框也各算一个）：只要其中几个，在中间插入「选人」"
"W-EXPECT-FRAMES" = "「{source}」只有第 {span} 帧，「{plate}」的 {count} 帧（如第 {first} 帧）不在里面：这些帧上没有它"
"W-EXPECT-CAMERAFRAMES" = "「{source}」只有第 {span} 帧，「{plate}」的 {count} 帧（如第 {first} 帧）不在里面：这些帧它停在最近的一帧"
"W-EXPECT-SIZE" = "「{source}」是 {width}×{height}，「{plate}」是 {plate_width}×{plate_height}：不像同一段画面（或者缩放过）"
"W-EXPECT-ASPECT" = "「{source}」的画面是 {width}×{height}（{aspect:.2f}:1），「{plate}」是 {plate_width}×{plate_height}（{plate_aspect:.2f}:1）：比例不同，相机的画框和画面对不上（画面裁切、加边过，或者相机不是按这段画面设的）"
"W-EXPECT-OWNCAMERA" = "「{source}」的深度图是相对尺度，只和它自己解出的相机对得上；接的是「{camera}」的相机，位置会整体放大或缩小"
"W-EXPECT-NOTMETRIC" = "「{source}」的深度图是{scale}，不是真实厘米：距离按它自己的数值算；先接「深度对齐」就能按真实距离填"
"W-EXPECT-ALREADY" = "「{source}」已经是{value}，原样输出"
"W-EXPECT-UNKNOWNPEOPLE" = "「{source}」里没有 {unknown} 号（有 {people} 号）：检查「人物编号」"
"W-EXPECT-NOTHDR" = "「{source}」是 {format} 图像，不是 HDR：它的 0–255 会被当成光的强度，结果会过亮；换 EXR / HDR 的环境图"
"B-EXPECT-MANYFRAMES" = "「{node}」一次只算 {most} 帧：「{source}」有 {count} 帧。中间接一个「FrameHold」自己挑一帧（环境看得最全、人挡得最少的那一帧）"

