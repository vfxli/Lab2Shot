"B-GRAPH-NOWIREANY" = "「{node}」的 {inputs} 一个都没有接线：接上其中一个再计算"

# ---- 接线（engine/graph.py wire_problem）：接错的线由它接进的节点报。单根线的原因（B-WIRE-WAITS、-GONE、-CONVERT、-TYPE、
# -REFUSED、-UNIT）和网页共用，在 web.toml
"B-WIRE-SEVERAL" = "有 {count} 根线接得不对：{problems}"
# 几根线都只是在等你挑（导入节点还没选模型 / 相机）时，不许说「接得不对」——线没接错，是还没挑
"B-WIRE-WAITSEVERAL" = "有 {count} 处还等你挑：{problems}"

# ---- 逐项处理块（engine/scopes.py rules、engine/evaluation.py）：块的规则由服务器算出，网页只读
"B-EACH-LEAK" = "「{node}」的「{input}」接的是逐项处理块「{block}」内的「{source}」。块内每个条目各有一份结果，块外节点无法确定使用哪一份。块内的结果需经过「逐项结束」再接出块。"
"B-EACH-OUTSIDE" = "「{node}」的「{input}」接的是块外的「{source}」。「逐项结束」只收集块「{block}」内每个条目的结果；块外的数据接到使用它的节点上即可，不经过「逐项结束」。"
"B-EACH-CROSS" = "逐项处理块「{block}」和「{other}」交叉，「{node}」的接线跨过了块的边界。两个块共用节点时，内层块的开始、结束和块内节点都需在外层块内。"
"B-EACH-UNPAIRED" = "「{node}」没有配对的逐项处理块「{block}」。一个块需要块名相同的一个「逐项开始」和至少一个「逐项结束」；请检查两端节点的「块名」。"
"B-SWITCH-TYPES" = "「{node}」的「{input}」接的是{got}，另一路是{other}。切换的各路要接同一种数据，输出的类型才是确定的。"
"N-EACH-OUTSIDE" = "「{node}」跳过了条目「{item}」：这一条的帧都不在帧范围 {lo}–{hi} 里。其余条目照常计算；要算这一条就放宽帧范围。"
"W-EACH-FAILED" = "「{node}」收集时缺少 {count} 个条目：{items}。这些条目在块内出错或已跳过，不在收集的列表中；其余条目照常收集。"
"I-EACH-ITEMFAILED" = "{name}（根源是「{root}」）"

