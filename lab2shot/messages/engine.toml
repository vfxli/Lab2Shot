# 计算（lab2shot/engine、lab2shot/farm/queue.py）和用法检查（lab2shot/nodes/expects.py）。
# 一行一条：编号 = 模板。写法：谁估的、和什么比、数字和单位、意味着什么、怎么办。

# ---- 计算一个节点（engine/cook.py）
"E-COOK-FAILED" = "「{node}」出错：{reason}"
"E-COOK-NODELIVERY" = "「{node}」没有地方交付：这次计算不是从队列提交的（脚本或测试绕过队列调用了引擎），交付要经过队列，结果才能交给提交的人"
"E-COOK-PROBLEM" = "{detail}"
"N-COOK-NOTHINGIN" = "「{node}」这次没有算：必需的「{input}」是空的（「{source}」这次没有给出数据，看它的提醒）。它的输出也是空的；上游给出数据以后再算就有了"
"N-COOK-SKIPPED" = "「{node}」已跳过：它必需的「{input}」来自出错的「{root}」。先看「{root}」的错误，改好后再算"
"E-COOK-UNAVAILABLE" = "「{node}」现在用不了：{reason}。接在它后面的节点跳过；「输出」照常交出其他接好的结果"
"N-COOK-OVERSCAN" = "「{node}」只处理画面里的像素：输入「{input}」画面外还有 左 {left} 上 {top} 右 {right} 下 {bottom} 像素（overscan），这些没有算，往下交付的结果里也没有"
"W-INPUT-UNUSED" = "「{node}」没有用上「{input}」：{reason}。主结果照常算出，只是少了它；修好后再算会用上"
"N-INPUT-NOTHING" = "「{node}」的「{input}」是空的（「{source}」这次没有给出数据），当作没接：结果照常算出"
"I-INPUT-FAILED" = "接给它的「{source}」出错了"
"I-INPUT-SKIPPED" = "接给它的「{source}」已跳过（根源是出错的「{root}」）"
"E-COOK-WIRED" = "「{node}」的{reason}"
"E-COOK-MISSINGOUTPUT" = "「{node}」没有产出 {ports}：节点的代码漏写了这些输出，是程序的问题，请把日志发给开发者"
"E-COOK-CONTRACT" = "「{node}」的输出「{output}」不符合{kind}的约定：{problems}。这是节点代码的问题，请把日志发给开发者"
"E-COOK-OUTPUTTYPE" = "类型是 {got}，端口是 {want}"
"E-COOK-NOSUCHOUTPUT" = "交出了一个不存在的输出 {output}"
"E-COOK-OUTPUTSIZE" = "尺寸 {width}×{height} 和输入画面 {plate_width}×{plate_height} 不一样"
# the output covers the plate frame but keeps other pixels around it than the picture did (data/contracts.py settle)
"E-COOK-OUTPUTWINDOW" = "保留的像素范围是 {window}，输入画面的是 {want}：不改像素位置的节点要么原样保留，要么只算原画框"
"W-COOK-NONCOMMERCIAL" = "写出的结果用到了非商用部分（{projects}）：只能用于研究和评估，不能交给商业项目"

