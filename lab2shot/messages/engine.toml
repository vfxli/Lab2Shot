"B-DELIVER-NOPATH" = "「{node}」还没有设置「{setting}」：选一个保存的位置（命令行和 DCC 插件给一个路径）"
"B-DELIVER-NOTWIRED" = "「{node}」没有接到「输出」：它只设置怎么写，文件由「输出」交付，把它的「文件」接到一个「输出」上"
"B-DELIVER-BADNAME" = "「{node}」的名字「{name}」不能当文件夹名：不能空着，不能带 / \\ : * ? \" < > |"
"B-DELIVER-NAMED" = "{outputs}都叫 {name}"
"B-DELIVER-SAMENAME" = "「{node}」里有同名的（{same}）：每个一个子文件夹，名字要不一样"

