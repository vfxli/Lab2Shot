"E-GRAPH-FRAMES" = "帧范围要写成 [起始帧, 结束帧]，都是整数，起始帧不大于结束帧：现在是 {frames}"
"E-GRAPH-UNKNOWNTYPE" = "未知节点类型 {type}：{reason}"
"E-GRAPH-PARAMS" = "节点 {node} 的参数不对：{reason}"
"E-GRAPH-PROMOTEDTWICE" = "节点 {node}：promoted 里有重复的参数"
"E-GRAPH-NOSUCHWIRENODE" = "连线指向不存在的节点：{source} → {target}"
"E-GRAPH-NOSUCHPORT" = "端口不存在：{source}.{output} → {target}.{input}"
"E-GRAPH-NOTPROMOTED" = "端口不存在：{source}.{output} → {target}.{input}（这个参数没有提升到节点：节点的 promoted 里要有它）"
"E-GRAPH-NONODE" = "节点图里没有节点 {node}"
"E-GRAPH-BADJSON" = "{file} 不是有效的 JSON：{detail}"
"E-GRAPH-SCHEMA" = "{file} 不是 Lab2Shot 节点图（schema 不是 {schema}）"
"E-GRAPH-NOTFILE" = "不是节点图文件：{path}（要一个 .json 的节点图文件）"
"B-GRAPH-ONEWIRE" = "「{node}」的「{input}」只能接一根线"
"B-GRAPH-CYCLE" = "节点图里有环：某个节点的输出绕回了它自己的输入，断开环上的一根线"
