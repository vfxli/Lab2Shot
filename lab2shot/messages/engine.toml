# ---- 列表（engine/graph.py）
"B-WIRE-LIST" = "「{source}」的「{output}」是{got}，接到「{node}」的「{input}」（{want}）上：列表和单个不能相接。要逐条处理接「逐项开始」，只要其中一条接「取一条」，几份合成一条列表接「合成列表」。"
"B-SWITCH-PERFRAME" = "「{node}」的条件每帧不一样（来自「{source}」）：切换整段只能走一路。把条件换成整段一个值（比如「拆分相机」关掉「逐帧」，或者用「比较」比一个整段的值）"
"B-LIST-NESTED" = "「{source}」的「{output}」已经是{got}，「{node}」的「{input}」会再装一层：列表只有一层。要把内层的条目并到一起，用「逐项结束」（它会把内层列表摊平，条目名写成「外层/内层」）。"
# 输出口现在用不上（Port.applies）：网页也说这一句，所以它在 tools/messages_web.py 的 FROM_SERVER 里。
# 这句不写具体怎么办：用不上的原因各不相同（比如选无畸变镜头模型时的「镜头模型」「畸变系数」口），
# 该怎么办由 {why} 那一句说（和输入口的 B-WIRE-INACTIVE 一样）

"B-WIRE-OUTINACTIVE" = "「{source}」的「{output}」现在接不出去：{why}"
