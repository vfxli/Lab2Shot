[release.admin]
zh = [
    "升级流程改为先运行「./setup.sh stop」，手动「git pull --ff-only」，再运行「./setup.sh update」；升级程序使用已拉取的新版脚本，负责备份、同步环境、检查、迁移与启动，失败回退到上次部署版本",
    "升级前停止服务并备份工作目录；数据库由 v5 升至 v10，可运行「lab2shot db upgrade」，迁移前自动备份；一键更新仍会执行静态检查、数据库升级和完整性检查",
    "升级后在后台检查扩展包状态，并重新安装显示「需要重装」的扩展；FBX 接入层接口已更新，需要重装",
    "节点结果版本已更新：动作重定目标、Pixel3DMM、USD 读写、时间偏移、Track4World、边缘解混合等旧缓存会按新版本重新计算；Pixel3DMM 的旧摄影机包需要重新解算，仅刷新网页不会更新它",
    "引擎统一选路、需求、实例状态和缓存失效规则；逐项块按实例管理结果，许可与成本也按接线传入的实际选项计算",
    "服务端统一归属与权限检查，登录按账号隔离等待，轮询读取快照，事件聚合与缓存有上限；修正跨线程数据位置串扰导致结果消失的问题",
    "账号删除与管理记录以账号 ID 关联，修正反馈附件泄露登录标识和二级管理员读取管理员在线设备的问题",
    "移除「按模板」使用统计及任务中的来源模板字段；保留其他使用统计。此次升级会移除对应的旧数据库列",
    "许可按模型、模型权重和训练数据分别登记；部分模型改为仅限研究，标准人及部分人体模型需要注册并同意其许可",
    "光照模板交付 HDRI；移除「HDRI 转穹顶灯」节点及其 USD 交付路线",
]
en = [
    "Upgrading now means running \"./setup.sh stop\", then \"git pull --ff-only\" by hand, then \"./setup.sh update\"; the upgrade uses the newly pulled script, backs up, syncs the environment, checks, migrates and starts, and rolls back to the last deployed version if it fails",
    "The service is stopped and the work folder backed up before upgrading; the database goes from v5 to v10 (\"lab2shot db upgrade\", backed up before migrating); the one-click update still runs the static checks, the database upgrade and the integrity check",
    "After upgrading, check the extensions in the back office and reinstall those marked \"Needs Reinstall\"; the FBX bridge's interface changed and needs a reinstall",
    "Node result versions updated: old caches of motion retargeting, Pixel3DMM, USD read and write, Time Shift, Track4World, edge unmixing and others are cooked again; Pixel3DMM's old camera packets must be solved again, refreshing the page does not update them",
    "The engine has one rule for path choice, requirements, instance state and cache invalidation; for-each blocks keep results per instance, and licenses and costs follow the options actually wired in",
    "The server checks ownership and permissions in one place, logins wait per account, polling reads snapshots, event batching and caches are bounded; fixed results disappearing when data locations crossed threads",
    "Account deletion and admin records refer to the account ID; fixed feedback attachments leaking login identifiers and deputy administrators reading administrators' signed-in devices",
    "Removed the By Template usage statistics and the source template field of jobs; the other usage statistics stay. This upgrade removes the old database columns",
    "Licenses are registered separately for models, model weights and training data; some models are now Research Only, and Standard Human and some body models need registration and agreement to their licenses",
    "Lighting templates deliver an HDRI; the HDRI to Dome Light node and its USD delivery path are removed",
]

