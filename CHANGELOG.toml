# Release notes: what the top bar's "Release Notes" dialog shows, read only from this file (lab2shot/releases.py reads
# it once when the service starts).
#
# To publish a version, add one [[release]] at the top (below project); no code changes:
#   name     what this version is called              { zh = "…", en = "…" }
#   date     YYYY-MM-DD, without quotes
#   about    one sentence                             { zh = "…", en = "…" }
#   [release.changes]   for everyone, one line each, only what users care about (none: zh = [] and en = [])
#     zh = ["…", …]
#     en = ["…", …]     the same lines as zh, in the same order
#   [release.admin]     optional: shown only to administrators and deputy administrators (the back office, operations,
#     zh = ["…", …]     security fixes); the same shape as changes
#     en = ["…", …]
# Every text is written in both languages (the page shows the one it speaks, as a built-in template's words). Newest
# first; no name twice. Run `lab2shot check releases` after editing. The page shows the text as plain text: HTML tags
# have no effect.

project = "https://github.com/vfxli/Lab2Shot"

[[release]]
name = { zh = "0.1.0 Alpha 1", en = "0.1.0 Alpha 1" }
date = 2026-10-05
about = { zh = "首个公开版本：摄影机、三维高斯、AI 重定目标与模型集成", en = "First public release: cameras, 3D Gaussians, AI retargeting and model ensembles" }

