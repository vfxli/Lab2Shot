# 更新说明：网页顶部栏「更新说明」弹窗里显示的内容，只从这个文件来（lab2shot/releases.py 在服务启动时读一次）。
#
# 发新版本时，只在最上面（project 下面）加一段 [[release]]，代码不用改：
#   name     名称：这一版叫什么
#   date     日期：YYYY-MM-DD，不加引号
#   about    说明：一句话
#   changes  更新：给所有用户看的，每条一行，只写用户关心的（没有可写的就写 []）
#   admin    给后台看的（可以不写）：只有管理员和二级管理员在弹窗里看得到，写后台、运维、安全修复这类
# 最新的写在最上面；名称不能重复。改完运行 `lab2shot check releases` 检查格式。
# 这里的文字在网页上只按纯文字显示，写 HTML 标签也不会生效。

project = "https://github.com/vfxli/Lab2Shot"

[[release]]
name = "应用模式与动作重定向"
date = 2026-10-01
about = "第三版"
changes = [
    "新增「应用模式」：模板有独立参数界面，按使用顺序填写；检测、解算、载入角色、重定向、打包可分步操作，与节点模式一键切换",
    "60 张模板重新整理参数和节点图；与当前选择无关的参数自动隐藏；新增「整理节点图」，可整理整张图或选中的节点，并支持撤销",
    "动作生成、补帧、动捕和清理模板支持重定向到导入的 FBX / USD 角色；全身动捕模板统一选择相机来源、目标角色和交付结果",
    "动作重定向重新实现：自动识别骨架结构，支持扭转骨、脚趾及只配手的骨架；水平位移按原比例，髋高可按腿长、身高或臂长调整，支持脚底对齐和高度偏移",
    "「对应关系」弹窗可直接调整两侧基准姿势：选择关节，移动、旋转、缩放、左右镜像、复位，并预览蒙皮；确定后一步撤销，取消不写入",
    "三维骨架增加实体和线框两种画法；骨骼粗细、骨点大小、自适应大小和关节名称可调，相机路径可单独显示或隐藏",
    "三维操作改为左键旋转、中键平移、右键左右拖动缩放；二维支持右键拖动缩放，右键单击删除点的操作保留",
    "视图始终显示当前激活节点自己的输出；模型增加「显示背面」开关，透过相机看时可调叠加透明度与颜色",
    "修正 USD 相机片门偏移和三维背板的位置，Pixel3DMM 面部结果与画面正确对齐；面部动作交付的 USD 保留表情和关节动画",
    "表情重定向明确限定为 ARKit52；三张面部模板移除不适用的重定向段，Pixel3DMM 不再单独输出不完整的表情曲线",
    "切换节点支持增减路线、修改路线名；未选路线不计算，交付只记录实际使用的来源；按住 Ctrl 点击已连线的口，可将整组连线移到另一个口",
    "参数界面支持分组、拖动排序，以及按条件隐藏或禁用；按钮可公开到应用模式，也可显示在节点上",
    "顶栏常驻上传和下载速度；上传素材时显示进度并可取消；提交期间防止重复计算，秒算完成的任务显示完成提示",
    "模板搜索覆盖全部分类；卡片展示默认路线的许可，并标出是否存在可商用路线；许可统一分为可商用、非商用、仅限研究三档",
    "图像模板统一交付多层 EXR；抠像模板包含修正后前景、原始前景和 alpha；输出名称、帧率可接线，读取序列支持首末帧",
    "修正 Track4World 尺寸和跟踪点投影、FBX 骨架层级与可见性、Alembic 帧率与子采样、BVH 编码和空行等格式问题；改善取帧、点云缓存和并发计算稳定性",
]
admin = [
    "升级流程改为先运行「./setup.sh stop」，手动「git pull --ff-only」，再运行「./setup.sh update」；升级程序使用已拉取的新版脚本，负责备份、同步环境、检查、迁移与启动，失败回退到上次部署版本",
    "升级前停止服务并备份工作目录；数据库由 v5 升至 v10，可运行「lab2shot db upgrade」，迁移前自动备份；一键更新仍会执行静态检查、数据库升级和完整性检查",
    "升级后在后台检查扩展包状态，并重新安装显示「需要重装」的扩展；FBX 接入层接口已更新，需要重装",
    "节点结果版本已更新：动作重定向、Pixel3DMM、USD 读写、FrameHold、Track4World、边缘解混合等旧缓存会按新版本重新计算；Pixel3DMM 的旧相机包需要重新解算，仅刷新网页不会更新它",
    "引擎统一选路、需求、实例状态和缓存失效规则；逐项块按实例管理结果，许可与成本也按接线传入的实际选项计算",
    "服务端统一归属与权限检查，登录按账号隔离等待，轮询读取快照，事件聚合与缓存有上限；修正跨线程数据位置串扰导致结果消失的问题",
    "账号删除与管理记录以账号 ID 关联，修正反馈附件泄露登录标识和二级管理员读取管理员在线设备的问题",
    "移除「按模板」使用统计及任务中的来源模板字段；保留其他使用统计。此次升级会移除对应的旧数据库列",
    "许可按模型、权重和训练数据分别登记；部分模型改为仅限研究，标准人及部分人体模型需要注册并同意其许可",
    "光照模板交付 HDRI；移除「HDRI 转穹顶灯」节点及其 USD 交付路线",
]

