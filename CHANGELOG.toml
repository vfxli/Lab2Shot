# 更新说明：网页顶部栏「更新说明」弹窗里显示的内容，只从这个文件来（lab2shot/releases.py 在服务启动时读一次）。
#
# 发新版本时，只在最上面（project 下面）加一段 [[release]]，代码不用改：
#   name     名称：这一版叫什么
#   date     日期：YYYY-MM-DD，不加引号
#   about    说明：一句话
#   changes  更新：给所有用户看的，每条一行，只写用户关心的（没有可写的就写 []）
#   admin    给后台看的（可以不写）：只有管理员和二级管理员在弹窗里看得到，写后台、运维、安全修复这类
# 最新的写在最上面；名称不能重复。改完运行 `lab2shot check releases` 检查格式。
# 这里的文字在网页上只按纯文字显示，写 HTML 标签也不会生效。

