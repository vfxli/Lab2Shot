[project]
name = "lab2shot"
version = "0.1.0"
description = "The last mile from ML research papers to CG production: DCC-ready USD from paper code."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.13,<3.14"
dependencies = [
    "usd-core>=26.8",
    "opencolorio>=2.5",
    "openimageio>=3.1",
    "av>=15",
    "numpy>=2.2",
    "typer>=0.15",
    "pydantic>=2.10",
    "rich>=13",
    "huggingface_hub>=0.30",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    # Worker SDK: the job protocol and file formats shared by the server and workers. It is also
    # installed into every extension environment and depends only on NumPy.
    "lab2shot-worker",
    "cryptography>=45",
]

[project.scripts]
lab2shot = "lab2shot.cli:app"

[tool.uv.sources]
lab2shot-worker = { path = "worker_sdk", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lab2shot"]
